<text x='40.0' y='80.0' font-size='15' fill='#5dade2' text-anchor='start' font-weight='bold'>interstitial fluid</text>
<text x='660.0' y='80.0' font-size='14' fill='#aab4c0' text-anchor='end' font-weight='normal'>anchoring filaments hold it open</text>
<text x='40.0' y='330.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>Fluid pressure outside pushes the edge flaps in; pressure inside pushes them shut.</text>
<text x='40.0' y='351.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>More permeable than blood capillaries, no basement membrane.</text>
<text x='40.0' y='372.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>None in nervous tissue, bone marrow, cartilage, cornea or epidermis.</text>
