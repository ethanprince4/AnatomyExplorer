<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 520' width='720' height='520' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Renin-angiotensin-aldosterone, ADH and ANH</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Long-term control: hormones that change blood volume</text>
<rect x='30.0' y='70.0' width='300.0' height='56.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.14'/>
<text x='180.0' y='93.6' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Blood pressure falls</text>
<text x='180.0' y='114.3' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>detected in the kidney</text>
<rect x='30.0' y='150.0' width='300.0' height='56.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='180.0' y='173.6' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Kidney releases RENIN</text>
<text x='180.0' y='194.3' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>(less renin when BP rises)</text>
<rect x='30.0' y='230.0' width='300.0' height='56.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='180.0' y='254.1' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Angiotensinogen → angiotensin I</text>
<text x='180.0' y='272.4' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>renin does this (liver protein)</text>
<rect x='30.0' y='310.0' width='300.0' height='56.0' rx='8' stroke='#f4d03f' fill='#f4d03f' stroke-width='2' fill-opacity='0.14'/>
<text x='180.0' y='334.1' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Angiotensin I → angiotensin II</text>
<text x='180.0' y='352.4' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>ACE (in lungs) · ACE inhibitors block</text>
<line x1='180.0' y1='126.0' x2='180.0' y2='141.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='180.0,150.0 174.5,140.5 185.5,140.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='180.0' y1='206.0' x2='180.0' y2='221.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='180.0,230.0 174.5,220.5 185.5,220.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='180.0' y1='286.0' x2='180.0' y2='301.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='180.0,310.0 174.5,300.5 185.5,300.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='180.0' y1='366.0' x2='180.0' y2='383.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='180.0,392.0 174.5,382.5 185.5,382.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<rect x='30.0' y='392.0' width='300.0' height='70.0' rx='8' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.14'/>
<text x='180.0' y='413.9' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Vasoconstriction + aldosterone</text>
<text x='180.0' y='432.2' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>kidney keeps Na⁺ &amp; water</text>
<text x='180.0' y='450.6' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ volume ↑, BP ↑</text>
<rect x='390.0' y='70.0' width='300.0' height='92.0' rx='8' stroke='#bb8fce' fill='#bb8fce' stroke-width='2' fill-opacity='0.14'/>
<text x='540.0' y='93.8' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>ADH (vasopressin) — textbook</text>
<text x='540.0' y='112.1' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>posterior pituitary, when BP falls a lot</text>
<text x='540.0' y='130.4' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>or blood osmolality rises</text>
<text x='540.0' y='148.7' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ kidney keeps water; vasoconstriction</text>
<rect x='390.0' y='200.0' width='300.0' height='112.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.14'/>
<text x='540.0' y='224.7' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>ANH — the opposite</text>
<text x='540.0' y='243.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>atria stretch (venous return ↑)</text>
<text x='540.0' y='261.2' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ more urine &amp; Na⁺ loss</text>
<text x='540.0' y='279.6' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ vasodilation, PR ↓</text>
<text x='540.0' y='297.9' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ BP falls</text>
<rect x='390.0' y='345.0' width='300.0' height='117.0' rx='8' stroke='#aab4c0' fill='#aab4c0' stroke-width='2' fill-opacity='0.14'/>
<text x='540.0' y='372.1' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Kidney's direct effect</text>
<text x='540.0' y='390.4' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>BP &amp; volume ↑ → urine ↑</text>
<text x='540.0' y='408.8' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>BP &amp; volume ↓ → urine ↓</text>
<text x='540.0' y='427.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>fluid shift &amp; stress-relaxation</text>
<text x='540.0' y='445.3' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>help within minutes–hours</text>
<text x='360.0' y='500.0' font-size='14' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Renin is released when BP falls · ANH is released when the atria are stretched</text>
</svg>
