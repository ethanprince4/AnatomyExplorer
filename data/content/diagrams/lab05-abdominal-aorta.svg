<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Branches of the abdominal aorta in order</title><defs><marker id="ah-58d68d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58d68d"/></marker><marker id="ah-5dade2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5dade2"/></marker><marker id="ah-aab4c0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab4c0"/></marker><marker id="ah-bb8fce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bb8fce"/></marker><marker id="ah-c9d1dc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1dc"/></marker><marker id="ah-e8ecf1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8ecf1"/></marker><marker id="ah-f1948a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f1948a"/></marker><marker id="ah-f4d03f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4d03f"/></marker><marker id="ah-f5b041" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5b041"/></marker><marker id="ah-ff6b6b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker></defs>
<line x1="420.0" y1="40.0" x2="420.0" y2="520.0" stroke="#ff6b6b" fill="none" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
<text x="490.0" y="50.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">diaphragm (T12)</text>
<line x1="360.0" y1="45.0" x2="480.0" y2="45.0" stroke="#aab4c0" fill="none" stroke-width="2" stroke-linecap="round" opacity="1.0" stroke-dasharray="5 4"/>
<line x1="420.0" y1="70.0" x2="530.0" y2="70.0" stroke="#ff6b6b" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<line x1="420.0" y1="70.0" x2="310.0" y2="70.0" stroke="#ff6b6b" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<text x="538.0" y="75.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">inferior phrenic</text>
<text x="538.0" y="92.0" font-size="11" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">diaphragm</text>
<line x1="420.0" y1="110.0" x2="530.0" y2="110.0" stroke="#f5b041" fill="none" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<text x="538.0" y="115.0" font-size="14" stroke="none" fill="#f5b041" text-anchor="start" font-weight="bold" opacity="1.0">coeliac trunk (T12)</text>
<text x="538.0" y="132.0" font-size="11" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">left gastric · splenic · common hepatic</text>
<line x1="420.0" y1="170.0" x2="530.0" y2="170.0" stroke="#f5b041" fill="none" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<text x="538.0" y="175.0" font-size="14" stroke="none" fill="#f5b041" text-anchor="start" font-weight="bold" opacity="1.0">superior mesenteric (L1)</text>
<text x="538.0" y="192.0" font-size="11" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">small intestine, caecum, ascending &amp; part of transverse colon</text>
<line x1="420.0" y1="215.0" x2="530.0" y2="215.0" stroke="#ff6b6b" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<line x1="420.0" y1="215.0" x2="310.0" y2="215.0" stroke="#ff6b6b" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<text x="538.0" y="220.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">middle suprarenal</text>
<text x="538.0" y="237.0" font-size="11" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">adrenal glands</text>
<line x1="420.0" y1="250.0" x2="530.0" y2="250.0" stroke="#ff6b6b" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<line x1="420.0" y1="250.0" x2="310.0" y2="250.0" stroke="#ff6b6b" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<text x="538.0" y="255.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">renal (L1–L2)</text>
<text x="538.0" y="272.0" font-size="11" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">kidneys</text>
<line x1="420.0" y1="300.0" x2="530.0" y2="300.0" stroke="#ff6b6b" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<line x1="420.0" y1="300.0" x2="310.0" y2="300.0" stroke="#ff6b6b" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<text x="538.0" y="305.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">gonadal (L2)</text>
<text x="538.0" y="322.0" font-size="11" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">testes / ovaries</text>
<line x1="420.0" y1="340.0" x2="530.0" y2="340.0" stroke="#ff6b6b" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<line x1="420.0" y1="340.0" x2="310.0" y2="340.0" stroke="#ff6b6b" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<text x="538.0" y="345.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">lumbar</text>
<text x="538.0" y="362.0" font-size="11" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">posterior abdominal wall, back</text>
<line x1="420.0" y1="380.0" x2="530.0" y2="380.0" stroke="#f5b041" fill="none" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<text x="538.0" y="385.0" font-size="14" stroke="none" fill="#f5b041" text-anchor="start" font-weight="bold" opacity="1.0">inferior mesenteric (L3)</text>
<text x="538.0" y="402.0" font-size="11" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">distal transverse, descending, sigmoid colon, upper rectum</text>
<line x1="420.0" y1="495.0" x2="530.0" y2="495.0" stroke="#f5b041" fill="none" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<text x="538.0" y="500.0" font-size="14" stroke="none" fill="#f5b041" text-anchor="start" font-weight="bold" opacity="1.0">median sacral (at the bifurcation)</text>
<text x="538.0" y="517.0" font-size="11" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">sacrum and coccyx</text>
<line x1="420.0" y1="520.0" x2="300.0" y2="600.0" stroke="#ff6b6b" fill="none" stroke-width="10" stroke-linecap="round" opacity="1.0"/>
<line x1="420.0" y1="520.0" x2="540.0" y2="600.0" stroke="#ff6b6b" fill="none" stroke-width="10" stroke-linecap="round" opacity="1.0"/>
<text x="400.0" y="545.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="end" font-weight="normal" opacity="1.0">bifurcation (L4)</text>
<text x="550.0" y="600.0" font-size="13" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">common iliac → internal + external iliac</text>
<text x="40.0" y="110.0" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">Coeliac trunk:</text><text x="40.0" y="124.6" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">• left gastric (stomach,</text><text x="40.0" y="139.3" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">  oesophagus)</text><text x="40.0" y="153.9" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">• splenic (spleen, pancreas,</text><text x="40.0" y="168.6" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">  stomach)</text><text x="40.0" y="183.2" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">• common hepatic (liver,</text><text x="40.0" y="197.8" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">  gallbladder)</text>
<text x="40.0" y="290.0" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">Superior mesenteric:</text><text x="40.0" y="304.6" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">• jejunal &amp; ileal</text><text x="40.0" y="319.3" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">  (intestinal) arteries</text><text x="40.0" y="333.9" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">• ileocolic</text><text x="40.0" y="348.6" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">• right colic</text><text x="40.0" y="363.2" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">• middle colic</text>
<text x="20.0" y="30.0" font-size="18" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Abdominal aorta, top to bottom</text>
<text x="20.0" y="640.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">Amber = unpaired branches to the gut (coeliac, SMA, IMA) and median sacral; red = paired branches.</text>
</svg>
