<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 520' width='720' height='520' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Pressure, cross-sectional area and velocity along the circulation</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Along the systemic circuit</text>
<text x='360.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>pressure falls · total area peaks in capillaries · velocity is lowest there</text>
<text x='107.5' y='500.0' font-size='13' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Aorta</text>
<line x1='60.0' y1='90.0' x2='60.0' y2='480.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.4' stroke-dasharray='3 6'/>
<text x='202.5' y='500.0' font-size='13' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Arteries</text>
<line x1='155.0' y1='90.0' x2='155.0' y2='480.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.4' stroke-dasharray='3 6'/>
<text x='297.5' y='500.0' font-size='13' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Arterioles</text>
<line x1='250.0' y1='90.0' x2='250.0' y2='480.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.4' stroke-dasharray='3 6'/>
<text x='392.5' y='500.0' font-size='13' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Capillaries</text>
<line x1='345.0' y1='90.0' x2='345.0' y2='480.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.4' stroke-dasharray='3 6'/>
<text x='487.5' y='500.0' font-size='13' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Venules</text>
<line x1='440.0' y1='90.0' x2='440.0' y2='480.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.4' stroke-dasharray='3 6'/>
<text x='582.5' y='500.0' font-size='13' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Veins</text>
<line x1='535.0' y1='90.0' x2='535.0' y2='480.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.4' stroke-dasharray='3 6'/>
<text x='677.5' y='500.0' font-size='13' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Venae cavae</text>
<line x1='630.0' y1='90.0' x2='630.0' y2='480.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.4' stroke-dasharray='3 6'/>
<path d='M107.5,105.0 L202.5,114.0 L297.5,160.8 L392.5,175.2 L487.5,184.2 L582.5,189.6 L677.5,195.0' stroke='#ff6b6b' fill='none' stroke-width='3.5' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<text x='705.0' y='115.0' font-size='15' fill='#ff6b6b' text-anchor='end' font-weight='bold'>Blood pressure (100 → 0 mm Hg)</text>
<text x='309.5' y='184.8' font-size='13' fill='#ff6b6b' text-anchor='start' font-weight='normal'>biggest drop: arterioles</text>
<path d='M107.5,325.0 L202.5,322.3 L297.5,314.2 L392.5,235.0 L487.5,280.0 L582.5,317.8 L677.5,323.2' stroke='#bb8fce' fill='none' stroke-width='3.5' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<text x='64.0' y='245.0' font-size='15' fill='#bb8fce' text-anchor='start' font-weight='bold'>Total cross-sectional area</text>
<text x='410.5' y='250.0' font-size='13' fill='#bb8fce' text-anchor='start' font-weight='normal'>≈ 2500 cm² (aorta 5 cm²)</text>
<path d='M107.5,365.0 L202.5,387.5 L297.5,423.5 L392.5,452.3 L487.5,441.5 L582.5,419.0 L677.5,401.0' stroke='#58d68d' fill='none' stroke-width='3.5' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<text x='392.5' y='372.0' font-size='15' fill='#58d68d' text-anchor='middle' font-weight='bold'>Velocity of flow</text>
<text x='392.5' y='478.0' font-size='13' fill='#58d68d' text-anchor='middle' font-weight='normal'>slowest: time to exchange</text>
</svg>
