<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 400' width='720' height='400' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The three human portal systems</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>A portal vein: capillary bed → vein → second capillary bed</text>
<text x='360.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>No heart in between</text>
<rect x='20.0' y='90.0' width='220.0' height='220.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='130.0' y='176.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Hepatic portal</text>
<text x='130.0' y='195.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>GI capillaries</text>
<text x='130.0' y='215.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ liver sinusoids</text>
<text x='130.0' y='234.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>nutrients processed first</text>
<rect x='255.0' y='90.0' width='220.0' height='220.0' rx='8' stroke='#bb8fce' fill='#bb8fce' stroke-width='2' fill-opacity='0.14'/>
<text x='365.0' y='176.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Hypothalamo-hypophyseal</text>
<text x='365.0' y='195.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>hypothalamus</text>
<text x='365.0' y='215.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ anterior pituitary</text>
<text x='365.0' y='234.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>releasing hormones travel this way</text>
<rect x='490.0' y='90.0' width='220.0' height='220.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.14'/>
<text x='600.0' y='176.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Renal nephron portal</text>
<text x='600.0' y='195.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>glomerulus → peritubular</text>
<text x='600.0' y='215.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>capillaries / vasa recta</text>
<text x='600.0' y='234.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>inside the urine-forming units</text>
<text x='360.0' y='350.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Only these three in humans.  The hepatic one is the one you will be asked about most.</text>
<text x='360.0' y='378.0' font-size='14' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Pathologic AV anastomoses (injury/tumour) can dump arterial blood into veins and overload the heart.</text>
</svg>
