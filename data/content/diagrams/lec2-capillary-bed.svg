<path d='M300,206 C290,270 340,330 360,390 C375,430 395,360 400,206' stroke='#f5b041' fill='none' stroke-width='4' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<rect x='289.0' y='214.0' width='22.0' height='10.0' rx='3' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.9'/>
<path d='M365,206 C355,270 405,330 425,390 C440,430 460,360 465,206' stroke='#f5b041' fill='none' stroke-width='4' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<rect x='354.0' y='214.0' width='22.0' height='10.0' rx='3' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.9'/>
<path d='M430,206 C420,270 470,330 490,390 C505,430 525,360 530,206' stroke='#f5b041' fill='none' stroke-width='4' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<rect x='419.0' y='214.0' width='22.0' height='10.0' rx='3' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.9'/>
<text x='360.0' y='445.0' font-size='15' fill='#f5b041' text-anchor='middle' font-weight='bold'>true capillaries (arterial → venous end): flow is intermittent</text>
<line x1='150.0' y1='280.0' x2='218.8' y2='227.5' stroke='#58d68d' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='226.0,222.0 221.8,232.2 215.1,223.4' fill='#58d68d' stroke='#58d68d' stroke-width='1.5' fill-opacity='1.0'/>
<text x='40.0' y='290.0' font-size='15' fill='#58d68d' text-anchor='start' font-weight='bold'>precapillary</text>
<text x='40.0' y='308.8' font-size='15' fill='#58d68d' text-anchor='start' font-weight='bold'>sphincters</text>
<text x='40.0' y='327.5' font-size='15' fill='#58d68d' text-anchor='start' font-weight='bold'>open &amp; close</text>
<text x='360.0' y='484.0' font-size='13' fill='#aab4c0' text-anchor='middle' font-weight='normal'>glomus = an AV anastomosis with lots of smooth muscle (palms, soles, fingertips, nail beds)</text>
