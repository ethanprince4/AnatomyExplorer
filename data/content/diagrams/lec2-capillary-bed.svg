<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 500' width='720' height='500' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>A capillary network</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>A capillary network and its bypasses</text>
<path d='M60,190 C60,80 660,80 660,190' stroke='#f4d03f' fill='none' stroke-width='5' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0' stroke-dasharray='10 7'/>
<text x='360.0' y='92.0' font-size='15' fill='#f4d03f' text-anchor='middle' font-weight='bold'>arteriovenous anastomosis: skips the capillaries</text>
<path d='M30,200 L200,200' stroke='#ff6b6b' fill='none' stroke-width='14' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<text x='30.0' y='236.0' font-size='16' fill='#ff6b6b' text-anchor='start' font-weight='bold'>arteriole</text>
<path d='M520,200 L690,200' stroke='#5dade2' fill='none' stroke-width='14' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<text x='690.0' y='236.0' font-size='16' fill='#5dade2' text-anchor='end' font-weight='bold'>venule</text>
<path d='M200,200 L520,200' stroke='#bb8fce' fill='none' stroke-width='8' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<text x='360.0' y='180.0' font-size='15' fill='#bb8fce' text-anchor='middle' font-weight='bold'>metarteriole → thoroughfare channel</text>
