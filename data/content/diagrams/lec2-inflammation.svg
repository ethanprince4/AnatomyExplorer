<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 470' width='720' height='470' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The inflammatory response</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Inflammation: injury → mediators → three vessel changes</text>
<rect x='240.0' y='72.0' width='240.0' height='56.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.14'/>
<text x='360.0' y='95.6' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Tissue injury / infection</text>
<text x='360.0' y='116.3' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>cells release mediators</text>
<text x='360.0' y='150.0' font-size='14' fill='#aab4c0' text-anchor='middle' font-weight='normal'>histamine · kinins · prostaglandins · leukotrienes · complement</text>
<rect x='20.0' y='180.0' width='215.0' height='100.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.14'/>
<text x='127.5' y='216.1' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Vasodilation</text>
<text x='127.5' y='235.6' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>more blood →</text>
<text x='127.5' y='255.1' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>redness &amp; heat</text>
<rect x='252.0' y='180.0' width='215.0' height='100.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='359.5' y='216.1' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Permeability ↑</text>
<text x='359.5' y='235.6' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>plasma, fibrinogen,</text>
<text x='359.5' y='255.1' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>complement leak out</text>
<rect x='485.0' y='180.0' width='215.0' height='100.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.14'/>
<text x='592.5' y='216.1' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Chemotaxis</text>
<text x='592.5' y='235.6' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>neutrophils first,</text>
<text x='592.5' y='255.1' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>then macrophages</text>
<line x1='360.0' y1='160.0' x2='137.0' y2='179.2' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='128.0,180.0 137.0,173.7 138.0,184.7' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='360.0' y1='160.0' x2='360.0' y2='171.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='360.0,180.0 354.5,170.5 365.5,170.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='360.0' y1='160.0' x2='583.0' y2='179.2' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='592.0,180.0 582.0,184.7 583.0,173.7' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<rect x='252.0' y='310.0' width='215.0' height='70.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='359.5' y='341.1' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Fibrin walls off</text>
<text x='359.5' y='359.4' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>the infected area</text>
<line x1='360.0' y1='280.0' x2='360.0' y2='301.0' stroke='#f5b041' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='360.0,310.0 354.5,300.5 365.5,300.5' fill='#f5b041' stroke='#f5b041' stroke-width='1.5' fill-opacity='1.0'/>
<text x='20.0' y='410.0' font-size='15' fill='#e8ecf1' text-anchor='start' font-weight='normal'>Local signs: redness, heat, swelling, pain, loss of function.</text>
<text x='20.0' y='431.0' font-size='15' fill='#e8ecf1' text-anchor='start' font-weight='normal'>Systemic: + more neutrophils from marrow, fever (pyrogens); severe → shock.</text>
</svg>
