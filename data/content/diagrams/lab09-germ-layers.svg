<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>The three primary germ layers and what they form</title><defs></defs>
<text x="20.0" y="32.0" font-size="18" fill="#e8ecf1" text-anchor="start" font-weight="bold">Primary germ layers</text>
<text x="20.0" y="52.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">A three-layered embryonic disk in week three, and each layer's main derivatives</text>
<rect x="190.0" y="100.0" width="520.0" height="16.0" rx="4" stroke="#5dade2" fill="#5dade2" fill-opacity="0.5" stroke-width="1.5"/>
<rect x="190.0" y="118.0" width="520.0" height="16.0" rx="4" stroke="#ff6b6b" fill="#ff6b6b" fill-opacity="0.5" stroke-width="1.5"/>
<rect x="190.0" y="136.0" width="520.0" height="16.0" rx="4" stroke="#f4d03f" fill="#f4d03f" fill-opacity="0.5" stroke-width="1.5"/>
<text x="720.0" y="112.0" font-size="12" fill="#5dade2" text-anchor="start" font-weight="normal">ectoderm (outer)</text>
<text x="720.0" y="130.0" font-size="12" fill="#ff6b6b" text-anchor="start" font-weight="normal">mesoderm (middle)</text>
<text x="720.0" y="148.0" font-size="12" fill="#f4d03f" text-anchor="start" font-weight="normal">endoderm (inner)</text>
<text x="180.0" y="130.0" font-size="11" fill="#aab4c0" text-anchor="end" font-weight="normal">amniotic cavity above</text>
<text x="180.0" y="143.8" font-size="11" fill="#aab4c0" text-anchor="end" font-weight="normal">yolk sac below</text>
<rect x="15.0" y="200.0" width="270.0" height="210.0" rx="10" stroke="#5dade2" fill="#5dade2" fill-opacity="0.06" stroke-width="1.5"/>
<text x="150.0" y="228.0" font-size="16" fill="#5dade2" text-anchor="middle" font-weight="bold">Ectoderm</text>
<text x="32.0" y="258.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• epidermis of the skin, hair, nails</text>
<text x="32.0" y="286.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• brain, spinal cord and nerves</text>
<text x="32.0" y="314.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• (all nervous tissue)</text>
<text x="32.0" y="342.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• adrenal medulla</text>
<text x="32.0" y="370.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• lens of the eye, tooth enamel</text>
<rect x="315.0" y="200.0" width="270.0" height="210.0" rx="10" stroke="#ff6b6b" fill="#ff6b6b" fill-opacity="0.06" stroke-width="1.5"/>
<text x="450.0" y="228.0" font-size="16" fill="#ff6b6b" text-anchor="middle" font-weight="bold">Mesoderm</text>
<text x="332.0" y="258.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• bone and cartilage</text>
<text x="332.0" y="286.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• skeletal, cardiac and smooth muscle</text>
<text x="332.0" y="314.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• blood and vessels</text>
<text x="332.0" y="342.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• connective tissue, dermis</text>
<text x="332.0" y="370.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• kidneys and gonads</text>
<rect x="615.0" y="200.0" width="270.0" height="210.0" rx="10" stroke="#f4d03f" fill="#f4d03f" fill-opacity="0.06" stroke-width="1.5"/>
<text x="750.0" y="228.0" font-size="16" fill="#f4d03f" text-anchor="middle" font-weight="bold">Endoderm</text>
<text x="632.0" y="258.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• lining of the digestive tract</text>
<text x="632.0" y="286.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• lining of the respiratory tract</text>
<text x="632.0" y="314.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• liver and pancreas</text>
<text x="632.0" y="342.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• thyroid gland</text>
<text x="632.0" y="370.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">• lining of the bladder</text>
<text x="20.0" y="444.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">Mesoderm forms last, between the other two.</text>
</svg>
