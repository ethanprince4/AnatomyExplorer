<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 430' width='720' height='430' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The three tunics of a vessel wall</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Intima, media, externa: the same three layers, different amounts</text>
<circle cx='180.0' cy='230.0' r='150.0' stroke='#aab4c0' fill='none' stroke-width='2' fill-opacity='1.0'/>
<circle cx='180.0' cy='230.0' r='118.0' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.12'/>
<circle cx='180.0' cy='230.0' r='70.0' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.18'/>
<circle cx='180.0' cy='230.0' r='28.0' stroke='#f4d03f' fill='#f4d03f' stroke-width='2' fill-opacity='0.35'/>
<circle cx='180.0' cy='230.0' r='10.0' stroke='#e8ecf1' fill='#e8ecf1' stroke-width='1' fill-opacity='0.5'/>
<text x='180.0' y='234.0' font-size='13' fill='#e8ecf1' text-anchor='middle' font-weight='normal'>lumen</text>
<line x1='208.0' y1='230.0' x2='372.4' y2='124.8' stroke='#f4d03f' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<polygon points='380.0,120.0 374.9,129.8 369.0,120.5' fill='#f4d03f' stroke='#f4d03f' stroke-width='1.5' fill-opacity='1.0'/>
<text x='390.0' y='108.0' font-size='15' fill='#f4d03f' text-anchor='start' font-weight='normal'>Tunica intima</text>
<text x='390.0' y='128.0' font-size='15' fill='#f4d03f' text-anchor='start' font-weight='normal'>endothelium + basement membrane</text>
<text x='390.0' y='148.0' font-size='15' fill='#f4d03f' text-anchor='start' font-weight='normal'>+ lamina propria + internal elastic membrane</text>
<line x1='250.0' y1='200.0' x2='371.0' y2='209.3' stroke='#ff6b6b' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<polygon points='380.0,210.0 370.1,214.8 370.9,203.8' fill='#ff6b6b' stroke='#ff6b6b' stroke-width='1.5' fill-opacity='1.0'/>
<text x='390.0' y='198.0' font-size='15' fill='#ff6b6b' text-anchor='start' font-weight='normal'>Tunica media</text>
<text x='390.0' y='218.0' font-size='15' fill='#ff6b6b' text-anchor='start' font-weight='normal'>circular smooth muscle</text>
<text x='390.0' y='238.0' font-size='15' fill='#ff6b6b' text-anchor='start' font-weight='normal'>vasoconstriction / vasodilation</text>
<line x1='300.0' y1='300.0' x2='371.3' y2='317.8' stroke='#5dade2' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<polygon points='380.0,320.0 369.4,323.0 372.1,312.4' fill='#5dade2' stroke='#5dade2' stroke-width='1.5' fill-opacity='1.0'/>
<text x='390.0' y='308.0' font-size='15' fill='#5dade2' text-anchor='start' font-weight='normal'>Tunica externa (adventitia)</text>
<text x='390.0' y='328.0' font-size='15' fill='#5dade2' text-anchor='start' font-weight='normal'>connective tissue; vasa vasorum here</text>
<text x='390.0' y='348.0' font-size='15' fill='#5dade2' text-anchor='start' font-weight='normal'>merges with surrounding CT</text>
</svg>
