<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 470' width='720' height='470' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The three lines of defense</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Innate first, adaptive third</text>
<rect x='30.0' y='80.0' width='210.0' height='300.0' rx='8' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.14'/>
<text x='135.0' y='153.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>1st line</text>
<text x='135.0' y='173.7' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='135.0' y='194.5' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Physical barriers</text>
<text x='135.0' y='215.2' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>skin, mucous</text>
<text x='135.0' y='235.9' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>membranes, cilia</text>
<text x='135.0' y='256.7' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='135.0' y='277.4' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Chemicals</text>
<text x='135.0' y='298.2' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>acids, lysozyme,</text>
<text x='135.0' y='318.9' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>sebum, mucus</text>
<rect x='255.0' y='80.0' width='210.0' height='300.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='360.0' y='153.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>2nd line</text>
<text x='360.0' y='173.7' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='360.0' y='194.5' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Internal defenses</text>
<text x='360.0' y='215.2' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>phagocytes, NK cells</text>
<text x='360.0' y='235.9' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='360.0' y='256.7' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>complement,</text>
<text x='360.0' y='277.4' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>interferons</text>
<text x='360.0' y='298.2' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='360.0' y='318.9' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>inflammation, fever</text>
<rect x='480.0' y='80.0' width='210.0' height='300.0' rx='8' stroke='#bb8fce' fill='#bb8fce' stroke-width='2' fill-opacity='0.14'/>
<text x='585.0' y='153.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>3rd line</text>
<text x='585.0' y='173.7' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='585.0' y='194.5' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Adaptive immunity</text>
<text x='585.0' y='215.2' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>B cells → antibodies</text>
<text x='585.0' y='235.9' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>T cells → cell-mediated</text>
<text x='585.0' y='256.7' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='585.0' y='277.4' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>specific</text>
<text x='585.0' y='298.2' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>slower to start</text>
<text x='585.0' y='318.9' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>has memory</text>
<rect x='30.0' y='395.0' width='435.0' height='34.0' rx='6' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.18'/>
<text x='247.0' y='418.0' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>INNATE: non-specific, fast, no memory</text>
<rect x='480.0' y='395.0' width='210.0' height='34.0' rx='6' stroke='#bb8fce' fill='#bb8fce' stroke-width='2' fill-opacity='0.18'/>
<text x='585.0' y='418.0' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>ADAPTIVE</text>
</svg>
