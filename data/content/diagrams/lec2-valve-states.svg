<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 470' width='680' height='470' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>When the heart valves open and close</title>
<text x='340.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Valves open and close on pressure alone</text>
<text x='340.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Blood pushes them; nothing pulls them</text>
<text x='175.0' y='96.0' font-size='17' fill='#5dade2' text-anchor='middle' font-weight='bold'>Ventricle relaxed (filling)</text>
<rect x='50.0' y='115.0' width='160.0' height='95.0' rx='8' stroke='#aab4c0' fill='#aab4c0' stroke-width='2' fill-opacity='0.08'/>
<text x='130.0' y='168.0' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='normal'>Atrium</text>
<rect x='50.0' y='250.0' width='160.0' height='150.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.1'/>
<text x='130.0' y='335.0' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='normal'>Ventricle</text>
<rect x='245.0' y='115.0' width='70.0' height='135.0' rx='8' stroke='#aab4c0' fill='#aab4c0' stroke-width='2' fill-opacity='0.08'/>
<text x='280.0' y='142.0' font-size='14' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Artery</text>
<line x1='90.0' y1='210.0' x2='78.0' y2='262.0' stroke='#f4d03f' stroke-width='5' stroke-linecap='round' opacity='1.0'/>
<line x1='170.0' y1='210.0' x2='182.0' y2='262.0' stroke='#f4d03f' stroke-width='5' stroke-linecap='round' opacity='1.0'/>
<line x1='130.0' y1='190.0' x2='130.0' y2='276.0' stroke='#5dade2' stroke-width='3.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='130.0,285.0 124.5,275.5 135.5,275.5' fill='#5dade2' stroke='#5dade2' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='245.0' y1='250.0' x2='280.0' y2='236.0' stroke='#f5b041' stroke-width='5' stroke-linecap='round' opacity='1.0'/>
<line x1='315.0' y1='250.0' x2='280.0' y2='236.0' stroke='#f5b041' stroke-width='5' stroke-linecap='round' opacity='1.0'/>
<text x='130.0' y='432.0' font-size='15' fill='#f4d03f' text-anchor='middle' font-weight='bold'>AV valve OPEN</text>
<text x='280.0' y='432.0' font-size='15' fill='#f5b041' text-anchor='middle' font-weight='bold'>SL valve SHUT</text>
<text x='510.0' y='96.0' font-size='17' fill='#ff6b6b' text-anchor='middle' font-weight='bold'>Ventricle contracting (ejecting)</text>
<rect x='385.0' y='115.0' width='160.0' height='95.0' rx='8' stroke='#aab4c0' fill='#aab4c0' stroke-width='2' fill-opacity='0.08'/>
<text x='465.0' y='168.0' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='normal'>Atrium</text>
<rect x='385.0' y='250.0' width='160.0' height='150.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.1'/>
<text x='465.0' y='335.0' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='normal'>Ventricle</text>
<rect x='580.0' y='115.0' width='70.0' height='135.0' rx='8' stroke='#aab4c0' fill='#aab4c0' stroke-width='2' fill-opacity='0.08'/>
<text x='615.0' y='142.0' font-size='14' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Artery</text>
<line x1='390.0' y1='225.0' x2='465.0' y2='236.0' stroke='#f4d03f' stroke-width='5' stroke-linecap='round' opacity='1.0'/>
<line x1='540.0' y1='225.0' x2='465.0' y2='236.0' stroke='#f4d03f' stroke-width='5' stroke-linecap='round' opacity='1.0'/>
<line x1='580.0' y1='250.0' x2='589.0' y2='200.0' stroke='#f5b041' stroke-width='5' stroke-linecap='round' opacity='1.0'/>
<line x1='650.0' y1='250.0' x2='641.0' y2='200.0' stroke='#f5b041' stroke-width='5' stroke-linecap='round' opacity='1.0'/>
<path d='M465,350 C555,350 615,320 615,170' stroke='#ff6b6b' fill='none' stroke-width='3.5' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<polygon points='615.0,168.0 621.5,179.3 608.5,179.3' fill='#ff6b6b' stroke='#ff6b6b' stroke-width='1.5' fill-opacity='1.0'/>
<text x='465.0' y='432.0' font-size='15' fill='#f4d03f' text-anchor='middle' font-weight='bold'>AV valve SHUT</text>
<text x='615.0' y='432.0' font-size='15' fill='#f5b041' text-anchor='middle' font-weight='bold'>SL valve OPEN</text>
<text x='340.0' y='462.0' font-size='14' fill='#aab4c0' text-anchor='middle' font-weight='normal'>AV = tricuspid / bicuspid (mitral).  SL = pulmonary / aortic.</text>
</svg>
