<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540">
  <title>Visual pathway and visual fields</title>
  <circle cx="330.0" cy="60.0" r="44.0" stroke="#5ab4f0" stroke-width="2" fill="#5ab4f0" fill-opacity="0.12"/>
  <circle cx="490.0" cy="60.0" r="44.0" stroke="#f2b24c" stroke-width="2" fill="#f2b24c" fill-opacity="0.12"/>
  <text x="330.0" y="64.0" fill="#5ab4f0" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">left field</text>
  <text x="490.0" y="64.0" fill="#f2b24c" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">right field</text>
  <circle cx="330.0" cy="170.0" r="40.0" stroke="#9aa4b1" stroke-width="2" fill="none" fill-opacity="1"/>
  <text x="245.0" y="175.0" fill="#9aa4b1" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">LEFT EYE</text>
  <circle cx="490.0" cy="170.0" r="40.0" stroke="#9aa4b1" stroke-width="2" fill="none" fill-opacity="1"/>
  <text x="575.0" y="175.0" fill="#9aa4b1" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">RIGHT EYE</text>
  <path d="M 290 170 A 40 40 0 0 0 330 210" stroke="#f2b24c" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 330 210 A 40 40 0 0 0 370 170" stroke="#5ab4f0" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 450 170 A 40 40 0 0 0 490 210" stroke="#f2b24c" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 490 210 A 40 40 0 0 0 530 170" stroke="#5ab4f0" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 315 207 L 395 282" stroke="#f2b24c" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 348 205 L 420 282" stroke="#5ab4f0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 472 205 L 400 282" stroke="#f2b24c" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 505 207 L 425 282" stroke="#5ab4f0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="410.0" cy="290.0" rx="36.0" ry="12.0" stroke="#e6e9ee" stroke-width="2" fill="#ffffff" fill-opacity="0.08"/>
  <text x="460.0" y="296.0" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Optic chiasm</text>
  <text x="260.0" y="240.0" fill="#e6e9ee" font-size="13" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Optic nerve</text>
  <path d="M 395 298 L 330 360" stroke="#f2b24c" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 425 298 L 490 360" stroke="#5ab4f0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="300.0" y="340.0" fill="#e6e9ee" font-size="13" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Optic tract</text>
  <ellipse cx="325.0" cy="370.0" rx="20.0" ry="12.0" stroke="#7ccf86" stroke-width="2" fill="#7ccf86" fill-opacity="0.3"/>
  <ellipse cx="495.0" cy="370.0" rx="20.0" ry="12.0" stroke="#7ccf86" stroke-width="2" fill="#7ccf86" fill-opacity="0.3"/>
  <text x="530.0" y="375.0" fill="#7ccf86" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Lateral geniculate nucleus (thalamus)</text>
  <path d="M 320 382 Q 270 430 330 480" stroke="#f2b24c" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 500 382 Q 550 430 490 480" stroke="#5ab4f0" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="250.0" y="430.0" fill="#e6e9ee" font-size="13" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Optic radiation</text>
  <rect x="290.0" y="478.0" width="90.0" height="28.0" rx="6" stroke="#f2b24c" stroke-width="2" fill="#f2b24c" fill-opacity="0.2"/>
  <rect x="440.0" y="478.0" width="90.0" height="28.0" rx="6" stroke="#5ab4f0" stroke-width="2" fill="#5ab4f0" fill-opacity="0.2"/>
  <text x="410.0" y="530.0" fill="#e6e9ee" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Primary visual cortex (occipital lobes)</text>
  <text x="20.0" y="100.0" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Nasal retinal fibres cross</text>
  <text x="20.0" y="116.9" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">at the chiasm; temporal</text>
  <text x="20.0" y="133.8" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">fibres stay on their own side.</text>
  <text x="20.0" y="160.0" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">So each hemisphere sees</text>
  <text x="20.0" y="176.9" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">the OPPOSITE visual field.</text>
  <text x="600.0" y="100.0" fill="#9aa4b1" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Left field (blue) lands on</text>
  <text x="600.0" y="116.9" fill="#9aa4b1" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">the right half of each</text>
  <text x="600.0" y="133.8" fill="#9aa4b1" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">retina: left nasal retina</text>
  <text x="600.0" y="150.7" fill="#9aa4b1" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">+ right temporal retina.</text>
  <text x="600.0" y="440.0" fill="#9aa4b1" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Some tract fibres go to</text>
  <text x="600.0" y="456.0" fill="#9aa4b1" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">the superior colliculi</text>
  <text x="600.0" y="472.0" fill="#9aa4b1" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">(visual reflexes)</text>
</svg>
