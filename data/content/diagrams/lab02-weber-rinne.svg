<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400">
  <title>Weber and Rinne tests</title>
  <text x="20.0" y="30.0" fill="#9aa4b1" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Tuning fork (256 Hz)</text>
  <text x="290.0" y="60.0" fill="#7ccf86" font-size="14" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Normal</text>
  <text x="490.0" y="60.0" fill="#f2b24c" font-size="14" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Conductive loss (left)</text>
  <text x="700.0" y="60.0" fill="#ef7a7a" font-size="14" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Sensorineural loss (left)</text>
  <text x="20.0" y="110.0" fill="#e6e9ee" font-size="15" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Weber</text>
  <text x="20.0" y="128.0" fill="#9aa4b1" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">fork on forehead</text>
  <text x="20.0" y="144.0" fill="#9aa4b1" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">(bone conduction)</text>
  <text x="290.0" y="125.0" fill="#e6e9ee" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">heard equally in both ears</text>
  <text x="490.0" y="125.0" fill="#e6e9ee" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">louder in the BAD (left) ear</text>
  <text x="700.0" y="125.0" fill="#e6e9ee" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">louder in the GOOD (right) ear</text>
  <text x="20.0" y="210.0" fill="#e6e9ee" font-size="15" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Rinne</text>
  <text x="20.0" y="228.0" fill="#9aa4b1" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">mastoid (bone) vs</text>
  <text x="20.0" y="244.0" fill="#9aa4b1" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">beside meatus (air)</text>
  <text x="290.0" y="220.0" fill="#e6e9ee" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">air &gt; bone</text>
  <text x="290.0" y="236.9" fill="#e6e9ee" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">(positive Rinne)</text>
  <text x="490.0" y="220.0" fill="#e6e9ee" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">bone &gt; air in the bad ear</text>
  <text x="490.0" y="236.9" fill="#e6e9ee" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">(negative Rinne)</text>
  <text x="700.0" y="220.0" fill="#e6e9ee" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">air &gt; bone in both ears</text>
  <text x="700.0" y="236.9" fill="#e6e9ee" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">(both reduced on the bad side)</text>
  <line x1="20.0" y1="170.0" x2="800.0" y2="170.0" stroke="#9aa4b1" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="20.0" y1="280.0" x2="800.0" y2="280.0" stroke="#9aa4b1" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>
  <text x="20.0" y="310.0" fill="#9aa4b1" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Why: in conductive loss room noise is not reaching the bad ear, so bone-conducted sound seems</text>
  <text x="20.0" y="326.9" fill="#9aa4b1" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">louder there; in sensorineural loss the bad cochlea or nerve cannot respond to either route.</text>
  <text x="20.0" y="360.0" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Conductive: earwax, perforated eardrum, otitis media, otosclerosis.</text>
  <text x="20.0" y="376.9" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Sensorineural: hair cell loss (noise, age), cochlear nerve or auditory cortex damage.</text>
</svg>
