<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="940" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>How systemic venous blood returns to the right atrium</title><defs><marker id="ah-58d68d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58d68d"/></marker><marker id="ah-5dade2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5dade2"/></marker><marker id="ah-aab4c0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab4c0"/></marker><marker id="ah-bb8fce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bb8fce"/></marker><marker id="ah-c9d1dc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1dc"/></marker><marker id="ah-e8ecf1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8ecf1"/></marker><marker id="ah-f1948a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f1948a"/></marker><marker id="ah-f4d03f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4d03f"/></marker><marker id="ah-f5b041" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5b041"/></marker><marker id="ah-ff6b6b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker></defs>
<rect x="380.0" y="290.0" width="180.0" height="60.0" rx="8" stroke="#5dade2" fill="#5dade2" fill-opacity="0.15" stroke-width="2" opacity="1.0"/>
<text x="470.0" y="326.1" font-size="17" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="bold" opacity="1.0">Right atrium</text>
<rect x="380.0" y="170.0" width="180.0" height="44.0" rx="8" stroke="#5dade2" fill="#ffffff" fill-opacity="0.04" stroke-width="2" opacity="1.0"/>
<text x="470.0" y="197.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="bold" opacity="1.0">Superior vena cava</text>
<rect x="380.0" y="430.0" width="180.0" height="44.0" rx="8" stroke="#5dade2" fill="#ffffff" fill-opacity="0.04" stroke-width="2" opacity="1.0"/>
<text x="470.0" y="457.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="bold" opacity="1.0">Inferior vena cava</text>
<line x1="470.0" y1="214.0" x2="470.0" y2="286.0" stroke="#5dade2" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-5dade2)"/>
<line x1="470.0" y1="430.0" x2="470.0" y2="354.0" stroke="#5dade2" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-5dade2)"/>
<rect x="160.0" y="90.0" width="190.0" height="44.0" rx="8" stroke="#5dade2" fill="#ffffff" fill-opacity="0.04" stroke-width="2" opacity="1.0"/>
<text x="255.0" y="116.7" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="normal" opacity="1.0">R brachiocephalic</text>
<rect x="590.0" y="90.0" width="190.0" height="44.0" rx="8" stroke="#5dade2" fill="#ffffff" fill-opacity="0.04" stroke-width="2" opacity="1.0"/>
<text x="685.0" y="116.7" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="normal" opacity="1.0">L brachiocephalic</text>
<line x1="300.0" y1="134.0" x2="420.0" y2="168.0" stroke="#5dade2" fill="none" stroke-width="2.5" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-5dade2)"/>
<line x1="640.0" y1="134.0" x2="520.0" y2="168.0" stroke="#5dade2" fill="none" stroke-width="2.5" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-5dade2)"/>
<text x="40.0" y="40.0" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">internal jugular (dural sinuses, face) + subclavian (arm, external jugular) = brachiocephalic</text>
<text x="40.0" y="60.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">brachiocephalics also receive vertebral and internal thoracic veins</text>
<rect x="640.0" y="200.0" width="200.0" height="44.0" rx="8" stroke="#bb8fce" fill="#ffffff" fill-opacity="0.04" stroke-width="2" opacity="1.0"/>
<text x="740.0" y="226.7" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="bold" opacity="1.0">Azygos vein</text>
<line x1="640.0" y1="222.0" x2="564.0" y2="196.0" stroke="#bb8fce" fill="none" stroke-width="2.5" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-bb8fce)"/>
<text x="650.0" y="262.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">← hemiazygos, accessory hemiazygos</text><text x="650.0" y="276.6" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">(left side); posterior intercostal,</text><text x="650.0" y="291.3" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">ascending lumbar veins</text>
<text x="40.0" y="520.0" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">IVC tributaries: common iliacs (legs, pelvis), lumbar, renal, right gonadal, right suprarenal, inferior phrenic, hepatic veins</text>
<text x="40.0" y="542.0" font-size="13" stroke="none" fill="#f5b041" text-anchor="start" font-weight="normal" opacity="1.0">Left gonadal and left suprarenal veins drain into the LEFT RENAL vein first.</text>
<text x="40.0" y="564.0" font-size="13" stroke="none" fill="#f4d03f" text-anchor="start" font-weight="normal" opacity="1.0">Gut blood reaches the IVC only after the liver: portal vein → sinusoids → hepatic veins.</text>
<text x="40.0" y="600.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">Coronary sinus drains the heart wall directly into the right atrium.</text>
</svg>
