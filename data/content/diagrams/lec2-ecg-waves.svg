<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 480' width='720' height='480' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>ECG waves and intervals</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>The ECG: electrical events that you can time</text>
<text x='360.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>P = atrial depol · QRS = ventricular depol · T = ventricular repol</text>
<path d='M50,280 L90,280 L120,252 L150,280 L200,280 L215,298 L230,170 L248,302 L265,280 L350,280 L400,244 L450,280 L690,280' stroke='#e8ecf1' fill='none' stroke-width='3.5' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<line x1='50.0' y1='280.0' x2='690.0' y2='280.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.4' stroke-dasharray='4 6'/>
<text x='120.0' y='236.0' font-size='20' fill='#5dade2' text-anchor='middle' font-weight='bold'>P</text>
<text x='230.0' y='152.0' font-size='20' fill='#ff6b6b' text-anchor='middle' font-weight='bold'>QRS</text>
<text x='400.0' y='228.0' font-size='20' fill='#58d68d' text-anchor='middle' font-weight='bold'>T</text>
<line x1='90.0' y1='390.0' x2='215.0' y2='390.0' stroke='#f5b041' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<text x='152.0' y='412.0' font-size='15' fill='#f5b041' text-anchor='middle' font-weight='bold'>PR (PQ) 0.16 s</text>
<text x='152.0' y='432.0' font-size='13' fill='#aab4c0' text-anchor='middle' font-weight='normal'>atria contract; then ventricles start</text>
<line x1='215.0' y1='390.0' x2='450.0' y2='390.0' stroke='#bb8fce' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<text x='332.0' y='412.0' font-size='15' fill='#bb8fce' text-anchor='middle' font-weight='bold'>QT ~0.36 s</text>
<text x='332.0' y='432.0' font-size='13' fill='#aab4c0' text-anchor='middle' font-weight='normal'>ventricles contract then start to relax</text>
<text x='40.0' y='458.0' font-size='14' fill='#aab4c0' text-anchor='start' font-weight='normal'>Long PR: delay in atria or AV node/bundle (ischemia, dilated atrium).  Long QT: abnormal ventricular APs (MI, enlarged ventricles).</text>
</svg>
