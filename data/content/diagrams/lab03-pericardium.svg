<text x="20.0" y="30.0" font-size="18" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">From outside in: the pericardium, then the heart wall</text>
<text x="60.0" y="420.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">The serous fluid in the pericardial cavity lets the beating heart slide with little friction.</text>
