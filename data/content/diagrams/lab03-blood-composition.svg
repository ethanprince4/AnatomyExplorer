<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>What blood is made of</title><defs><marker id="ah-58d68d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58d68d"/></marker><marker id="ah-5dade2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5dade2"/></marker><marker id="ah-aab4c0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab4c0"/></marker><marker id="ah-bb8fce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bb8fce"/></marker><marker id="ah-c9d1dc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1dc"/></marker><marker id="ah-e8ecf1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8ecf1"/></marker><marker id="ah-f1948a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f1948a"/></marker><marker id="ah-f4d03f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4d03f"/></marker><marker id="ah-f5b041" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5b041"/></marker><marker id="ah-ff6b6b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker></defs>
<path d="M90,229.0 L90,390 Q135.0,435 180,390 L180,229.0 Z" stroke="none" fill="#ff6b6b" fill-opacity="0.75" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<rect x="90.0" y="223.0" width="90.0" height="6.0" rx="0" stroke="none" fill="#f0f0f0" fill-opacity="0.9" stroke-width="0" opacity="1.0"/>
<rect x="90.0" y="70.0" width="90.0" height="153.0" rx="0" stroke="none" fill="#f4d03f" fill-opacity="0.45" stroke-width="0" opacity="1.0"/>
<path d="M90,50 L90,390 Q135.0,435 180,390 L180,50" stroke="#c9d1dc" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<text x="198.0" y="144.8" font-size="16" stroke="none" fill="#f4d03f" text-anchor="start" font-weight="bold" opacity="1.0">Plasma ~55%</text>
<text x="198.0" y="164.8" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">(straw-coloured fluid)</text>
<text x="198.0" y="229.0" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">Buffy coat &lt;1%: white cells + platelets</text>
<text x="198.0" y="325.0" font-size="16" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">Red cells ~45%</text>
<text x="198.0" y="345.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">(the formed elements settle)</text>
<text x="470.0" y="70.0" font-size="17" stroke="none" fill="#f4d03f" text-anchor="start" font-weight="bold" opacity="1.0">Plasma</text>
<rect x="470.0" y="100.0" width="236.6" height="26.0" rx="4" stroke="none" fill="#5dade2" stroke-width="0" opacity="0.8"/>
<text x="716.6" y="118.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Water ~91%</text>
<text x="470.0" y="146.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">solvent; carries heat</text>
<rect x="470.0" y="170.0" width="18.2" height="26.0" rx="4" stroke="none" fill="#58d68d" stroke-width="0" opacity="0.8"/>
<text x="498.2" y="188.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Proteins ~7%</text>
<text x="470.0" y="216.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">albumins &gt; globulins &gt; fibrinogen</text>
<rect x="470.0" y="240.0" width="6.0" height="26.0" rx="4" stroke="none" fill="#bb8fce" stroke-width="0" opacity="0.8"/>
<text x="486.0" y="258.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Other solutes ~2%</text>
<text x="470.0" y="286.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">electrolytes (Na⁺ K⁺ Cl⁻), nutrients,</text><text x="470.0" y="300.6" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">hormones, gases, wastes</text>
<text x="470.0" y="330.0" font-size="15" stroke="none" fill="#58d68d" text-anchor="start" font-weight="bold" opacity="1.0">Plasma proteins</text>
<text x="470.0" y="352.0" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">Albumins - most plentiful; made by the liver</text>
<text x="470.0" y="372.0" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">Globulins - second; include antibodies from plasma cells</text>
<text x="470.0" y="392.0" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">Fibrinogen - clotting protein; made by the liver</text>
<text x="470.0" y="412.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">(the liver also makes most other clotting factors)</text>
<text x="20.0" y="30.0" font-size="18" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Blood = plasma + formed elements</text>
<text x="20.0" y="460.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">Formed elements: erythrocytes, leukocytes and platelets - all made in red bone marrow (hematopoiesis).</text>
</svg>
