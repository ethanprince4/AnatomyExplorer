<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 460' width='720' height='460' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Five kinds of circulatory shock</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Shock: inadequate flow that damages tissues</text>
<text x='360.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Failure to keep a normal blood pressure</text>
<rect x='18.0' y='90.0' width='128.0' height='250.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.14'/>
<text x='82.0' y='174.5' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Hypovolemic</text>
<text x='82.0' y='192.8' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='82.0' y='211.1' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>volume too low</text>
<text x='82.0' y='229.4' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='82.0' y='247.7' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>bleed, burns, diarrhoea,</text>
<text x='82.0' y='266.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>vomiting, dehydration</text>
<rect x='158.0' y='90.0' width='128.0' height='250.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.14'/>
<text x='222.0' y='174.5' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Neurogenic</text>
<text x='222.0' y='192.8' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='222.0' y='211.1' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>vessels too wide</text>
<text x='222.0' y='229.4' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='222.0' y='247.7' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>emotional stress,</text>
<text x='222.0' y='266.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>anaesthesia</text>
<rect x='298.0' y='90.0' width='128.0' height='250.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='362.0' y='174.5' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Anaphylactic</text>
<text x='362.0' y='192.8' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='362.0' y='211.1' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>allergy</text>
<text x='362.0' y='229.4' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='362.0' y='247.7' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>histamine dump;</text>
<text x='362.0' y='266.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>capillaries leak</text>
<rect x='438.0' y='90.0' width='128.0' height='250.0' rx='8' stroke='#bb8fce' fill='#bb8fce' stroke-width='2' fill-opacity='0.14'/>
<text x='502.0' y='174.5' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Septic</text>
<text x='502.0' y='192.8' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='502.0' y='211.1' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>infection / toxins</text>
<text x='502.0' y='229.4' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='502.0' y='247.7' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>vasodilation; capillaries</text>
<text x='502.0' y='266.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>more permeable</text>
<rect x='578.0' y='90.0' width='128.0' height='250.0' rx='8' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.14'/>
<text x='642.0' y='174.5' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Cardiogenic</text>
<text x='642.0' y='192.8' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='642.0' y='211.1' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>pump fails</text>
<text x='642.0' y='229.4' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='642.0' y='247.7' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>MI, fibrillation,</text>
<text x='642.0' y='266.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>arrhythmia, shock</text>
<text x='360.0' y='380.0' font-size='14' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Neurogenic = vascular shock in the lecture.  Any of them can kill if MAP is not restored.</text>
<text x='360.0' y='430.0' font-size='14' fill='#aab4c0' text-anchor='middle' font-weight='normal'>CNS ischemic response: last-ditch vasoconstriction when the medulla itself is underperfused.</text>
</svg>
