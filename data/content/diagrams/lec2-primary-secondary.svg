<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 420' width='700' height='420' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Primary and secondary antibody responses</title>
<text x='350.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>The second exposure is faster and much bigger</text>
<text x='350.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>This is memory, the basis of immunity and vaccines (textbook detail)</text>
<line x1='70.0' y1='360.0' x2='670.0' y2='360.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<line x1='70.0' y1='360.0' x2='70.0' y2='90.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<text x='370.0' y='395.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>time (days)</text>
<text x='40.0' y='230.0' font-size='14' fill='#aab4c0' text-anchor='middle' font-weight='normal'>antibody</text>
<path d='M90,360 C160,360 180,280 220,280 C270,280 300,340 360,345' stroke='#5dade2' fill='none' stroke-width='3.5' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<path d='M400,345 C420,345 430,110 490,110 C570,110 610,200 660,220' stroke='#ff6b6b' fill='none' stroke-width='3.5' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<line x1='90.0' y1='115.0' x2='90.0' y2='346.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<polygon points='90.0,355.0 84.5,345.5 95.5,345.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<text x='94.0' y='108.0' font-size='14' fill='#aab4c0' text-anchor='middle' font-weight='normal'>1st exposure</text>
<line x1='400.0' y1='90.0' x2='400.0' y2='331.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<polygon points='400.0,340.0 394.5,330.5 405.5,330.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<text x='400.0' y='84.0' font-size='14' fill='#aab4c0' text-anchor='middle' font-weight='normal'>2nd exposure</text>
<text x='110.0' y='175.0' font-size='14' fill='#5dade2' text-anchor='start' font-weight='normal'>Primary (blue):</text>
<text x='110.0' y='193.0' font-size='14' fill='#5dade2' text-anchor='start' font-weight='normal'>3–14 days, little</text>
<text x='110.0' y='211.0' font-size='14' fill='#5dade2' text-anchor='start' font-weight='normal'>antibody (IgM first)</text>
<text x='110.0' y='229.0' font-size='14' fill='#5dade2' text-anchor='start' font-weight='normal'>→ you get sick</text>
<text x='220.0' y='98.0' font-size='14' fill='#ff6b6b' text-anchor='start' font-weight='normal'>Secondary (red):</text>
<text x='220.0' y='116.0' font-size='14' fill='#ff6b6b' text-anchor='start' font-weight='normal'>hours–days, lots of</text>
<text x='220.0' y='134.0' font-size='14' fill='#ff6b6b' text-anchor='start' font-weight='normal'>antibody → no symptoms</text>
</svg>
