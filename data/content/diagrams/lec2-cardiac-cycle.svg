<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 540' width='720' height='540' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The five periods of one cardiac cycle</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>One cardiac cycle, in order</text>
<text x='360.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Atrium is the primer; ventricle is the power</text>
<circle cx='48.0' cy='112.0' r='18.0' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.28'/>
<text x='48.0' y='118.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>1</text>
<text x='82.0' y='106.0' font-size='18' fill='#5dade2' text-anchor='start' font-weight='bold'>Passive ventricular filling</text>
<text x='82.0' y='132.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>heart relaxed; AV open; ~70% of filling</text>
<line x1='48.0' y1='132.0' x2='48.0' y2='168.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<circle cx='48.0' cy='192.0' r='18.0' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.28'/>
<text x='48.0' y='198.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>2</text>
<text x='82.0' y='186.0' font-size='18' fill='#f5b041' text-anchor='start' font-weight='bold'>Atrial systole (active filling)</text>
<text x='82.0' y='212.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>P wave; atria squeeze the last 30% in</text>
<line x1='48.0' y1='212.0' x2='48.0' y2='248.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<circle cx='48.0' cy='272.0' r='18.0' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.28'/>
<text x='48.0' y='278.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>3</text>
<text x='82.0' y='266.0' font-size='18' fill='#ff6b6b' text-anchor='start' font-weight='bold'>Isovolumetric contraction</text>
<text x='82.0' y='292.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>QRS; AV close (S1); all valves shut; EDV 120-130 mL</text>
<line x1='48.0' y1='292.0' x2='48.0' y2='328.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<circle cx='48.0' cy='352.0' r='18.0' stroke='#f4d03f' fill='#f4d03f' stroke-width='2' fill-opacity='0.28'/>
<text x='48.0' y='358.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>4</text>
<text x='82.0' y='346.0' font-size='18' fill='#f4d03f' text-anchor='start' font-weight='bold'>Period of ejection</text>
<text x='82.0' y='372.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>SL open; LV 120 mm Hg, RV 25 mm Hg; ESV 50-60 mL</text>
<line x1='48.0' y1='372.0' x2='48.0' y2='408.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<circle cx='48.0' cy='432.0' r='18.0' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.28'/>
<text x='48.0' y='438.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>5</text>
<text x='82.0' y='426.0' font-size='18' fill='#58d68d' text-anchor='start' font-weight='bold'>Isovolumetric relaxation</text>
<text x='82.0' y='452.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>T wave; SL close (S2, dicrotic notch); all valves shut</text>
<text x='360.0' y='522.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Then back to 1: AV valves open and passive filling starts again.</text>
</svg>
