<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 440' width='720' height='440' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Clonal selection</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Clonal selection: the antigen picks the lymphocyte that fits it</text>
<circle cx='80.0' cy='130.0' r='24.0' stroke='#58d68d' fill='#58d68d' stroke-width='2.5' fill-opacity='0.25'/>
<circle cx='150.0' cy='130.0' r='24.0' stroke='#5dade2' fill='#5dade2' stroke-width='2.5' fill-opacity='0.25'/>
<circle cx='220.0' cy='130.0' r='24.0' stroke='#f5b041' fill='#f5b041' stroke-width='2.5' fill-opacity='0.25'/>
<circle cx='290.0' cy='130.0' r='24.0' stroke='#bb8fce' fill='#bb8fce' stroke-width='2.5' fill-opacity='0.25'/>
<text x='185.0' y='185.0' font-size='14' fill='#aab4c0' text-anchor='middle' font-weight='normal'>many lymphocytes, each with ONE receptor shape</text>
<polygon points='255.0,95.0 270.0,80.0 285.0,95.0 270.0,110.0' fill='#f5b041' stroke='#f5b041' stroke-width='1.5' fill-opacity='1.0'/>
<text x='300.0' y='92.0' font-size='15' fill='#f5b041' text-anchor='start' font-weight='bold'>antigen</text>
<line x1='220.0' y1='160.0' x2='313.6' y2='253.6' stroke='#f5b041' stroke-width='3' stroke-linecap='round' opacity='1.0'/>
<polygon points='320.0,260.0 309.4,257.2 317.2,249.4' fill='#f5b041' stroke='#f5b041' stroke-width='1.5' fill-opacity='1.0'/>
<text x='330.0' y='225.0' font-size='14' fill='#f5b041' text-anchor='start' font-weight='bold'>binds &amp; activates the matching one</text>
<circle cx='260.0' cy='300.0' r='22.0' stroke='#f5b041' fill='#f5b041' stroke-width='2.5' fill-opacity='0.25'/>
<circle cx='322.0' cy='300.0' r='22.0' stroke='#f5b041' fill='#f5b041' stroke-width='2.5' fill-opacity='0.25'/>
<circle cx='384.0' cy='300.0' r='22.0' stroke='#f5b041' fill='#f5b041' stroke-width='2.5' fill-opacity='0.25'/>
<circle cx='446.0' cy='300.0' r='22.0' stroke='#f5b041' fill='#f5b041' stroke-width='2.5' fill-opacity='0.25'/>
<circle cx='508.0' cy='300.0' r='22.0' stroke='#f5b041' fill='#f5b041' stroke-width='2.5' fill-opacity='0.25'/>
<circle cx='570.0' cy='300.0' r='22.0' stroke='#f5b041' fill='#f5b041' stroke-width='2.5' fill-opacity='0.25'/>
<text x='415.0' y='350.0' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>proliferates → a clone of identical cells, then differentiates</text>
<text x='40.0' y='395.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>Positive selection keeps lymphocytes that can react to antigens;</text>
<text x='40.0' y='416.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>negative selection removes clones that react to self-antigens.</text>
</svg>
