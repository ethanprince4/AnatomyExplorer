<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <title>Cochlear duct and tonotopy</title>
  <text x="220.0" y="26.0" fill="#e6e9ee" font-size="15" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">One turn of the cochlea in cross-section</text>
  <circle cx="235.0" cy="200.0" r="140.0" stroke="#9aa4b1" stroke-width="2" fill="#ffffff" fill-opacity="0.03"/>
  <path d="M 335 100 Q 385 170 355 230" stroke="#b08968" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="125.0" y1="186.0" x2="337.0" y2="96.0" stroke="#b98ae0" stroke-width="3" stroke-linecap="round"/>
  <line x1="125.0" y1="200.0" x2="363.0" y2="200.0" stroke="#7ccf86" stroke-width="4" stroke-linecap="round"/>
  <rect x="85.0" y="192.0" width="45.0" height="14.0" rx="0" stroke="#e6e9ee" stroke-width="1.5" fill="#e6e9ee" fill-opacity="0.4"/>
  <rect x="225.0" y="176.0" width="80.0" height="24.0" rx="6" stroke="#f2b24c" stroke-width="1.5" fill="#f2b24c" fill-opacity="0.35"/>
  <line x1="240.0" y1="176.0" x2="240.0" y2="168.0" stroke="#e6e9ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="270.0" y1="176.0" x2="270.0" y2="168.0" stroke="#e6e9ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="282.0" y1="176.0" x2="282.0" y2="168.0" stroke="#e6e9ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="294.0" y1="176.0" x2="294.0" y2="168.0" stroke="#e6e9ee" stroke-width="2" stroke-linecap="round"/>
  <path d="M 135 188 Q 225 156 307 166" stroke="#4fd1c5" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="60.0" cy="240.0" rx="20.0" ry="14.0" stroke="#ef7a7a" stroke-width="2" fill="#ef7a7a" fill-opacity="0.3"/>
  <line x1="75.0" y1="232.0" x2="107.0" y2="206.0" stroke="#ef7a7a" stroke-width="2" stroke-linecap="round"/>
  <text x="185.0" y="105.0" fill="#e6e9ee" font-size="14" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Scala vestibuli</text>
  <text x="185.0" y="122.0" fill="#9aa4b1" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">perilymph</text>
  <text x="335.0" y="136.0" fill="#5ab4f0" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Cochlear duct</text>
  <text x="335.0" y="150.0" fill="#5ab4f0" font-size="11" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">(scala media)</text>
  <text x="335.0" y="163.0" fill="#9aa4b1" font-size="11" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">endolymph</text>
  <text x="235.0" y="275.0" fill="#e6e9ee" font-size="14" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Scala tympani</text>
  <text x="235.0" y="293.0" fill="#9aa4b1" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">perilymph</text>
  <text x="195.0" y="50.0" fill="#b98ae0" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">vestibular membrane</text>
  <line x1="255.0" y1="55.0" x2="275.0" y2="128.0" stroke="#b98ae0" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="265.0" y="325.0" fill="#7ccf86" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">basilar membrane</text>
  <line x1="315.0" y1="313.0" x2="325.0" y2="204.0" stroke="#7ccf86" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="145.0" y="244.0" fill="#4fd1c5" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">tectorial membrane</text>
  <line x1="185.0" y1="228.0" x2="195.0" y2="178.0" stroke="#4fd1c5" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="265.0" y="220.0" fill="#f2b24c" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">spiral organ</text>
  <text x="85.0" y="222.0" fill="#9aa4b1" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">spiral lamina</text>
  <text x="345.0" y="360.0" fill="#b08968" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">spiral ligament</text>
  <text x="60.0" y="272.0" fill="#ef7a7a" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">spiral</text>
  <text x="60.0" y="287.6" fill="#ef7a7a" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">ganglion</text>
  <text x="60.0" y="303.2" fill="#ef7a7a" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">-&gt; cochlear</text>
  <text x="60.0" y="318.8" fill="#ef7a7a" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">nerve</text>
  <text x="630.0" y="26.0" fill="#e6e9ee" font-size="15" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">The basilar membrane unrolled</text>
  <path d="M 470.0 90.0 L 790.0 60.0 L 790.0 140.0 L 470.0 110.0 Z" stroke="#7ccf86" stroke-width="2" fill="#7ccf86" fill-opacity="0.2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="470.0" y="80.0" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">BASE</text>
  <text x="790.0" y="50.0" fill="#e6e9ee" font-size="13" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">APEX</text>
  <text x="470.0" y="140.0" fill="#e6e9ee" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">near oval window</text>
  <text x="470.0" y="155.6" fill="#e6e9ee" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">narrow (~0.04 mm), stiff</text>
  <text x="470.0" y="171.2" fill="#e6e9ee" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">HIGH pitch, to 20,000 Hz</text>
  <text x="790.0" y="170.0" fill="#e6e9ee" font-size="12" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">at the helicotrema</text>
  <text x="790.0" y="185.6" fill="#e6e9ee" font-size="12" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">wide (~0.5 mm), floppy</text>
  <text x="790.0" y="201.2" fill="#e6e9ee" font-size="12" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">LOW pitch, down to 20 Hz</text>
  <text x="610.0" y="250.0" fill="#f2b24c" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Each frequency makes one place vibrate most</text>
  <text x="610.0" y="268.0" fill="#f2b24c" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">(tonotopy)</text>
  <text x="610.0" y="310.0" fill="#e6e9ee" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Basilar membrane moves against the tectorial membrane</text>
  <text x="610.0" y="328.0" fill="#e6e9ee" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">-&gt; stereocilia bend -&gt; hair cell depolarises</text>
  <text x="610.0" y="346.0" fill="#e6e9ee" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">-&gt; transmitter -&gt; action potentials in the cochlear nerve</text>
  <text x="220.0" y="400.0" fill="#9aa4b1" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">One row of inner hair cells, three rows of outer hair cells,</text>
  <text x="220.0" y="416.0" fill="#9aa4b1" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">with supporting cells, sit on the basilar membrane</text>
</svg>
