<text x="630.0" y="330.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">VC 3.0 L · FEV1 2.7 L</text>
<text x="630.0" y="348.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">FEV1/VC = 90%  (normal)</text>
