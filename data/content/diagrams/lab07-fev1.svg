<text x="630.0" y="120.0" font-size="15" fill="#58d68d" text-anchor="start" font-weight="bold">normal</text>
<text x="630.0" y="140.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">VC 5.0 L · FEV1 4.0 L</text>
<text x="630.0" y="158.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">FEV1/VC = 80%</text>
<text x="630.0" y="215.0" font-size="15" fill="#f5b041" text-anchor="start" font-weight="bold">obstructive</text>
<text x="630.0" y="235.0" font-size="12.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">VC 4.8 L · FEV1 2.4 L</text>
<text x="630.0" y="253.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">FEV1/VC = 50%  (low)</text>
