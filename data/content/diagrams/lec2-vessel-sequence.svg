<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 560' width='720' height='560' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>From aorta to vena cava: the vessel types</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>The vessel types in the order blood meets them</text>
<text x='360.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>heart → arteries → capillaries → veins → heart</text>
<circle cx='52.0' cy='110.0' r='22.0' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2.5' fill-opacity='0.3'/>
<text x='92.0' y='104.0' font-size='18' fill='#ff6b6b' text-anchor='start' font-weight='bold'>Elastic (conducting) arteries</text>
<text x='700.0' y='104.0' font-size='16' fill='#e8ecf1' text-anchor='end' font-weight='bold'>~10 mm</text>
<text x='92.0' y='128.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>more elastic tissue than muscle; pressure swings</text>
<circle cx='52.0' cy='174.0' r='17.0' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2.5' fill-opacity='0.3'/>
<text x='92.0' y='168.0' font-size='18' fill='#ff6b6b' text-anchor='start' font-weight='bold'>Muscular (distributing) arteries</text>
<text x='700.0' y='168.0' font-size='16' fill='#e8ecf1' text-anchor='end' font-weight='bold'>40 µm – 300 µm*</text>
<text x='92.0' y='192.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>25–40 layers of smooth muscle</text>
<circle cx='52.0' cy='238.0' r='11.0' stroke='#f5b041' fill='#f5b041' stroke-width='2.5' fill-opacity='0.3'/>
<text x='92.0' y='232.0' font-size='18' fill='#f5b041' text-anchor='start' font-weight='bold'>Arterioles</text>
<text x='700.0' y='232.0' font-size='16' fill='#e8ecf1' text-anchor='end' font-weight='bold'>9 – 40 µm</text>
<text x='92.0' y='256.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>smallest with all 3 tunics; constrict &amp; dilate</text>
<circle cx='52.0' cy='302.0' r='6.0' stroke='#bb8fce' fill='#bb8fce' stroke-width='2.5' fill-opacity='0.3'/>
<text x='92.0' y='296.0' font-size='18' fill='#bb8fce' text-anchor='start' font-weight='bold'>Capillaries</text>
<text x='700.0' y='296.0' font-size='16' fill='#e8ecf1' text-anchor='end' font-weight='bold'>7 – 9 µm</text>
<text x='92.0' y='320.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>endothelium + basement membrane only: exchange</text>
<circle cx='52.0' cy='366.0' r='10.0' stroke='#5dade2' fill='#5dade2' stroke-width='2.5' fill-opacity='0.3'/>
<text x='92.0' y='360.0' font-size='18' fill='#5dade2' text-anchor='start' font-weight='bold'>Venules</text>
<text x='700.0' y='360.0' font-size='16' fill='#e8ecf1' text-anchor='end' font-weight='bold'>up to 50 µm</text>
<text x='92.0' y='384.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>endothelium + a few smooth muscle cells</text>
<circle cx='52.0' cy='430.0' r='14.0' stroke='#5dade2' fill='#5dade2' stroke-width='2.5' fill-opacity='0.3'/>
<text x='92.0' y='424.0' font-size='18' fill='#5dade2' text-anchor='start' font-weight='bold'>Small veins</text>
<text x='700.0' y='424.0' font-size='16' fill='#e8ecf1' text-anchor='end' font-weight='bold'>0.2 – 0.3 mm</text>
<text x='92.0' y='448.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>continuous smooth muscle layer</text>
<circle cx='52.0' cy='494.0' r='22.0' stroke='#5dade2' fill='#5dade2' stroke-width='2.5' fill-opacity='0.3'/>
<text x='92.0' y='488.0' font-size='18' fill='#5dade2' text-anchor='start' font-weight='bold'>Medium &amp; large veins</text>
<text x='700.0' y='488.0' font-size='16' fill='#e8ecf1' text-anchor='end' font-weight='bold'>1 mm – 1 cm +</text>
<text x='92.0' y='512.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>thin media; tunica externa dominates</text>
<text x='360.0' y='548.0' font-size='13' fill='#aab4c0' text-anchor='middle' font-weight='normal'>* lecture sizes for the muscular artery class; the largest named ones are wider</text>
</svg>
