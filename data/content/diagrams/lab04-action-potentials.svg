<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Pacemaker and contractile cardiac action potentials</title><defs><marker id="ah-58d68d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58d68d"/></marker><marker id="ah-5dade2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5dade2"/></marker><marker id="ah-aab4c0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab4c0"/></marker><marker id="ah-bb8fce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bb8fce"/></marker><marker id="ah-c9d1dc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1dc"/></marker><marker id="ah-e8ecf1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8ecf1"/></marker><marker id="ah-f1948a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f1948a"/></marker><marker id="ah-f4d03f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4d03f"/></marker><marker id="ah-f5b041" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5b041"/></marker><marker id="ah-ff6b6b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker></defs>
<text x="60.0" y="36.0" font-size="16" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">SA node (pacemaker) cell</text>
<line x1="60.0" y1="60.0" x2="60.0" y2="340.0" stroke="#aab4c0" fill="none" stroke-width="1.5" stroke-linecap="round" opacity="1.0"/>
<line x1="60.0" y1="340.0" x2="460.0" y2="340.0" stroke="#aab4c0" fill="none" stroke-width="1.5" stroke-linecap="round" opacity="1.0"/>
<text x="52.0" y="125.5" font-size="11" stroke="none" fill="#aab4c0" text-anchor="end" font-weight="normal" opacity="1.0">0</text>
<line x1="56.0" y1="121.5" x2="460.0" y2="121.5" stroke="#aab4c0" fill="none" stroke-width="0.6" stroke-linecap="round" opacity="0.5" stroke-dasharray="3 5"/>
<text x="52.0" y="217.5" font-size="11" stroke="none" fill="#aab4c0" text-anchor="end" font-weight="normal" opacity="1.0">-40</text>
<line x1="56.0" y1="213.5" x2="460.0" y2="213.5" stroke="#aab4c0" fill="none" stroke-width="0.6" stroke-linecap="round" opacity="0.5" stroke-dasharray="3 5"/>
<text x="52.0" y="263.5" font-size="11" stroke="none" fill="#aab4c0" text-anchor="end" font-weight="normal" opacity="1.0">-60</text>
<line x1="56.0" y1="259.5" x2="460.0" y2="259.5" stroke="#aab4c0" fill="none" stroke-width="0.6" stroke-linecap="round" opacity="0.5" stroke-dasharray="3 5"/>
<path d="M60.0,259.5 L80.0,259.5 L140.0,225.0 L155.0,213.5 L170.0,121.5 L180.0,98.5 L195.0,121.5 L220.0,225.0 L240.0,259.5 L240.0,259.5 L300.0,225.0 L315.0,213.5 L330.0,121.5 L340.0,98.5 L355.0,121.5 L380.0,225.0 L400.0,259.5" stroke="#58d68d" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<text x="70.0" y="285.5" font-size="12" stroke="none" fill="#f5b041" text-anchor="start" font-weight="normal" opacity="1.0">pacemaker potential (slow drift up):</text>
<text x="70.0" y="301.5" font-size="12" stroke="none" fill="#f5b041" text-anchor="start" font-weight="normal" opacity="1.0">funny Na⁺ current + T-type Ca²⁺</text>
<text x="175.0" y="88.5" font-size="12" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="normal" opacity="1.0">Ca²⁺ in</text>
<text x="205.0" y="156.0" font-size="12" stroke="none" fill="#5dade2" text-anchor="start" font-weight="normal" opacity="1.0">K⁺ out</text>
<text x="330.0" y="207.5" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">threshold</text>
<text x="60.0" y="380.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">No stable resting potential: it drifts up to threshold by itself</text>
<text x="60.0" y="398.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">- that is autorhythmicity. Sets the rate (~70–80/min).</text>
<text x="500.0" y="36.0" font-size="16" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Ventricular contractile cell</text>
<line x1="500.0" y1="60.0" x2="500.0" y2="340.0" stroke="#aab4c0" fill="none" stroke-width="1.5" stroke-linecap="round" opacity="1.0"/>
<line x1="500.0" y1="340.0" x2="900.0" y2="340.0" stroke="#aab4c0" fill="none" stroke-width="1.5" stroke-linecap="round" opacity="1.0"/>
<text x="492.0" y="125.5" font-size="11" stroke="none" fill="#aab4c0" text-anchor="end" font-weight="normal" opacity="1.0">0</text>
<line x1="496.0" y1="121.5" x2="900.0" y2="121.5" stroke="#aab4c0" fill="none" stroke-width="0.6" stroke-linecap="round" opacity="0.5" stroke-dasharray="3 5"/>
<text x="492.0" y="332.5" font-size="11" stroke="none" fill="#aab4c0" text-anchor="end" font-weight="normal" opacity="1.0">-90</text>
<line x1="496.0" y1="328.5" x2="900.0" y2="328.5" stroke="#aab4c0" fill="none" stroke-width="0.6" stroke-linecap="round" opacity="0.5" stroke-dasharray="3 5"/>
<path d="M500.0,328.5 L540.0,328.5 L546.0,64.0 L558.0,103.1 L580.0,110.0 L700.0,133.0 L750.0,259.5 L775.0,323.9 L900.0,328.5" stroke="#ff6b6b" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<text x="550.0" y="56.0" font-size="12" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="normal" opacity="1.0">Na⁺ in (fast)</text>
<text x="600.0" y="100.0" font-size="12" stroke="none" fill="#f5b041" text-anchor="start" font-weight="normal" opacity="1.0">plateau: slow Ca²⁺ in</text>
<text x="750.0" y="213.5" font-size="12" stroke="none" fill="#5dade2" text-anchor="start" font-weight="normal" opacity="1.0">K⁺ out</text>
<rect x="544.0" y="350.0" width="225.0" height="10.0" rx="3" stroke="#f5b041" fill="#f5b041" fill-opacity="0.55" stroke-width="0" opacity="1.0"/>
<text x="500.0" y="385.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">Refractory period (bar) lasts almost as long as the contraction,</text>
<text x="500.0" y="403.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">so heart muscle cannot be tetanized.</text>
<text x="20.0" y="24.0" font-size="1" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0"></text>
</svg>
