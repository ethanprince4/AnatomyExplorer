<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420">
  <title>Resting membrane potential</title>
  <rect x="40.0" y="175.0" width="440.0" height="30.0" rx="0" stroke="#9aa4b1" stroke-width="1.5" fill="#5a6572" fill-opacity="0.5"/>
  <text x="40.0" y="30.0" fill="#e6e9ee" font-size="16" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Outside (extracellular fluid)</text>
  <text x="60.0" y="70.0" fill="#ef7a7a" font-size="16" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Na+  ~145 mEq/L</text>
  <text x="60.0" y="95.0" fill="#5ab4f0" font-size="16" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">K+    ~5 mEq/L</text>
  <text x="40.0" y="390.0" fill="#e6e9ee" font-size="16" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Inside (cytosol)  - about -70 mV</text>
  <text x="60.0" y="300.0" fill="#5ab4f0" font-size="16" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">K+    ~140 mEq/L</text>
  <text x="60.0" y="325.0" fill="#ef7a7a" font-size="16" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Na+  ~15 mEq/L</text>
  <rect x="240.0" y="170.0" width="14.0" height="40.0" rx="0" stroke="#5ab4f0" stroke-width="2" fill="#5ab4f0" fill-opacity="0.3"/>
  <rect x="262.0" y="170.0" width="14.0" height="40.0" rx="0" stroke="#5ab4f0" stroke-width="2" fill="#5ab4f0" fill-opacity="0.3"/>
  <line x1="258.0" y1="260.0" x2="258.0" y2="125.0" stroke="#5ab4f0" stroke-width="3" stroke-linecap="round"/>
  <path d="M 258.0 125.0 L 261.5 133.3 L 254.5 133.3 Z" stroke="#5ab4f0" stroke-width="1" fill="#5ab4f0" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="215.0" y="120.0" fill="#5ab4f0" font-size="13" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">K+ leak channels</text>
  <text x="215.0" y="136.9" fill="#5ab4f0" font-size="13" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">(open at rest)</text>
  <rect x="330.0" y="170.0" width="30.0" height="40.0" rx="0" stroke="#ef7a7a" stroke-width="2" fill="#ef7a7a" fill-opacity="0.15"/>
  <line x1="333.0" y1="190.0" x2="357.0" y2="190.0" stroke="#ef7a7a" stroke-width="3" stroke-linecap="round"/>
  <line x1="345.0" y1="120.0" x2="345.0" y2="165.0" stroke="#ef7a7a" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M 345.0 165.0 L 341.5 156.7 L 348.5 156.7 Z" stroke="#ef7a7a" stroke-width="1" fill="#ef7a7a" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="345.0" y="105.0" fill="#ef7a7a" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">few Na+ channels</text>
  <text x="345.0" y="121.9" fill="#ef7a7a" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">open at rest</text>
  <circle cx="430.0" cy="190.0" r="26.0" stroke="#7ccf86" stroke-width="2" fill="#7ccf86" fill-opacity="0.25"/>
  <text x="430.0" y="195.0" fill="#e6e9ee" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">ATP</text>
  <line x1="418.0" y1="255.0" x2="418.0" y2="135.0" stroke="#ef7a7a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 418.0 135.0 L 421.5 143.3 L 414.5 143.3 Z" stroke="#ef7a7a" stroke-width="1" fill="#ef7a7a" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="444.0" y1="130.0" x2="444.0" y2="250.0" stroke="#5ab4f0" stroke-width="2" stroke-linecap="round"/>
  <path d="M 444.0 250.0 L 440.5 241.7 L 447.5 241.7 Z" stroke="#5ab4f0" stroke-width="1" fill="#5ab4f0" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="418.0" y="272.0" fill="#ef7a7a" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">3 Na+ out</text>
  <text x="450.0" y="120.0" fill="#5ab4f0" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">2 K+ in</text>
  <text x="430.0" y="300.0" fill="#7ccf86" font-size="14" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Na+/K+ ATPase</text>
  <text x="430.0" y="318.0" fill="#9aa4b1" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">(blocked by ouabain)</text>
  <line x1="620.0" y1="56.0" x2="620.0" y2="430.0" stroke="#9aa4b1" stroke-width="2" stroke-linecap="round"/>
  <line x1="614.0" y1="78.0" x2="626.0" y2="78.0" stroke="#9aa4b1" stroke-width="2" stroke-linecap="round"/>
  <text x="608.0" y="83.0" fill="#9aa4b1" font-size="13" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">+60 mV</text>
  <line x1="614.0" y1="210.0" x2="626.0" y2="210.0" stroke="#9aa4b1" stroke-width="2" stroke-linecap="round"/>
  <text x="608.0" y="215.0" fill="#9aa4b1" font-size="13" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">0 mV</text>
  <line x1="614.0" y1="364.0" x2="626.0" y2="364.0" stroke="#9aa4b1" stroke-width="2" stroke-linecap="round"/>
  <text x="608.0" y="369.0" fill="#9aa4b1" font-size="13" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">-70 mV</text>
  <line x1="614.0" y1="408.0" x2="626.0" y2="408.0" stroke="#9aa4b1" stroke-width="2" stroke-linecap="round"/>
  <text x="608.0" y="413.0" fill="#9aa4b1" font-size="13" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">-90 mV</text>
  <circle cx="620.0" cy="78.0" r="7.0" stroke="#ef7a7a" stroke-width="2" fill="#ef7a7a" fill-opacity="1"/>
  <text x="636.0" y="83.0" fill="#ef7a7a" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">E Na (Na+ equilibrium)</text>
  <circle cx="620.0" cy="364.0" r="8.0" stroke="#e6e9ee" stroke-width="2" fill="#e6e9ee" fill-opacity="1"/>
  <text x="636.0" y="369.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Resting potential</text>
  <circle cx="620.0" cy="408.0" r="7.0" stroke="#5ab4f0" stroke-width="2" fill="#5ab4f0" fill-opacity="1"/>
  <text x="636.0" y="413.0" fill="#5ab4f0" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">E K (K+ equilibrium)</text>
  <text x="636.0" y="200.0" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Rest sits near E K:</text>
  <text x="636.0" y="216.9" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">at rest the membrane is</text>
  <text x="636.0" y="233.8" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">far more permeable</text>
  <text x="636.0" y="250.7" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">to K+ than to Na+</text>
</svg>
