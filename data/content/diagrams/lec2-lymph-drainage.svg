<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 520' width='700' height='520' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Which duct drains which part of the body</title>
<text x='350.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Right lymphatic duct versus thoracic duct</text>
<path d='M192,88 a38,40 0 1 1 76,0 a38,40 0 1 1 -76,0' stroke='#aab4c0' fill='none' stroke-width='2' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<path d='M230,48 a38,40 0 0 0 0,80' stroke='#5dade2' fill='#5dade2' stroke-width='0' stroke-linejoin='round' stroke-linecap='round' fill-opacity='0.5'/>
<path d='M170,140 L290,140 L300,300 L280,470 L240,470 L230,330 L220,470 L180,470 L160,300 Z' stroke='#aab4c0' fill='none' stroke-width='2' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<path d='M170,140 L110,300 L130,305 L168,210' stroke='#aab4c0' fill='none' stroke-width='2' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<path d='M290,140 L350,300 L330,305 L292,210' stroke='#aab4c0' fill='none' stroke-width='2' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<polygon points='170.0,140.0 230.0,140.0 230.0,245.0 164.0,245.0 168.0,210.0 130.0,305.0 110.0,300.0' fill='#5dade2' stroke='#5dade2' stroke-width='1.5' fill-opacity='0.45'/>
<text x='155.0' y='170.0' font-size='18' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>R</text>
<text x='305.0' y='170.0' font-size='18' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>L</text>
<rect x='390.0' y='90.0' width='290.0' height='100.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.14'/>
<text x='535.0' y='116.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Right lymphatic duct</text>
<text x='535.0' y='135.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>right head &amp; neck</text>
<text x='535.0' y='155.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>right upper limb</text>
<text x='535.0' y='174.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>right thorax</text>
<rect x='390.0' y='215.0' width='290.0' height='100.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='535.0' y='241.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Thoracic duct</text>
<text x='535.0' y='260.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>everything else: left side</text>
<text x='535.0' y='280.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>+ all of the body</text>
<text x='535.0' y='299.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>below the thorax</text>
<text x='390.0' y='350.0' font-size='15' fill='#e8ecf1' text-anchor='start' font-weight='normal'>Trunks feed the ducts:</text>
<text x='390.0' y='371.0' font-size='15' fill='#e8ecf1' text-anchor='start' font-weight='normal'>jugular — head &amp; neck</text>
<text x='390.0' y='392.0' font-size='15' fill='#e8ecf1' text-anchor='start' font-weight='normal'>subclavian — upper limb, breast</text>
<text x='390.0' y='413.0' font-size='15' fill='#e8ecf1' text-anchor='start' font-weight='normal'>bronchomediastinal — deep thorax</text>
<text x='390.0' y='434.0' font-size='15' fill='#e8ecf1' text-anchor='start' font-weight='normal'>intestinal — abdominal organs</text>
<text x='390.0' y='455.0' font-size='15' fill='#e8ecf1' text-anchor='start' font-weight='normal'>lumbar — lower limb, pelvis, walls</text>
<text x='230.0' y='505.0' font-size='14' fill='#5dade2' text-anchor='middle' font-weight='normal'>blue = right lymphatic duct territory</text>
</svg>
