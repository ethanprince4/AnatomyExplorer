<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 470' width='720' height='470' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>MHC class I and class II</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Two ways a cell shows what is inside it</text>
<rect x='20.0' y='75.0' width='330.0' height='300.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.14'/>
<text x='185.0' y='148.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>MHC class I</text>
<text x='185.0' y='168.7' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>on ALL nucleated cells</text>
<text x='185.0' y='189.5' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='185.0' y='210.2' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>shows ENDOGENOUS antigen</text>
<text x='185.0' y='230.9' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>(made inside the cell,</text>
<text x='185.0' y='251.7' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>e.g. viral or tumour protein)</text>
<text x='185.0' y='272.4' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='185.0' y='293.2' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>read by cytotoxic T cells</text>
<text x='185.0' y='313.9' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ abnormal target may be killed</text>
<rect x='370.0' y='75.0' width='330.0' height='300.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.14'/>
<text x='535.0' y='148.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>MHC class II</text>
<text x='535.0' y='168.7' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>only on antigen-presenting</text>
<text x='535.0' y='189.5' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>cells (APCs)</text>
<text x='535.0' y='210.2' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>shows EXOGENOUS antigen</text>
<text x='535.0' y='230.9' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>(engulfed, then broken down)</text>
<text x='535.0' y='251.7' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'></text>
<text x='535.0' y='272.4' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>read by helper T cells</text>
<text x='535.0' y='293.2' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ APC NOT destroyed;</text>
<text x='535.0' y='313.9' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>it signals others to respond</text>
<text x='360.0' y='410.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>APCs: B cells, macrophages, monocytes, dendritic cells (Langerhans cells in skin).</text>
<text x='360.0' y='432.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>MHC-restricted: the T cell needs both the antigen AND the cell's own MHC.</text>
</svg>
