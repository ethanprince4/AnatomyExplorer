<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 520' width='700' height='520' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The baroreceptor reflex</title>
<text x='350.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Baroreceptor reflex: a negative-feedback loop</text>
<text x='350.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Shown for a RISE in blood pressure; a fall runs every arrow the other way</text>
<rect x='40.0' y='90.0' width='260.0' height='70.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.14'/>
<text x='170.0' y='120.6' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Blood pressure rises</text>
<text x='170.0' y='141.3' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>aorta &amp; carotid walls stretch</text>
<rect x='400.0' y='90.0' width='260.0' height='70.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='530.0' y='120.6' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Baroreceptors fire more</text>
<text x='530.0' y='141.3' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>sensory neurons in IX &amp; X</text>
<rect x='400.0' y='225.0' width='260.0' height='80.0' rx='8' stroke='#f4d03f' fill='#f4d03f' stroke-width='2' fill-opacity='0.14'/>
<text x='530.0' y='250.2' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Cardioregulatory centre</text>
<text x='530.0' y='270.9' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>medulla oblongata</text>
<text x='530.0' y='291.7' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>+ vasomotor centre</text>
<rect x='400.0' y='370.0' width='260.0' height='80.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.14'/>
<text x='530.0' y='396.1' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Cardioinhibitory ↑ (vagus)</text>
<text x='530.0' y='415.6' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Cardioacceleratory ↓</text>
<text x='530.0' y='435.1' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>sympathetic tone ↓</text>
<rect x='40.0' y='370.0' width='260.0' height='80.0' rx='8' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.14'/>
<text x='170.0' y='396.1' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>HR ↓, SV ↓</text>
<text x='170.0' y='415.6' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>vasodilation → PR ↓</text>
<text x='170.0' y='435.1' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>less epinephrine</text>
<rect x='40.0' y='225.0' width='260.0' height='80.0' rx='8' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.14'/>
<text x='170.0' y='260.6' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Blood pressure falls</text>
<text x='170.0' y='281.3' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>back toward normal</text>
<line x1='300.0' y1='125.0' x2='391.0' y2='125.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='400.0,125.0 390.5,130.5 390.5,119.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='530.0' y1='160.0' x2='530.0' y2='216.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='530.0,225.0 524.5,215.5 535.5,215.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='530.0' y1='305.0' x2='530.0' y2='361.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='530.0,370.0 524.5,360.5 535.5,360.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='400.0' y1='410.0' x2='309.0' y2='410.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='300.0,410.0 309.5,404.5 309.5,415.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='170.0' y1='370.0' x2='170.0' y2='314.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='170.0,305.0 175.5,314.5 164.5,314.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<text x='350.0' y='495.0' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>MAP = HR × SV × PR: the reflex changes all three.</text>
</svg>
