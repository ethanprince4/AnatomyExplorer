<path d="M330,115 Q380,100 430,115 L445,330 Q380,345 315,330 Z" stroke="#aab4c0" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<path d="M330,120 L200,250 L150,300" stroke="#aab4c0" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<path d="M430,120 L560,250 L610,300" stroke="#aab4c0" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<path d="M345,335 L320,470" stroke="#aab4c0" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<path d="M415,335 L440,470" stroke="#aab4c0" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<path d="M175.0,275.0 L585.0,275.0 L440.0,465.0 L175.0,275.0" stroke="#f5b041" fill="#f5b041" fill-opacity="0.06" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<circle cx="175.0" cy="275.0" r="11.0" stroke="#ff6b6b" fill="#000000" fill-opacity="0.4" stroke-width="3" opacity="1.0"/>
<text x="175.0" y="255.0" font-size="15" stroke="none" fill="#ff6b6b" text-anchor="middle" font-weight="bold" opacity="1.0">RA</text>
<circle cx="585.0" cy="275.0" r="11.0" stroke="#f4d03f" fill="#000000" fill-opacity="0.4" stroke-width="3" opacity="1.0"/>
<text x="585.0" y="255.0" font-size="15" stroke="none" fill="#f4d03f" text-anchor="middle" font-weight="bold" opacity="1.0">LA</text>
<circle cx="440.0" cy="465.0" r="11.0" stroke="#58d68d" fill="#000000" fill-opacity="0.4" stroke-width="3" opacity="1.0"/>
<text x="440.0" y="501.0" font-size="15" stroke="none" fill="#58d68d" text-anchor="middle" font-weight="bold" opacity="1.0">LL</text>
<circle cx="320.0" cy="465.0" r="11.0" stroke="#aab4c0" fill="#000000" fill-opacity="0.4" stroke-width="3" opacity="1.0"/>
<text x="320.0" y="501.0" font-size="15" stroke="none" fill="#aab4c0" text-anchor="middle" font-weight="bold" opacity="1.0">RL (ground)</text>
<line x1="215.0" y1="250.0" x2="548.0" y2="250.0" stroke="#5dade2" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-5dade2)"/>
<text x="380.0" y="240.0" font-size="14" stroke="none" fill="#5dade2" text-anchor="middle" font-weight="bold" opacity="1.0">Lead I: RA (−) → LA (+)   0°</text>
<line x1="150.0" y1="320.0" x2="405.0" y2="480.0" stroke="#bb8fce" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-bb8fce)"/>
<text x="150.0" y="380.0" font-size="14" stroke="none" fill="#bb8fce" text-anchor="start" font-weight="bold" opacity="1.0">Lead II:</text><text x="150.0" y="397.1" font-size="14" stroke="none" fill="#bb8fce" text-anchor="start" font-weight="bold" opacity="1.0">RA (−) → LL (+)</text><text x="150.0" y="414.2" font-size="14" stroke="none" fill="#bb8fce" text-anchor="start" font-weight="bold" opacity="1.0">+60°</text>
<line x1="615.0" y1="320.0" x2="475.0" y2="480.0" stroke="#58d68d" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-58d68d)"/>
<text x="560.0" y="390.0" font-size="14" stroke="none" fill="#58d68d" text-anchor="start" font-weight="bold" opacity="1.0">Lead III:</text><text x="560.0" y="407.1" font-size="14" stroke="none" fill="#58d68d" text-anchor="start" font-weight="bold" opacity="1.0">LA (−) → LL (+)</text><text x="560.0" y="424.2" font-size="14" stroke="none" fill="#58d68d" text-anchor="start" font-weight="bold" opacity="1.0">+120°</text>
<text x="20.0" y="30.0" font-size="18" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Einthoven's triangle</text>
<text x="20.0" y="52.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">Electrodes on the wrists and just above the medial malleoli; right leg = ground</text>
<text x="20.0" y="548.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">Each lead compares two electrodes. Lead II runs roughly along the heart's axis,</text>
<text x="20.0" y="568.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">so it usually gives the tallest, clearest trace.</text>
</svg>
