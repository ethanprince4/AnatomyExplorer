<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360">
  <title>Nerve fibre classes and saltatory conduction</title>
  <text x="20.0" y="30.0" fill="#e6e9ee" font-size="15" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Saltatory conduction in a myelinated axon</text>
  <line x1="40.0" y1="70.0" x2="780.0" y2="70.0" stroke="#e6e9ee" stroke-width="3" stroke-linecap="round"/>
  <rect x="50.0" y="57.0" width="110.0" height="26.0" rx="12" stroke="#f2b24c" stroke-width="2" fill="#f2b24c" fill-opacity="0.25"/>
  <rect x="174.0" y="57.0" width="110.0" height="26.0" rx="12" stroke="#f2b24c" stroke-width="2" fill="#f2b24c" fill-opacity="0.25"/>
  <rect x="298.0" y="57.0" width="110.0" height="26.0" rx="12" stroke="#f2b24c" stroke-width="2" fill="#f2b24c" fill-opacity="0.25"/>
  <rect x="422.0" y="57.0" width="110.0" height="26.0" rx="12" stroke="#f2b24c" stroke-width="2" fill="#f2b24c" fill-opacity="0.25"/>
  <rect x="546.0" y="57.0" width="110.0" height="26.0" rx="12" stroke="#f2b24c" stroke-width="2" fill="#f2b24c" fill-opacity="0.25"/>
  <rect x="670.0" y="57.0" width="110.0" height="26.0" rx="12" stroke="#f2b24c" stroke-width="2" fill="#f2b24c" fill-opacity="0.25"/>
  <path d="M 167 52 Q 229.0 10 291 52" stroke="#7ccf86" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 291.0 52.0 L 283.8 46.6 L 289.9 43.1 Z" stroke="#7ccf86" stroke-width="1" fill="#7ccf86" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 291 52 Q 353.0 10 415 52" stroke="#7ccf86" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 415.0 52.0 L 407.8 46.6 L 413.9 43.1 Z" stroke="#7ccf86" stroke-width="1" fill="#7ccf86" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 415 52 Q 477.0 10 539 52" stroke="#7ccf86" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 539.0 52.0 L 531.8 46.6 L 537.9 43.1 Z" stroke="#7ccf86" stroke-width="1" fill="#7ccf86" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 539 52 Q 601.0 10 663 52" stroke="#7ccf86" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 663.0 52.0 L 655.8 46.6 L 661.9 43.1 Z" stroke="#7ccf86" stroke-width="1" fill="#7ccf86" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 663 52 Q 725.0 10 787 52" stroke="#7ccf86" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 787.0 52.0 L 779.8 46.6 L 785.9 43.1 Z" stroke="#7ccf86" stroke-width="1" fill="#7ccf86" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="410.0" y="110.0" fill="#9aa4b1" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">the impulse jumps node to node - myelin insulates the internodes</text>
  <text x="30.0" y="170.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Class</text>
  <text x="95.0" y="170.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Myelin</text>
  <text x="170.0" y="170.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Diameter</text>
  <text x="265.0" y="170.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Speed</text>
  <text x="390.0" y="170.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Examples</text>
  <line x1="20.0" y1="184.0" x2="800.0" y2="184.0" stroke="#9aa4b1" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>
  <text x="30.0" y="208.0" fill="#7ccf86" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">A</text>
  <text x="95.0" y="208.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">heavy</text>
  <text x="170.0" y="208.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">largest</text>
  <text x="265.0" y="208.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">up to ~120 m/s</text>
  <text x="390.0" y="208.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">motor to skeletal muscle, touch, proprioception</text>
  <line x1="20.0" y1="222.0" x2="800.0" y2="222.0" stroke="#9aa4b1" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>
  <text x="30.0" y="246.0" fill="#f2b24c" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">B</text>
  <text x="95.0" y="246.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">light</text>
  <text x="170.0" y="246.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">medium</text>
  <text x="265.0" y="246.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">~3-15 m/s</text>
  <text x="390.0" y="246.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">preganglionic autonomic fibres</text>
  <line x1="20.0" y1="260.0" x2="800.0" y2="260.0" stroke="#9aa4b1" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>
  <text x="30.0" y="284.0" fill="#ef7a7a" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">C</text>
  <text x="95.0" y="284.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">none</text>
  <text x="170.0" y="284.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">smallest</text>
  <text x="265.0" y="284.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">~0.5-2 m/s</text>
  <text x="390.0" y="284.0" fill="#e6e9ee" font-size="14" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">slow pain, temperature, postganglionic autonomic</text>
  <line x1="20.0" y1="298.0" x2="800.0" y2="298.0" stroke="#9aa4b1" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>
  <text x="410.0" y="340.0" fill="#f2b24c" font-size="14" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">Wider and more myelinated = faster conduction</text>
</svg>
