<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 480' width='720' height='480' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The five antibody classes</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>IgG, IgM, IgA, IgE, IgD: know the job of each</text>
<rect x='30.0' y='88.0' width='90.0' height='52.0' rx='8' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.2'/>
<text x='75.0' y='121.0' font-size='20' fill='#58d68d' text-anchor='middle' font-weight='bold'>IgG</text>
<text x='140.0' y='110.0' font-size='16' fill='#e8ecf1' text-anchor='start' font-weight='bold'>80-85%</text>
<text x='140.0' y='132.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>activates complement; crosses placenta; Rh disease</text>
<rect x='30.0' y='158.0' width='90.0' height='52.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.2'/>
<text x='75.0' y='191.0' font-size='20' fill='#5dade2' text-anchor='middle' font-weight='bold'>IgM</text>
<text x='140.0' y='180.0' font-size='16' fill='#e8ecf1' text-anchor='start' font-weight='bold'>5-10%</text>
<text x='140.0' y='202.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>first made; B-cell receptor; ABO transfusion reactions</text>
<rect x='30.0' y='228.0' width='90.0' height='52.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.2'/>
<text x='75.0' y='261.0' font-size='20' fill='#f5b041' text-anchor='middle' font-weight='bold'>IgA</text>
<text x='140.0' y='250.0' font-size='16' fill='#e8ecf1' text-anchor='start' font-weight='bold'>15%</text>
<text x='140.0' y='272.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>secreted: saliva, tears, mucus, milk (surfaces + newborn)</text>
<rect x='30.0' y='298.0' width='90.0' height='52.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.2'/>
<text x='75.0' y='331.0' font-size='20' fill='#ff6b6b' text-anchor='middle' font-weight='bold'>IgE</text>
<text x='140.0' y='320.0' font-size='16' fill='#e8ecf1' text-anchor='start' font-weight='bold'>0.002%</text>
<text x='140.0' y='342.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>binds mast cells &amp; basophils → inflammation (hay fever)</text>
<rect x='30.0' y='368.0' width='90.0' height='52.0' rx='8' stroke='#bb8fce' fill='#bb8fce' stroke-width='2' fill-opacity='0.2'/>
<text x='75.0' y='401.0' font-size='20' fill='#bb8fce' text-anchor='middle' font-weight='bold'>IgD</text>
<text x='140.0' y='390.0' font-size='16' fill='#e8ecf1' text-anchor='start' font-weight='bold'>0.2%</text>
<text x='140.0' y='412.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>antigen-binding receptor on B cells</text>
<text x='360.0' y='460.0' font-size='13' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Direct effects: block the antigen, or clump antigens together.  Indirect: complement, inflammation, opsonization.</text>
</svg>
