<text x="450.0" y="390.0" font-size="14" stroke="none" fill="#aab4c0" text-anchor="middle" font-weight="bold" opacity="1.0">SYSTEMIC</text><text x="450.0" y="407.1" font-size="14" stroke="none" fill="#aab4c0" text-anchor="middle" font-weight="bold" opacity="1.0">CIRCUIT</text>
<text x="20.0" y="590.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">Blue = deoxygenated, red = oxygenated.  Pulmonary arteries carry deoxygenated blood; pulmonary veins carry oxygenated blood.</text>
