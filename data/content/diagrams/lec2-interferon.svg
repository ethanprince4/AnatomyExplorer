<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 380' width='700' height='380' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>How interferons protect neighbouring cells</title>
<text x='350.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Interferons: the infected cell warns its neighbours</text>
<rect x='30.0' y='90.0' width='200.0' height='140.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.14'/>
<text x='130.0' y='146.1' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Virus-infected cell</text>
<text x='130.0' y='165.6' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>makes interferons</text>
<text x='130.0' y='185.1' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>too late for itself</text>
<line x1='230.0' y1='160.0' x2='301.0' y2='160.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='310.0,160.0 300.5,165.5 300.5,154.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<rect x='310.0' y='90.0' width='160.0' height='140.0' rx='8' stroke='#f4d03f' fill='#f4d03f' stroke-width='2' fill-opacity='0.14'/>
<text x='390.0' y='146.1' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Interferon</text>
<text x='390.0' y='165.6' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>released</text>
<text x='390.0' y='185.1' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>into ECF</text>
<line x1='470.0' y1='160.0' x2='541.0' y2='160.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='550.0,160.0 540.5,165.5 540.5,154.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<rect x='550.0' y='90.0' width='120.0' height='140.0' rx='8' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.14'/>
<text x='610.0' y='146.9' font-size='15' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Neighbour</text>
<text x='610.0' y='165.2' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>makes antiviral</text>
<text x='610.0' y='183.5' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>proteins</text>
<text x='40.0' y='270.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>The interferon cannot save the cell that made it.</text>
<text x='40.0' y='292.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>Neighbouring cells bind it, make antiviral proteins, and stop the virus replicating.</text>
<text x='40.0' y='314.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>Also used against some cancers.  This is innate, not antigen-specific.</text>
</svg>
