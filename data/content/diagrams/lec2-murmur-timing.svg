<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 380' width='700' height='380' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>When murmurs are heard</title>
<text x='350.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Where a murmur falls tells you which valve</text>
<text x='350.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>S1 'lub' = AV valves close · S2 'dup' = semilunar valves close</text>
<line x1='40.0' y1='150.0' x2='660.0' y2='150.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<rect x='96.0' y='110.0' width='28.0' height='80.0' rx='4' stroke='#e8ecf1' fill='#e8ecf1' stroke-width='2' fill-opacity='0.6'/>
<text x='110.0' y='100.0' font-size='18' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>S1</text>
<rect x='316.0' y='110.0' width='28.0' height='80.0' rx='4' stroke='#e8ecf1' fill='#e8ecf1' stroke-width='2' fill-opacity='0.6'/>
<text x='330.0' y='100.0' font-size='18' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>S2</text>
<rect x='566.0' y='110.0' width='28.0' height='80.0' rx='4' stroke='#e8ecf1' fill='#e8ecf1' stroke-width='2' fill-opacity='0.6'/>
<text x='580.0' y='100.0' font-size='18' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>S1</text>
<text x='220.0' y='220.0' font-size='15' fill='#ff6b6b' text-anchor='middle' font-weight='bold'>ventricular systole</text>
<text x='455.0' y='220.0' font-size='15' fill='#5dade2' text-anchor='middle' font-weight='bold'>ventricular diastole</text>
<path d='M135,146 Q145.625,132 156.25,146 Q166.875,160 177.5,146 Q188.125,132 198.75,146 Q209.375,160 220.0,146 Q230.625,132 241.25,146 Q251.875,160 262.5,146 Q273.125,132 283.75,146 Q294.375,160 305.0,146' stroke='#f4d03f' fill='none' stroke-width='3' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<path d='M355,154 Q366.875,140 378.75,154 Q390.625,168 402.5,154 Q414.375,140 426.25,154 Q438.125,168 450.0,154 Q461.875,140 473.75,154 Q485.625,168 497.5,154 Q509.375,140 521.25,154 Q533.125,168 545.0,154' stroke='#f5b041' fill='none' stroke-width='3' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<text x='40.0' y='270.0' font-size='15' fill='#f4d03f' text-anchor='start' font-weight='normal'>Swish AFTER S1 (in systole): an incompetent AV valve lets blood leak back into</text>
<text x='40.0' y='290.0' font-size='15' fill='#f4d03f' text-anchor='start' font-weight='normal'>the atrium while the ventricle squeezes.</text>
<text x='40.0' y='322.0' font-size='15' fill='#f5b041' text-anchor='start' font-weight='normal'>Swish AFTER S2 (in diastole): an incompetent semilunar valve lets blood leak back</text>
<text x='40.0' y='342.0' font-size='15' fill='#f5b041' text-anchor='start' font-weight='normal'>into the relaxing ventricle. Stenosis: aortic = systolic; mitral = diastolic.</text>
</svg>
