<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Bile ducts, gallbladder and pancreatic ducts</title><defs><marker id="ah-5dade2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5dade2"/></marker><marker id="ah-f5b041" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5b041"/></marker></defs>
<text x="20.0" y="32.0" font-size="18" fill="#e8ecf1" text-anchor="start" font-weight="bold">Where bile goes</text>
<text x="20.0" y="52.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">Liver → ducts → gallbladder between meals; gallbladder → duodenum after a meal</text>
<path d="M250,80 Q450,40 640,90 Q600,160 450,165 Q330,165 250,140 Z" stroke="#f5b041" fill="#f5b041" fill-opacity="0.18" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<text x="445.0" y="112.0" font-size="14" fill="#f5b041" text-anchor="middle" font-weight="bold">liver</text>
<line x1="390.0" y1="160.0" x2="440.0" y2="215.0" stroke="#58d68d" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<line x1="500.0" y1="160.0" x2="450.0" y2="215.0" stroke="#58d68d" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<text x="372.0" y="186.0" font-size="11.5" fill="#e8ecf1" text-anchor="end" font-weight="normal">right hepatic</text>
<text x="372.0" y="200.4" font-size="11.5" fill="#e8ecf1" text-anchor="end" font-weight="normal">duct</text>
<text x="512.0" y="186.0" font-size="11.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">left hepatic</text>
<text x="512.0" y="200.4" font-size="11.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">duct</text>
<line x1="445.0" y1="215.0" x2="445.0" y2="285.0" stroke="#58d68d" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<text x="455.0" y="255.0" font-size="11.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">common hepatic duct</text>
<path d="M445,285 Q400,292 360,275" stroke="#58d68d" fill="none" fill-opacity="1.0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<text x="392.0" y="272.0" font-size="11.5" fill="#e8ecf1" text-anchor="middle" font-weight="normal">cystic duct</text>
<path d="M360,275 Q320,250 230,262 Q180,275 200,310 Q240,330 330,300 Q352,292 360,275 Z" stroke="#58d68d" fill="#58d68d" fill-opacity="0.25" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<text x="255.0" y="294.0" font-size="12.5" fill="#e8ecf1" text-anchor="middle" font-weight="bold">gallbladder</text>
<line x1="445.0" y1="285.0" x2="445.0" y2="445.0" stroke="#58d68d" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
<text x="455.0" y="350.0" font-size="11.5" fill="#e8ecf1" text-anchor="start" font-weight="normal">common bile duct</text>
<rect x="560.0" y="250.0" width="60.0" height="275.0" rx="18" stroke="#f1948a" fill="#f1948a" fill-opacity="0.12" stroke-width="2"/>
<text x="590.0" y="545.0" font-size="12" fill="#f1948a" text-anchor="middle" font-weight="normal">duodenum</text>
<path d="M470,425 Q620,405 790,445 Q820,495 760,505 Q620,495 470,485 Z" stroke="#bb8fce" fill="#bb8fce" fill-opacity="0.14" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<text x="730.0" y="530.0" font-size="12" fill="#bb8fce" text-anchor="middle" font-weight="normal">pancreas</text>
<line x1="780.0" y1="465.0" x2="560.0" y2="457.0" stroke="#bb8fce" stroke-width="4" stroke-linecap="round" opacity="1.0"/>
<text x="690.0" y="488.0" font-size="11" fill="#e8ecf1" text-anchor="middle" font-weight="normal">main pancreatic duct</text>
<path d="M445,445 Q500,457 560,457" stroke="#58d68d" fill="none" fill-opacity="1.0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<circle cx="560.0" cy="457.0" r="9.0" stroke="#f4d03f" fill="#f4d03f" fill-opacity="0.8" stroke-width="1.5"/>
<text x="630.0" y="372.0" font-size="11" fill="#f4d03f" text-anchor="start" font-weight="normal">hepatopancreatic ampulla</text>
<text x="630.0" y="385.8" font-size="11" fill="#f4d03f" text-anchor="start" font-weight="normal">→ major duodenal papilla</text>
<text x="630.0" y="399.5" font-size="11" fill="#f4d03f" text-anchor="start" font-weight="normal">(hepatopancreatic sphincter)</text>
<line x1="720.0" y1="445.0" x2="560.0" y2="330.0" stroke="#bb8fce" stroke-width="2.5" stroke-linecap="round" opacity="1.0"/>
<circle cx="560.0" cy="330.0" r="6.0" stroke="#bb8fce" fill="#bb8fce" fill-opacity="0.9" stroke-width="1.5"/>
<text x="630.0" y="300.0" font-size="11" fill="#e8ecf1" text-anchor="start" font-weight="normal">accessory pancreatic duct</text>
<text x="630.0" y="313.8" font-size="11" fill="#e8ecf1" text-anchor="start" font-weight="normal">→ minor duodenal papilla</text>
<rect x="30.0" y="400.0" width="330.0" height="118.0" rx="10" stroke="#5dade2" fill="#5dade2" fill-opacity="0.06" stroke-width="1.5"/>
<text x="46.0" y="424.0" font-size="13" fill="#5dade2" text-anchor="start" font-weight="bold">Between meals</text>
<text x="46.0" y="444.0" font-size="12" fill="#e8ecf1" text-anchor="start" font-weight="normal">sphincter closed → bile backs up the</text>
<text x="46.0" y="459.0" font-size="12" fill="#e8ecf1" text-anchor="start" font-weight="normal">cystic duct → stored and concentrated</text>
<text x="46.0" y="474.0" font-size="12" fill="#e8ecf1" text-anchor="start" font-weight="normal">in the gallbladder</text>
<line x1="400.0" y1="302.0" x2="340.0" y2="302.0" stroke="#5dade2" stroke-width="2" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-5dade2)"/>
<rect x="20.0" y="160.0" width="215.0" height="82.0" rx="10" stroke="#f5b041" fill="#f5b041" fill-opacity="0.06" stroke-width="1.5"/>
<text x="32.0" y="182.0" font-size="13" fill="#f5b041" text-anchor="start" font-weight="bold">After a fatty meal</text>
<text x="32.0" y="202.0" font-size="12" fill="#e8ecf1" text-anchor="start" font-weight="normal">gallbladder contracts →</text>
<text x="32.0" y="217.0" font-size="12" fill="#e8ecf1" text-anchor="start" font-weight="normal">cystic duct → common bile</text>
<text x="32.0" y="232.0" font-size="12" fill="#e8ecf1" text-anchor="start" font-weight="normal">duct → duodenum</text>
<line x1="340.0" y1="318.0" x2="400.0" y2="318.0" stroke="#f5b041" stroke-width="2" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-f5b041)"/>
<text x="20.0" y="574.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">Bile salts emulsify fat into small droplets, giving pancreatic lipase far more surface to work on.</text>
</svg>
