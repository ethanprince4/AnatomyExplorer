<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Flow–volume loops: normal, obstructive and restrictive</title><defs></defs>
<text x="20.0" y="32.0" font-size="18" fill="#e8ecf1" text-anchor="start" font-weight="bold">Flow–volume loops</text>
<text x="20.0" y="52.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">Maximal breath out from total lung capacity, then maximal breath in</text>
<line x1="110.0" y1="270.0" x2="586.0" y2="270.0" stroke="#aab4c0" stroke-width="1.5" stroke-linecap="round" opacity="1.0"/>
<line x1="110.0" y1="70.0" x2="110.0" y2="420.0" stroke="#aab4c0" stroke-width="1.5" stroke-linecap="round" opacity="1.0"/>
<line x1="110.0" y1="434.0" x2="586.0" y2="434.0" stroke="#aab4c0" stroke-width="1.5" stroke-linecap="round" opacity="1.0"/>
<line x1="105.0" y1="390.0" x2="110.0" y2="390.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="101.0" y="394.0" font-size="11" fill="#aab4c0" text-anchor="end" font-weight="normal">-6</text>
<line x1="105.0" y1="330.0" x2="110.0" y2="330.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="101.0" y="334.0" font-size="11" fill="#aab4c0" text-anchor="end" font-weight="normal">-3</text>
<line x1="105.0" y1="210.0" x2="110.0" y2="210.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="101.0" y="214.0" font-size="11" fill="#aab4c0" text-anchor="end" font-weight="normal">3</text>
<line x1="105.0" y1="150.0" x2="110.0" y2="150.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="101.0" y="154.0" font-size="11" fill="#aab4c0" text-anchor="end" font-weight="normal">6</text>
<line x1="105.0" y1="90.0" x2="110.0" y2="90.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="101.0" y="94.0" font-size="11" fill="#aab4c0" text-anchor="end" font-weight="normal">9</text>
<text x="50.0" y="200.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">flow</text>
<text x="50.0" y="215.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">(L/s)</text>
<text x="118.0" y="78.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">expiration (+)</text>
<text x="118.0" y="414.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">inspiration (−)</text>
<line x1="552.0" y1="434.0" x2="552.0" y2="439.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="552.0" y="452.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">1</text>
<line x1="484.0" y1="434.0" x2="484.0" y2="439.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="484.0" y="452.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">2</text>
<line x1="416.0" y1="434.0" x2="416.0" y2="439.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="416.0" y="452.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">3</text>
<line x1="348.0" y1="434.0" x2="348.0" y2="439.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="348.0" y="452.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">4</text>
<line x1="280.0" y1="434.0" x2="280.0" y2="439.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="280.0" y="452.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">5</text>
<line x1="212.0" y1="434.0" x2="212.0" y2="439.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="212.0" y="452.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">6</text>
<line x1="144.0" y1="434.0" x2="144.0" y2="439.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="144.0" y="452.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">7</text>
<text x="348.0" y="470.0" font-size="12" fill="#aab4c0" text-anchor="middle" font-weight="normal">lung volume (L)  — high volume (TLC) on the left, low (RV) on the right</text>
<path d="M212.0,270 C214.0,144.0 220.2,90.0 232.4,90.0 L538.4,270 C538.4,429.6 212.0,429.6 212.0,270" stroke="#58d68d" fill="none" fill-opacity="1.0" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<path d="M130.4,270 C132.4,207.0 138.6,180.0 150.8,180.0 Q198.4,261.0 402.4,270 C402.4,389.7 130.4,389.7 130.4,270" stroke="#f5b041" fill="none" fill-opacity="1.0" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<path d="M361.6,270 C363.6,172.0 369.8,130.0 382.0,130.0 L552.0,270 C552.0,389.7 361.6,389.7 361.6,270" stroke="#5dade2" fill="none" fill-opacity="1.0" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<line x1="262.4" y1="86.0" x2="302.4" y2="68.0" stroke="#58d68d" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/>
<text x="306.4" y="66.0" font-size="12" fill="#58d68d" text-anchor="start" font-weight="normal">peak expiratory flow</text>
<text x="640.0" y="110.0" font-size="14" fill="#58d68d" text-anchor="start" font-weight="bold">normal</text>
<text x="640.0" y="128.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">sharp peak, straight fall</text>
<text x="640.0" y="143.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">to residual volume</text>
<text x="640.0" y="175.0" font-size="14" fill="#f5b041" text-anchor="start" font-weight="bold">obstructive</text>
<text x="640.0" y="193.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">low peak, scooped (concave)</text>
<text x="640.0" y="208.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">limb; sits at high volumes</text>
<text x="640.0" y="223.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">(air trapping)</text>
<text x="640.0" y="256.0" font-size="14" fill="#5dade2" text-anchor="start" font-weight="bold">restrictive</text>
<text x="640.0" y="274.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">normal shape but small and</text>
<text x="640.0" y="289.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">narrow; low volumes</text>
<text x="20.0" y="524.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">Inspiration is a rounded curve below the line in every case; the expiratory limb carries the diagnosis.</text>
</svg>
