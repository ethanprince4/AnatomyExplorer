<path d="M392,470 Q470,470 520,410 M392,480 Q500,460 535,340" stroke="#f4d03f" fill="none" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
<text x="60.0" y="90.0" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">1  SA node - the pacemaker, in the right atrial wall near the SVC opening</text>
<text x="60.0" y="112.0" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">2  impulse spreads over both atria (P wave)</text>
<text x="560.0" y="250.0" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">3  AV node: ~0.1 s delay</text><text x="560.0" y="265.9" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">    lets the atria finish</text><text x="560.0" y="281.7" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">    emptying</text>
<text x="560.0" y="320.0" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">4  AV bundle (bundle of His):</text><text x="560.0" y="335.9" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">    the only normal electrical</text><text x="560.0" y="351.7" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">    link atria → ventricles</text>
<text x="560.0" y="400.0" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">5  right &amp; left bundle</text><text x="560.0" y="415.9" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">    branches in the</text><text x="560.0" y="431.7" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">    interventricular septum</text>
<text x="560.0" y="470.0" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">6  Purkinje fibres:</text><text x="560.0" y="485.9" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">    apex first, then up the</text><text x="560.0" y="501.7" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">    walls (QRS)</text>
<text x="60.0" y="520.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">Everything drawn yellow is modified cardiac muscle, not nerve.</text>
<text x="20.0" y="36.0" font-size="18" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Conduction system</text>
</svg>
