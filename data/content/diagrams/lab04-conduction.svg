<text x="255.0" y="205.0" font-size="18" stroke="none" fill="#aab4c0" text-anchor="middle" font-weight="bold" opacity="1.0">RA</text>
<text x="470.0" y="205.0" font-size="18" stroke="none" fill="#aab4c0" text-anchor="middle" font-weight="bold" opacity="1.0">LA</text>
<text x="290.0" y="350.0" font-size="18" stroke="none" fill="#aab4c0" text-anchor="middle" font-weight="bold" opacity="1.0">RV</text>
<text x="460.0" y="380.0" font-size="18" stroke="none" fill="#aab4c0" text-anchor="middle" font-weight="bold" opacity="1.0">LV</text>
<circle cx="245.0" cy="140.0" r="13.0" stroke="#f4d03f" fill="#f4d03f" fill-opacity="0.5" stroke-width="3" opacity="1.0"/>
<path d="M245,140 Q300,180 350,262" stroke="#f4d03f" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.8" stroke-dasharray="4 5"/>
<path d="M245,140 Q360,110 440,170" stroke="#f4d03f" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.8" stroke-dasharray="4 5"/>
