<text x="570.0" y="390.0" font-size="12" fill="#f1948a" text-anchor="middle" font-weight="normal">secondary oocyte (meiosis I complete)</text>
<text x="400.0" y="106.0" font-size="11" fill="#f5b041" text-anchor="start" font-weight="normal">theca</text>
<text x="452.0" y="234.0" font-size="11" fill="#f4d03f" text-anchor="middle" font-weight="normal">cumulus</text>
<text x="20.0" y="454.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">Most follicles never ovulate and degenerate (atretic follicles).  Humans usually ovulate one oocyte a cycle.</text>
