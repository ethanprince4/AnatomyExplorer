<line x1="516.0" y1="325.0" x2="454.0" y2="325.0" stroke="#bb8fce" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-bb8fce)"/>
<line x1="375.0" y1="300.0" x2="375.0" y2="208.0" stroke="#bb8fce" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-bb8fce)"/>
<line x1="296.0" y1="182.0" x2="194.0" y2="182.0" stroke="#bb8fce" fill="none" stroke-width="1.5" stroke-linecap="round" opacity="1.0" stroke-dasharray="4 4" marker-end="url(#ah-bb8fce)"/>
<text x="200.0" y="225.0" font-size="11" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">little flow</text>
<path d="M450,172 Q520,150 580,108" stroke="#bb8fce" fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-bb8fce)"/>
<text x="430.0" y="130.0" font-size="13" stroke="none" fill="#f5b041" text-anchor="start" font-weight="bold" opacity="1.0">ductus arteriosus</text>
<line x1="670.0" y1="325.0" x2="756.0" y2="325.0" stroke="#bb8fce" fill="none" stroke-width="4" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-bb8fce)"/>
<text x="670.0" y="292.0" font-size="13" stroke="none" fill="#f5b041" text-anchor="start" font-weight="bold" opacity="1.0">foramen ovale</text>
<line x1="835.0" y1="350.0" x2="835.0" y2="386.0" stroke="#bb8fce" fill="none" stroke-width="3" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-bb8fce)"/>
<path d="M910,410 Q930,200 764,82" stroke="#bb8fce" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-bb8fce)"/>
<path d="M660,60 Q640,20 900,20 Q935,20 935,200 L935,630 L240,630 Q214,630 212,600" stroke="#5dade2" fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-5dade2)"/>
<text x="250.0" y="622.0" font-size="13" stroke="none" fill="#5dade2" text-anchor="start" font-weight="bold" opacity="1.0">umbilical arteries (from internal iliacs): O₂-poor blood back to the placenta</text>
<text x="560.0" y="508.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="bold" opacity="1.0">After birth:</text>
<text x="560.0" y="527.0" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">Umbilical vein → round ligament of liver</text>
<text x="560.0" y="545.0" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">Ductus venosus → ligamentum venosum</text>
<text x="560.0" y="563.0" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">Foramen ovale → fossa ovalis</text>
<text x="560.0" y="581.0" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">Ductus arteriosus → ligamentum arteriosum</text>
<text x="560.0" y="599.0" font-size="12" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0">Umbilical arteries → medial umbilical ligaments</text>
<text x="20.0" y="30.0" font-size="18" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Fetal circulation: three shunts bypass the liver and lungs</text>
</svg>
