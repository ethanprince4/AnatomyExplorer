<text x="375.0" y="186.7" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="normal" opacity="1.0">Pulmonary trunk</text>
<rect x="40.0" y="160.0" width="150.0" height="44.0" rx="8" stroke="#c9d1dc" fill="#ffffff" fill-opacity="0.04" stroke-width="2" opacity="1.0"/>
