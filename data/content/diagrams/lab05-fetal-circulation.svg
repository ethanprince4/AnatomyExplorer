<rect x="560.0" y="60.0" width="200.0" height="44.0" rx="8" stroke="#bb8fce" fill="#ffffff" fill-opacity="0.04" stroke-width="2" opacity="1.0"/>
<text x="660.0" y="87.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="bold" opacity="1.0">Aorta → body</text>
<path d="M125,540 L125,500 Q125,470 240,470 L296,488" stroke="#ff6b6b" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" stroke-dasharray="5 4" marker-end="url(#ah-ff6b6b)"/>
<path d="M240,470 Q260,400 380,410 Q480,420 516,455" stroke="#ff6b6b" fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-ff6b6b)"/>
<text x="40.0" y="470.0" font-size="13" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">umbilical vein</text><text x="40.0" y="485.9" font-size="13" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">(O₂-rich)</text>
<text x="330.0" y="398.0" font-size="13" stroke="none" fill="#f5b041" text-anchor="start" font-weight="bold" opacity="1.0">ductus venosus</text>
<text x="310.0" y="540.0" font-size="11" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">some blood through the liver</text>
