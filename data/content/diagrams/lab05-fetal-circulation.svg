<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" width="940" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Fetal circulation and its three shunts</title><defs><marker id="ah-58d68d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58d68d"/></marker><marker id="ah-5dade2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5dade2"/></marker><marker id="ah-aab4c0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab4c0"/></marker><marker id="ah-bb8fce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bb8fce"/></marker><marker id="ah-c9d1dc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1dc"/></marker><marker id="ah-e8ecf1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8ecf1"/></marker><marker id="ah-f1948a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f1948a"/></marker><marker id="ah-f4d03f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4d03f"/></marker><marker id="ah-f5b041" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5b041"/></marker><marker id="ah-ff6b6b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker></defs>
<rect x="40.0" y="540.0" width="170.0" height="60.0" rx="8" stroke="#58d68d" fill="#58d68d" fill-opacity="0.12" stroke-width="2" opacity="1.0"/>
<text x="125.0" y="575.8" font-size="16" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="bold" opacity="1.0">Placenta</text>
<rect x="300.0" y="470.0" width="150.0" height="50.0" rx="8" stroke="#c9d1dc" fill="#ffffff" fill-opacity="0.04" stroke-width="2" opacity="1.0"/>
<text x="375.0" y="500.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="normal" opacity="1.0">Liver</text>
<rect x="520.0" y="440.0" width="150.0" height="44.0" rx="8" stroke="#bb8fce" fill="#ffffff" fill-opacity="0.04" stroke-width="2" opacity="1.0"/>
<text x="595.0" y="466.7" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="normal" opacity="1.0">Inferior vena cava</text>
<rect x="520.0" y="300.0" width="150.0" height="50.0" rx="8" stroke="#bb8fce" fill="#ffffff" fill-opacity="0.04" stroke-width="2" opacity="1.0"/>
<text x="595.0" y="330.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="bold" opacity="1.0">Right atrium</text>
<rect x="760.0" y="300.0" width="150.0" height="50.0" rx="8" stroke="#bb8fce" fill="#ffffff" fill-opacity="0.04" stroke-width="2" opacity="1.0"/>
<text x="835.0" y="330.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="bold" opacity="1.0">Left atrium</text>
<rect x="300.0" y="300.0" width="150.0" height="50.0" rx="8" stroke="#bb8fce" fill="#ffffff" fill-opacity="0.04" stroke-width="2" opacity="1.0"/>
<text x="375.0" y="329.7" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="normal" opacity="1.0">Right ventricle</text>
<rect x="760.0" y="390.0" width="150.0" height="44.0" rx="8" stroke="#bb8fce" fill="#ffffff" fill-opacity="0.04" stroke-width="2" opacity="1.0"/>
<text x="835.0" y="416.7" font-size="13" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="normal" opacity="1.0">Left ventricle</text>
