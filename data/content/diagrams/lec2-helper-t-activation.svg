<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 520' width='720' height='520' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Activating a helper T cell and what it then does</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Helper T cells go first, then switch on B cells and cytotoxic T cells</text>
<rect x='20.0' y='80.0' width='200.0' height='120.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='120.0' y='116.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>APC</text>
<text x='120.0' y='135.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>e.g. macrophage:</text>
<text x='120.0' y='155.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>eats antigen, shows</text>
<text x='120.0' y='174.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>it on MHC class II</text>
<rect x='500.0' y='80.0' width='200.0' height='120.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.14'/>
<text x='600.0' y='116.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Helper T cell</text>
<text x='600.0' y='135.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>its receptor fits</text>
<text x='600.0' y='155.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>that antigen</text>
<text x='600.0' y='174.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>+ MHC II</text>
<line x1='231.0' y1='112.0' x2='489.0' y2='112.0' stroke='#f4d03f' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='498.0,112.0 488.5,117.5 488.5,106.5' fill='#f4d03f' stroke='#f4d03f' stroke-width='1.5' fill-opacity='1.0'/>
<polygon points='222.0,112.0 231.5,106.5 231.5,117.5' fill='#f4d03f' stroke='#f4d03f' stroke-width='1.5' fill-opacity='1.0'/>
<text x='360.0' y='105.0' font-size='13' fill='#f4d03f' text-anchor='middle' font-weight='bold'>1 MHC II/antigen ↔ T-cell receptor</text>
<line x1='231.0' y1='146.0' x2='489.0' y2='146.0' stroke='#58d68d' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='498.0,146.0 488.5,151.5 488.5,140.5' fill='#58d68d' stroke='#58d68d' stroke-width='1.5' fill-opacity='1.0'/>
<polygon points='222.0,146.0 231.5,140.5 231.5,151.5' fill='#58d68d' stroke='#58d68d' stroke-width='1.5' fill-opacity='1.0'/>
<text x='360.0' y='139.0' font-size='13' fill='#58d68d' text-anchor='middle' font-weight='bold'>2 B7 ↔ CD28 (costimulation)</text>
<line x1='222.0' y1='180.0' x2='489.0' y2='180.0' stroke='#bb8fce' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='498.0,180.0 488.5,185.5 488.5,174.5' fill='#bb8fce' stroke='#bb8fce' stroke-width='1.5' fill-opacity='1.0'/>
<text x='360.0' y='173.0' font-size='13' fill='#bb8fce' text-anchor='middle' font-weight='bold'>3 cytokines (IL-1) from the APC</text>
<line x1='600.0' y1='200.0' x2='600.0' y2='236.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='600.0,245.0 594.5,235.5 605.5,235.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<rect x='390.0' y='245.0' width='300.0' height='60.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.14'/>
<text x='540.0' y='270.8' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>TH proliferates (clone)</text>
<text x='540.0' y='290.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>secretes IL-2 and other cytokines</text>
<line x1='470.0' y1='305.0' x2='208.8' y2='358.2' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='200.0,360.0 208.2,352.7 210.4,363.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='610.0' y1='305.0' x2='566.1' y2='353.3' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='560.0,360.0 562.3,349.3 570.5,356.7' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<rect x='30.0' y='360.0' width='320.0' height='110.0' rx='8' stroke='#bb8fce' fill='#bb8fce' stroke-width='2' fill-opacity='0.14'/>
<text x='190.0' y='391.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>B cell activated</text>
<text x='190.0' y='410.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ plasma cells (antibodies)</text>
<text x='190.0' y='430.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ memory B cells</text>
<text x='190.0' y='449.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>antibody-mediated</text>
<rect x='390.0' y='360.0' width='300.0' height='110.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.14'/>
<text x='540.0' y='391.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Cytotoxic T cell activated</text>
<text x='540.0' y='410.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ more TC cells</text>
<text x='540.0' y='430.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ memory T cells</text>
<text x='540.0' y='449.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>cell-mediated</text>
<text x='360.0' y='505.0' font-size='14' fill='#aab4c0' text-anchor='middle' font-weight='normal'>No costimulation → no response: one of the ways the body stays tolerant of self.</text>
</svg>
