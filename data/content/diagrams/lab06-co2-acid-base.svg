<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Carbon dioxide, carbonic acid and blood pH</title><defs><marker id="ah-e8ecf1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8ecf1"/></marker></defs>
<text x="20.0" y="32.0" font-size="18" fill="#e8ecf1" text-anchor="start" font-weight="bold">CO₂ and blood pH</text>
<text x="20.0" y="52.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">Breathing controls the left-hand side of the equation</text>
<rect x="55.0" y="110.0" width="190.0" height="50.0" rx="10" stroke="#e8ecf1" fill="none" fill-opacity="0.0" stroke-width="1.5"/>
<text x="150.0" y="143.0" font-size="20" fill="#e8ecf1" text-anchor="middle" font-weight="bold">CO₂ + H₂O</text>
<rect x="325.0" y="110.0" width="190.0" height="50.0" rx="10" stroke="#f4d03f" fill="none" fill-opacity="0.0" stroke-width="1.5"/>
<text x="420.0" y="143.0" font-size="20" fill="#f4d03f" text-anchor="middle" font-weight="bold">H₂CO₃</text>
<rect x="595.0" y="110.0" width="190.0" height="50.0" rx="10" stroke="#e8ecf1" fill="none" fill-opacity="0.0" stroke-width="1.5"/>
<text x="690.0" y="143.0" font-size="20" fill="#e8ecf1" text-anchor="middle" font-weight="bold">H⁺ + HCO₃⁻</text>
<text x="420.0" y="184.0" font-size="12" fill="#aab4c0" text-anchor="middle" font-weight="normal">carbonic acid</text>
<text x="150.0" y="184.0" font-size="12" fill="#aab4c0" text-anchor="middle" font-weight="normal">carbon dioxide + water</text>
<text x="690.0" y="184.0" font-size="12" fill="#aab4c0" text-anchor="middle" font-weight="normal">hydrogen ion + bicarbonate ion</text>
<line x1="250.0" y1="128.0" x2="320.0" y2="128.0" stroke="#e8ecf1" stroke-width="2" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-e8ecf1)"/>
<line x1="320.0" y1="142.0" x2="250.0" y2="142.0" stroke="#e8ecf1" stroke-width="2" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-e8ecf1)"/>
<line x1="520.0" y1="128.0" x2="590.0" y2="128.0" stroke="#e8ecf1" stroke-width="2" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-e8ecf1)"/>
<line x1="590.0" y1="142.0" x2="520.0" y2="142.0" stroke="#e8ecf1" stroke-width="2" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-e8ecf1)"/>
<text x="285.0" y="88.0" font-size="11" fill="#58d68d" text-anchor="middle" font-weight="normal">carbonic anhydrase</text>
<text x="285.0" y="101.0" font-size="10" fill="#aab4c0" text-anchor="middle" font-weight="normal">(in red cells)</text>
<rect x="40.0" y="210.0" width="390.0" height="150.0" rx="10" stroke="#ff6b6b" fill="#ff6b6b" fill-opacity="0.06" stroke-width="1.5"/>
<text x="60.0" y="238.0" font-size="14" fill="#ff6b6b" text-anchor="start" font-weight="bold">Hypoventilation (CO₂ retained)</text>
<text x="60.0" y="262.0" font-size="13" fill="#e8ecf1" text-anchor="start" font-weight="normal">reaction pushed to the right →</text>
<text x="60.0" y="284.0" font-size="13" fill="#e8ecf1" text-anchor="start" font-weight="normal">more H⁺ → pH falls</text>
<text x="60.0" y="306.0" font-size="13" fill="#ff6b6b" text-anchor="start" font-weight="normal">respiratory acidosis</text>
<text x="60.0" y="334.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">also: exhaled CO₂ turns litmus red</text>
<rect x="470.0" y="210.0" width="390.0" height="150.0" rx="10" stroke="#5dade2" fill="#5dade2" fill-opacity="0.06" stroke-width="1.5"/>
<text x="490.0" y="238.0" font-size="14" fill="#5dade2" text-anchor="start" font-weight="bold">Hyperventilation (CO₂ blown off)</text>
<text x="490.0" y="262.0" font-size="13" fill="#e8ecf1" text-anchor="start" font-weight="normal">← reaction pulled to the left</text>
<text x="490.0" y="284.0" font-size="13" fill="#e8ecf1" text-anchor="start" font-weight="normal">fewer H⁺ → pH rises</text>
<text x="490.0" y="306.0" font-size="13" fill="#5dade2" text-anchor="start" font-weight="normal">respiratory alkalosis</text>
<line x1="120.0" y1="420.0" x2="780.0" y2="420.0" stroke="#aab4c0" stroke-width="2" stroke-linecap="round" opacity="1.0"/>
<rect x="422.5" y="410.0" width="55.0" height="20.0" rx="3" stroke="#58d68d" fill="#58d68d" fill-opacity="0.3" stroke-width="1.5"/>
<line x1="120.0" y1="415.0" x2="120.0" y2="425.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="120.0" y="442.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">6.8</text>
<line x1="230.0" y1="415.0" x2="230.0" y2="425.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="230.0" y="442.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">7.0</text>
<line x1="340.0" y1="415.0" x2="340.0" y2="425.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="340.0" y="442.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">7.2</text>
<line x1="450.0" y1="415.0" x2="450.0" y2="425.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="450.0" y="442.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">7.4</text>
<line x1="560.0" y1="415.0" x2="560.0" y2="425.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="560.0" y="442.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">7.6</text>
<line x1="670.0" y1="415.0" x2="670.0" y2="425.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="670.0" y="442.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">7.8</text>
<line x1="780.0" y1="415.0" x2="780.0" y2="425.0" stroke="#aab4c0" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="780.0" y="442.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">8.0</text>
<text x="450.0" y="404.0" font-size="12" fill="#58d68d" text-anchor="middle" font-weight="normal">normal 7.35–7.45</text>
<text x="120.0" y="404.0" font-size="12" fill="#ff6b6b" text-anchor="start" font-weight="normal">← acidic</text>
<text x="780.0" y="404.0" font-size="12" fill="#5dade2" text-anchor="end" font-weight="normal">alkaline →</text>
<text x="20.0" y="484.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">pH is logarithmic: one pH unit is a tenfold change in hydrogen-ion concentration.  Most CO₂ travels as bicarbonate.</text>
</svg>
