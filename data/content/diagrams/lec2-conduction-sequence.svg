<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 520' width='700' height='520' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The order and timing of conduction</title>
<text x='350.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>One heartbeat, in order</text>
<text x='350.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>SA node → atria → AV node (delay) → AV bundle → branches → Purkinje</text>
<circle cx='48.0' cy='110.0' r='18.0' stroke='#aab4c0' fill='#aab4c0' stroke-width='2' fill-opacity='0.25'/>
<text x='48.0' y='116.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>1</text>
<text x='82.0' y='106.0' font-size='18' fill='#aab4c0' text-anchor='start' font-weight='bold'>All chambers relaxed</text>
<text x='82.0' y='130.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>Waiting for the pacemaker</text>
<line x1='48.0' y1='130.0' x2='48.0' y2='150.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<circle cx='48.0' cy='170.0' r='18.0' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.25'/>
<text x='48.0' y='176.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>2</text>
<text x='82.0' y='166.0' font-size='18' fill='#ff6b6b' text-anchor='start' font-weight='bold'>SA node fires</text>
<text x='82.0' y='190.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>AP spreads over both atria (P wave)</text>
<line x1='48.0' y1='190.0' x2='48.0' y2='210.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<circle cx='48.0' cy='230.0' r='18.0' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.25'/>
<text x='48.0' y='236.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>3</text>
<text x='82.0' y='226.0' font-size='18' fill='#f5b041' text-anchor='start' font-weight='bold'>Atria contract</text>
<text x='82.0' y='250.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>SA → AV node takes about 0.04 s</text>
<line x1='48.0' y1='250.0' x2='48.0' y2='270.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<circle cx='48.0' cy='290.0' r='18.0' stroke='#f4d03f' fill='#f4d03f' stroke-width='2' fill-opacity='0.25'/>
<text x='48.0' y='296.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>4</text>
<text x='82.0' y='286.0' font-size='18' fill='#f4d03f' text-anchor='start' font-weight='bold'>AV node: the slow part</text>
<text x='82.0' y='310.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>~0.11 s delay: small cells, few gap junctions</text>
<line x1='48.0' y1='310.0' x2='48.0' y2='330.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<circle cx='48.0' cy='350.0' r='18.0' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.25'/>
<text x='48.0' y='356.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>5</text>
<text x='82.0' y='346.0' font-size='18' fill='#58d68d' text-anchor='start' font-weight='bold'>AV bundle → bundle branches</text>
<text x='82.0' y='370.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>through the fibrous skeleton, down the septum</text>
<line x1='48.0' y1='370.0' x2='48.0' y2='390.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<circle cx='48.0' cy='410.0' r='18.0' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.25'/>
<text x='48.0' y='416.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>6</text>
<text x='82.0' y='406.0' font-size='18' fill='#5dade2' text-anchor='start' font-weight='bold'>Purkinje fibres</text>
<text x='82.0' y='430.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>fast: big cells, many gap junctions (QRS)</text>
<line x1='48.0' y1='430.0' x2='48.0' y2='450.0' stroke='#aab4c0' stroke-width='2' stroke-linecap='round' opacity='1.0'/>
<circle cx='48.0' cy='470.0' r='18.0' stroke='#bb8fce' fill='#bb8fce' stroke-width='2' fill-opacity='0.25'/>
<text x='48.0' y='476.0' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>7</text>
<text x='82.0' y='466.0' font-size='18' fill='#bb8fce' text-anchor='start' font-weight='bold'>Ventricles contract apex → base</text>
<text x='82.0' y='490.0' font-size='15' fill='#aab4c0' text-anchor='start' font-weight='normal'>a wringing squeeze pushes blood up</text>
</svg>
