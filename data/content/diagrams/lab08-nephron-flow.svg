<text x="40.0" y="98.0" font-size="12" fill="#f5b041" text-anchor="start" font-weight="bold">CORTEX</text>
<text x="40.0" y="278.0" font-size="12" fill="#bb8fce" text-anchor="start" font-weight="bold">MEDULLA (pyramid)</text>
