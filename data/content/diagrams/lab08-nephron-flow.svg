<text x="132.0" y="206.0" font-size="10.5" fill="#ff6b6b" text-anchor="start" font-weight="normal">afferent arteriole</text>
<circle cx="250.0" cy="160.0" r="34.0" stroke="#f4d03f" fill="none" fill-opacity="0.0" stroke-width="2"/>
<circle cx="250.0" cy="160.0" r="22.0" stroke="#ff6b6b" fill="#ff6b6b" fill-opacity="0.35" stroke-width="2"/>
<text x="212.0" y="130.0" font-size="10.5" fill="#e8ecf1" text-anchor="end" font-weight="normal">glomerulus +</text>
<text x="212.0" y="143.1" font-size="10.5" fill="#e8ecf1" text-anchor="end" font-weight="normal">capsule</text>
<path d="M264,142 Q290,100 330,95" stroke="#ff6b6b" fill="none" fill-opacity="1.0" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
