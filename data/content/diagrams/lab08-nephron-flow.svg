<path d="M330,95 Q380,90 400,110 Q420,130 405,150" stroke="#bb8fce" fill="none" fill-opacity="1.0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" stroke-dasharray="3 3"/>
<text x="470.0" y="96.0" font-size="10.5" fill="#bb8fce" text-anchor="start" font-weight="normal">peritubular</text>
<text x="470.0" y="109.1" font-size="10.5" fill="#bb8fce" text-anchor="start" font-weight="normal">capillaries</text>
<path d="M395,250 L395,470 Q410,500 420,470 L420,250" stroke="#bb8fce" fill="none" fill-opacity="1.0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" stroke-dasharray="3 3"/>
<text x="360.0" y="400.0" font-size="10.5" fill="#bb8fce" text-anchor="end" font-weight="normal">vasa</text>
<text x="360.0" y="413.1" font-size="10.5" fill="#bb8fce" text-anchor="end" font-weight="normal">recta</text>
