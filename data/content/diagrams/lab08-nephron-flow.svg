<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="940" height="580" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Renal blood flow and the nephron, in order</title><defs></defs>
<text x="20.0" y="32.0" font-size="18" fill="#e8ecf1" text-anchor="start" font-weight="bold">The nephron and its blood supply</text>
<text x="20.0" y="52.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">Schematic juxtamedullary nephron; blood in red/blue, filtrate in yellow</text>
<rect x="30.0" y="80.0" width="560.0" height="180.0" rx="0" stroke="none" fill="#f5b041" fill-opacity="0.06" stroke-width="0"/>
