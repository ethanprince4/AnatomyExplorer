<text x="446.0" y="360.0" font-size="10.5" fill="#f4d03f" text-anchor="start" font-weight="normal">descending</text>
<text x="446.0" y="373.1" font-size="10.5" fill="#f4d03f" text-anchor="start" font-weight="normal">limb</text>
<path d="M440,470 Q460,505 480,470 L480,230" stroke="#f4d03f" fill="none" fill-opacity="1.0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<text x="486.0" y="440.0" font-size="10.5" fill="#f4d03f" text-anchor="start" font-weight="normal">ascending</text>
<text x="486.0" y="453.1" font-size="10.5" fill="#f4d03f" text-anchor="start" font-weight="normal">limb</text>
<path d="M480,230 C470,200 420,215 400,205 C360,190 300,215 260,196" stroke="#f4d03f" fill="none" fill-opacity="1.0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<text x="372.0" y="240.0" font-size="12" fill="#f4d03f" text-anchor="start" font-weight="bold">DCT</text>
<circle cx="248.0" cy="198.0" r="7.0" stroke="#58d68d" fill="#58d68d" fill-opacity="0.9" stroke-width="1.5"/>
<text x="236.0" y="230.0" font-size="10.5" fill="#58d68d" text-anchor="end" font-weight="normal">juxtaglomerular</text>
<text x="236.0" y="243.1" font-size="10.5" fill="#58d68d" text-anchor="end" font-weight="normal">apparatus</text>
<path d="M266,194 Q520,170 540,160 L540,500" stroke="#48c9b0" fill="none" fill-opacity="1.0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<text x="548.0" y="380.0" font-size="11" fill="#48c9b0" text-anchor="start" font-weight="normal">collecting</text>
<text x="548.0" y="393.8" font-size="11" fill="#48c9b0" text-anchor="start" font-weight="normal">duct</text>
<text x="540.0" y="540.0" font-size="11" fill="#48c9b0" text-anchor="middle" font-weight="normal">→ papilla → minor calyx</text>
<text x="625.0" y="90.0" font-size="14" fill="#ff6b6b" text-anchor="start" font-weight="bold">Blood</text>
<text x="625.0" y="112.0" font-size="12" fill="#ff6b6b" text-anchor="start" font-weight="normal"> 1. renal artery</text>
<text x="625.0" y="131.0" font-size="12" fill="#ff6b6b" text-anchor="start" font-weight="normal"> 2. segmental artery</text>
<text x="625.0" y="150.0" font-size="12" fill="#ff6b6b" text-anchor="start" font-weight="normal"> 3. interlobar artery</text>
<text x="625.0" y="169.0" font-size="12" fill="#ff6b6b" text-anchor="start" font-weight="normal"> 4. arcuate artery</text>
<text x="625.0" y="188.0" font-size="12" fill="#ff6b6b" text-anchor="start" font-weight="normal"> 5. cortical radiate artery</text>
<text x="625.0" y="207.0" font-size="12" fill="#ff6b6b" text-anchor="start" font-weight="normal"> 6. afferent arteriole</text>
<text x="625.0" y="226.0" font-size="12" fill="#f4d03f" text-anchor="start" font-weight="normal"> 7. GLOMERULUS (filtration)</text>
<text x="625.0" y="245.0" font-size="12" fill="#bb8fce" text-anchor="start" font-weight="normal"> 8. efferent arteriole</text>
<text x="625.0" y="264.0" font-size="12" fill="#bb8fce" text-anchor="start" font-weight="normal"> 9. peritubular capillaries / vasa recta</text>
<text x="625.0" y="283.0" font-size="12" fill="#5dade2" text-anchor="start" font-weight="normal">10. cortical radiate vein</text>
<text x="625.0" y="302.0" font-size="12" fill="#5dade2" text-anchor="start" font-weight="normal">11. arcuate vein</text>
<text x="625.0" y="321.0" font-size="12" fill="#5dade2" text-anchor="start" font-weight="normal">12. interlobar vein</text>
<text x="625.0" y="340.0" font-size="12" fill="#5dade2" text-anchor="start" font-weight="normal">13. renal vein</text>
<text x="625.0" y="380.0" font-size="14" fill="#f4d03f" text-anchor="start" font-weight="bold">Filtrate</text>
<text x="625.0" y="402.0" font-size="12" fill="#e8ecf1" text-anchor="start" font-weight="normal">1. capsular space</text>
<text x="625.0" y="421.0" font-size="12" fill="#e8ecf1" text-anchor="start" font-weight="normal">2. proximal convoluted tubule</text>
<text x="625.0" y="440.0" font-size="12" fill="#e8ecf1" text-anchor="start" font-weight="normal">3. nephron loop (desc. → asc.)</text>
<text x="625.0" y="459.0" font-size="12" fill="#e8ecf1" text-anchor="start" font-weight="normal">4. distal convoluted tubule</text>
<text x="625.0" y="478.0" font-size="12" fill="#e8ecf1" text-anchor="start" font-weight="normal">5. collecting duct → papilla</text>
<text x="20.0" y="564.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">Two capillary beds in series: the glomerulus filters, the peritubular capillaries reabsorb.</text>
</svg>
