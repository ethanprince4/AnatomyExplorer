<text x="100.0" y="510.0" font-size="11" fill="#aab4c0" text-anchor="start" font-weight="normal">interlobar a./v.</text>
<line x1="110.0" y1="260.0" x2="110.0" y2="110.0" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<line x1="122.0" y1="260.0" x2="122.0" y2="110.0" stroke="#5dade2" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
<text x="130.0" y="104.0" font-size="11" fill="#aab4c0" text-anchor="start" font-weight="normal">cortical radiate a./v.</text>
