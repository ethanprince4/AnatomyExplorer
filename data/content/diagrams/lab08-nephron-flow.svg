<text x="240.0" y="280.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">arcuate artery / vein</text>
<line x1="80.0" y1="260.0" x2="80.0" y2="520.0" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="1.0"/>
