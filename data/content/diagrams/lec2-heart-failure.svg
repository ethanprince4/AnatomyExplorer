<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 400' width='700' height='400' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Left- and right-sided heart failure</title>
<text x='350.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Congestive heart failure: blood backs up behind the weak side</text>
<rect x='60.0' y='90.0' width='260.0' height='80.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.14'/>
<text x='190.0' y='125.3' font-size='18' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>LEFT side fails</text>
<text x='190.0' y='147.3' font-size='18' fill='#aab4c0' text-anchor='middle' font-weight='normal'>left ventricle can't keep up</text>
<rect x='380.0' y='90.0' width='260.0' height='80.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.14'/>
<text x='510.0' y='125.3' font-size='18' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>RIGHT side fails</text>
<text x='510.0' y='147.3' font-size='18' fill='#aab4c0' text-anchor='middle' font-weight='normal'>right ventricle can't keep up</text>
<line x1='190.0' y1='170.0' x2='190.0' y2='221.0' stroke='#ff6b6b' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='190.0,230.0 184.5,220.5 195.5,220.5' fill='#ff6b6b' stroke='#ff6b6b' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='510.0' y1='170.0' x2='510.0' y2='221.0' stroke='#5dade2' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='510.0,230.0 504.5,220.5 515.5,220.5' fill='#5dade2' stroke='#5dade2' stroke-width='1.5' fill-opacity='1.0'/>
<rect x='60.0' y='230.0' width='260.0' height='80.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.14'/>
<text x='190.0' y='265.6' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Blood backs up into lungs</text>
<text x='190.0' y='286.3' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>pulmonary congestion &amp; edema</text>
<rect x='380.0' y='230.0' width='260.0' height='80.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.14'/>
<text x='510.0' y='265.6' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Blood backs up into body</text>
<text x='510.0' y='286.3' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>peripheral edema (ankles, organs)</text>
<text x='350.0' y='350.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Failure of either side eventually overloads the other,</text>
<text x='350.0' y='370.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>giving a decompensated, seriously weakened heart.</text>
</svg>
