<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 400' width='700' height='400' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Four ways to acquire adaptive immunity</title>
<text x='350.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Active: you make it · Passive: you are given it</text>
<text x='270.0' y='100.0' font-size='18' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Natural</text>
<text x='520.0' y='100.0' font-size='18' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Artificial</text>
<text x='90.0' y='175.0' font-size='18' fill='#58d68d' text-anchor='middle' font-weight='bold'>Active</text>
<text x='90.0' y='300.0' font-size='18' fill='#f5b041' text-anchor='middle' font-weight='bold'>Passive</text>
<rect x='155.0' y='118.0' width='230.0' height='110.0' rx='8' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.14'/>
<text x='270.0' y='149.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Catch the disease</text>
<text x='270.0' y='168.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>natural exposure</text>
<text x='270.0' y='188.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>to the antigen</text>
<text x='270.0' y='207.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>long-lasting memory</text>
<rect x='405.0' y='118.0' width='230.0' height='110.0' rx='8' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.14'/>
<text x='520.0' y='149.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Vaccination</text>
<text x='520.0' y='168.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>deliberate exposure</text>
<text x='520.0' y='188.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>to antigen (vaccine)</text>
<text x='520.0' y='207.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>long-lasting memory</text>
<rect x='155.0' y='245.0' width='230.0' height='110.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='270.0' y='276.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Mother → baby</text>
<text x='270.0' y='295.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>antibodies across</text>
<text x='270.0' y='315.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>placenta &amp; in milk</text>
<text x='270.0' y='334.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>short-lived</text>
<rect x='405.0' y='245.0' width='230.0' height='110.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='520.0' y='276.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Antiserum</text>
<text x='520.0' y='295.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>antibodies from an</text>
<text x='520.0' y='315.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>immune animal/person</text>
<text x='520.0' y='334.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>immediate, short-lived</text>
<text x='350.0' y='385.0' font-size='13' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Antiserum: rabies, hepatitis, measles, tetanus, diphtheria, botulism, snake &amp; black widow venom</text>
</svg>
