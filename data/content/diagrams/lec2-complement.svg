<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 450' width='720' height='450' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The complement cascade and what it does</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Complement: ~20 blood proteins that switch each other on</text>
<rect x='30.0' y='80.0' width='300.0' height='70.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='180.0' y='110.6' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Alternative pathway</text>
<text x='180.0' y='131.3' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>innate: C3 binds the microbe</text>
<rect x='390.0' y='80.0' width='300.0' height='70.0' rx='8' stroke='#bb8fce' fill='#bb8fce' stroke-width='2' fill-opacity='0.14'/>
<text x='540.0' y='110.6' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Classical pathway</text>
<text x='540.0' y='131.3' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>adaptive: needs antibody on antigen</text>
<rect x='210.0' y='195.0' width='300.0' height='60.0' rx='8' stroke='#f4d03f' fill='#f4d03f' stroke-width='2' fill-opacity='0.14'/>
<text x='360.0' y='220.6' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Activated C3 → cascade</text>
<text x='360.0' y='241.3' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>C1–C9, factors B, D, P</text>
<line x1='180.0' y1='150.0' x2='281.7' y2='191.6' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='290.0,195.0 279.1,196.5 283.3,186.3' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='540.0' y1='150.0' x2='438.3' y2='191.6' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='430.0,195.0 436.7,186.3 440.9,196.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<rect x='20.0' y='310.0' width='215.0' height='100.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.14'/>
<text x='127.5' y='336.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>MAC</text>
<text x='127.5' y='355.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>membrane attack</text>
<text x='127.5' y='375.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>complex: a channel</text>
<text x='127.5' y='394.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ cell lysis</text>
<rect x='252.0' y='310.0' width='215.0' height='100.0' rx='8' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.14'/>
<text x='359.5' y='346.1' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Opsonization</text>
<text x='359.5' y='365.6' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>coats the bacterium</text>
<text x='359.5' y='385.1' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>→ phagocytosis</text>
<rect x='485.0' y='310.0' width='215.0' height='100.0' rx='8' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.14'/>
<text x='592.5' y='346.1' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Chemotaxis &amp;</text>
<text x='592.5' y='365.6' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>inflammation</text>
<text x='592.5' y='385.1' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>attracts white cells</text>
<line x1='360.0' y1='255.0' x2='136.8' y2='307.9' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='128.0,310.0 136.0,302.5 138.5,313.2' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='360.0' y1='255.0' x2='360.0' y2='301.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='360.0,310.0 354.5,300.5 365.5,300.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='360.0' y1='255.0' x2='583.2' y2='307.9' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='592.0,310.0 581.5,313.2 584.0,302.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
</svg>
