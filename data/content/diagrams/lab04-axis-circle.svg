<text x="257.2" y="444.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">a normal axis</text><text x="257.2" y="461.1" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">(here +40°)</text>
<text x="300.0" y="326.0" font-size="1" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="normal" opacity="1.0"></text>
<text x="590.0" y="90.0" font-size="15" stroke="none" fill="#58d68d" text-anchor="start" font-weight="bold" opacity="1.0">Normal: 0° to +90°</text>
<text x="590.0" y="110.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">(many accept −30° to +90°)</text>
<text x="590.0" y="150.0" font-size="15" stroke="none" fill="#f5b041" text-anchor="start" font-weight="bold" opacity="1.0">Left axis deviation</text>
<text x="590.0" y="170.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">&lt; 0° (or &lt; −30°):</text><text x="590.0" y="184.6" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">left ventricular hypertrophy,</text><text x="590.0" y="199.3" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">left bundle branch block,</text><text x="590.0" y="213.9" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">heart pushed left</text>
<text x="590.0" y="270.0" font-size="15" stroke="none" fill="#5dade2" text-anchor="start" font-weight="bold" opacity="1.0">Right axis deviation</text>
<text x="590.0" y="290.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">&gt; +90°: right ventricular</text><text x="590.0" y="304.6" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">hypertrophy, heart pushed</text><text x="590.0" y="319.3" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">right, left-sided damage</text>
<text x="590.0" y="380.0" font-size="15" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">How to find it</text>
<text x="590.0" y="400.0" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">net QRS in a lead =</text><text x="590.0" y="414.6" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">R height − (Q + S depth).</text><text x="590.0" y="429.3" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">Plot lead I along 0°,</text><text x="590.0" y="443.9" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">lead III along +120°;</text><text x="590.0" y="458.6" font-size="12" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">the resultant is the axis.</text>
<text x="20.0" y="30.0" font-size="18" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Mean electrical axis</text>
<text x="20.0" y="52.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">0° points to the patient's left, +90° straight down</text>
</svg>
