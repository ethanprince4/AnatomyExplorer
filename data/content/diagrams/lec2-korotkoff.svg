<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 420' width='720' height='420' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Measuring blood pressure by listening</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Auscultatory blood pressure: the Korotkoff sounds</text>
<text x='360.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Cuff pressure falls slowly; listen over the brachial artery</text>
<line x1='70.0' y1='308.0' x2='680.0' y2='308.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.5' stroke-dasharray='4 6'/>
<text x='62.0' y='313.0' font-size='14' fill='#aab4c0' text-anchor='end' font-weight='normal'>80</text>
<line x1='70.0' y1='204.0' x2='680.0' y2='204.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.5' stroke-dasharray='4 6'/>
<text x='62.0' y='209.0' font-size='14' fill='#aab4c0' text-anchor='end' font-weight='normal'>120</text>
<line x1='70.0' y1='152.0' x2='680.0' y2='152.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.5' stroke-dasharray='4 6'/>
<text x='62.0' y='157.0' font-size='14' fill='#aab4c0' text-anchor='end' font-weight='normal'>140</text>
<text x='20.0' y='126.0' font-size='13' fill='#aab4c0' text-anchor='start' font-weight='normal'>mm Hg</text>
<path d='M70,308.0 C80,308.0 84,204.0 92,204.0 C104,204.0 110,276.8 136,308.0 C146,308.0 150,204.0 158,204.0 C170,204.0 176,276.8 202,308.0 C212,308.0 216,204.0 224,204.0 C236,204.0 242,276.8 268,308.0 C278,308.0 282,204.0 290,204.0 C302,204.0 308,276.8 334,308.0 C344,308.0 348,204.0 356,204.0 C368,204.0 374,276.8 400,308.0 C410,308.0 414,204.0 422,204.0 C434,204.0 440,276.8 466,308.0 C476,308.0 480,204.0 488,204.0 C500,204.0 506,276.8 532,308.0 C542,308.0 546,204.0 554,204.0 C566,204.0 572,276.8 598,308.0 C608,308.0 612,204.0 620,204.0 C632,204.0 638,276.8 664,308.0' stroke='#ff6b6b' fill='none' stroke-width='3' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<path d='M70,126.0 L680,334.0' stroke='#5dade2' fill='none' stroke-width='3.5' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<text x='680.0' y='358.0' font-size='15' fill='#5dade2' text-anchor='end' font-weight='bold'>cuff pressure</text>
<text x='74.0' y='330.0' font-size='15' fill='#ff6b6b' text-anchor='start' font-weight='bold'>arterial pressure (pulses 120/80)</text>
<rect x='298.8' y='126.0' width='305.0' height='208.0' rx='4' stroke='#f4d03f' fill='#f4d03f' stroke-width='1' fill-opacity='0.1'/>
<line x1='298.8' y1='126.0' x2='298.8' y2='339.2' stroke='#f4d03f' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<line x1='603.8' y1='126.0' x2='603.8' y2='339.2' stroke='#f4d03f' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<text x='298.8' y='392.0' font-size='15' fill='#f4d03f' text-anchor='middle' font-weight='bold'>1st sound = SYSTOLIC</text>
<text x='603.8' y='392.0' font-size='15' fill='#f4d03f' text-anchor='middle' font-weight='bold'>silence = DIASTOLIC</text>
<text x='451.2' y='136.4' font-size='14' fill='#f4d03f' text-anchor='middle' font-weight='normal'>turbulent spurts: tapping sounds</text>
<text x='184.4' y='118.4' font-size='13' fill='#aab4c0' text-anchor='middle' font-weight='normal'>cuff &gt; systolic:</text>
<text x='184.4' y='136.4' font-size='13' fill='#aab4c0' text-anchor='middle' font-weight='normal'>silent</text>
</svg>
