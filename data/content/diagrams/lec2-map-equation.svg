<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 430' width='700' height='430' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>What sets mean arterial pressure</title>
<text x='350.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Mean arterial pressure = cardiac output × peripheral resistance</text>
<rect x='250.0' y='80.0' width='200.0' height='62.0' rx='8' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.14'/>
<text x='350.0' y='106.1' font-size='19' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>MAP</text>
<text x='350.0' y='129.2' font-size='19' fill='#aab4c0' text-anchor='middle' font-weight='normal'>≈ 100 mm Hg</text>
<rect x='70.0' y='195.0' width='230.0' height='62.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='185.0' y='221.6' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Cardiac output (CO)</text>
<text x='185.0' y='242.3' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>≈ 5 L/min at rest</text>
<rect x='400.0' y='195.0' width='230.0' height='62.0' rx='8' stroke='#bb8fce' fill='#bb8fce' stroke-width='2' fill-opacity='0.14'/>
<text x='515.0' y='221.6' font-size='17' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Peripheral resistance</text>
<text x='515.0' y='242.3' font-size='17' fill='#aab4c0' text-anchor='middle' font-weight='normal'>mostly vessel diameter</text>
<line x1='185.0' y1='195.0' x2='291.7' y2='148.6' stroke='#f5b041' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='300.0,145.0 293.5,153.8 289.1,143.8' fill='#f5b041' stroke='#f5b041' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='515.0' y1='195.0' x2='408.3' y2='148.6' stroke='#bb8fce' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='400.0,145.0 410.9,143.8 406.5,153.8' fill='#bb8fce' stroke='#bb8fce' stroke-width='1.5' fill-opacity='1.0'/>
<text x='350.0' y='182.0' font-size='30' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>×</text>
<rect x='20.0' y='315.0' width='170.0' height='62.0' rx='8' stroke='#f4d03f' fill='#f4d03f' stroke-width='2' fill-opacity='0.14'/>
<text x='105.0' y='341.8' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Stroke volume</text>
<text x='105.0' y='361.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>EDV − ESV</text>
<rect x='210.0' y='315.0' width='150.0' height='62.0' rx='8' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.14'/>
<text x='285.0' y='341.8' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Heart rate</text>
<text x='285.0' y='361.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>beats/min</text>
<line x1='105.0' y1='315.0' x2='144.3' y2='267.0' stroke='#f4d03f' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='150.0,260.0 148.2,270.9 139.7,263.9' fill='#f4d03f' stroke='#f4d03f' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='285.0' y1='315.0' x2='250.3' y2='267.3' stroke='#58d68d' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='245.0,260.0 255.1,264.5 246.2,270.9' fill='#58d68d' stroke='#58d68d' stroke-width='1.5' fill-opacity='1.0'/>
<text x='200.0' y='352.0' font-size='26' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>×</text>
<text x='390.0' y='330.0' font-size='16' fill='#e8ecf1' text-anchor='start' font-weight='normal'>70 mL/beat × 75 beats/min</text>
<text x='390.0' y='352.0' font-size='16' fill='#e8ecf1' text-anchor='start' font-weight='normal'>= 5250 mL/min</text>
<text x='390.0' y='374.0' font-size='16' fill='#e8ecf1' text-anchor='start' font-weight='normal'>SV: 120 mL − 50 mL = 70 mL</text>
</svg>
