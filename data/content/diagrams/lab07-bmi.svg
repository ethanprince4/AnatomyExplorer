<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>BMI categories and waist-to-hip ratio risk bands</title><defs></defs>
<text x="20.0" y="32.0" font-size="18" fill="#e8ecf1" text-anchor="start" font-weight="bold">Body composition indices</text>
<text x="20.0" y="52.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">BMI = kg ÷ m²  (= lb ÷ in² × 703)      WHR = waist ÷ hip</text>
<rect x="80.0" y="130.0" width="103.6" height="40.0" rx="0" stroke="#5dade2" fill="#5dade2" fill-opacity="0.28" stroke-width="1.5"/>
<text x="131.8" y="155.0" font-size="13" fill="#e8ecf1" text-anchor="middle" font-weight="bold">underweight</text>
<text x="131.8" y="190.0" font-size="12" fill="#5dade2" text-anchor="middle" font-weight="normal">&lt; 18.5</text>
<rect x="183.6" y="130.0" width="192.4" height="40.0" rx="0" stroke="#58d68d" fill="#58d68d" fill-opacity="0.28" stroke-width="1.5"/>
<text x="279.8" y="155.0" font-size="13" fill="#e8ecf1" text-anchor="middle" font-weight="bold">normal weight</text>
<text x="279.8" y="190.0" font-size="12" fill="#58d68d" text-anchor="middle" font-weight="normal">18.5–24.9</text>
<rect x="376.0" y="130.0" width="148.0" height="40.0" rx="0" stroke="#f5b041" fill="#f5b041" fill-opacity="0.28" stroke-width="1.5"/>
<text x="450.0" y="155.0" font-size="13" fill="#e8ecf1" text-anchor="middle" font-weight="bold">overweight</text>
<text x="450.0" y="190.0" font-size="12" fill="#f5b041" text-anchor="middle" font-weight="normal">25–29.9</text>
<rect x="524.0" y="130.0" width="296.0" height="40.0" rx="0" stroke="#ff6b6b" fill="#ff6b6b" fill-opacity="0.28" stroke-width="1.5"/>
<text x="672.0" y="155.0" font-size="13" fill="#e8ecf1" text-anchor="middle" font-weight="bold">obese</text>
<text x="672.0" y="190.0" font-size="12" fill="#ff6b6b" text-anchor="middle" font-weight="normal">≥ 30</text>
<text x="80.0" y="122.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">15</text>
<text x="183.6" y="122.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">18.5</text>
<text x="376.0" y="122.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">25</text>
<text x="524.0" y="122.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">30</text>
<text x="672.0" y="122.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">35</text>
<text x="820.0" y="122.0" font-size="11" fill="#aab4c0" text-anchor="middle" font-weight="normal">40</text>
<text x="80.0" y="220.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">Example: 70 kg, 1.75 m → 70 ÷ 3.06 ≈ 22.9 (normal).</text>
<text x="80.0" y="235.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">BMI overestimates fat in muscular people and underestimates it in the elderly.</text>
<text x="80.0" y="280.0" font-size="14" fill="#e8ecf1" text-anchor="start" font-weight="bold">Waist-to-hip ratio: health risk</text>
<text x="80.0" y="298.0" font-size="12" fill="#aab4c0" text-anchor="start" font-weight="normal">waist measured just above the umbilicus, hips at their widest</text>
<text x="80.0" y="337.0" font-size="14" fill="#e8ecf1" text-anchor="start" font-weight="bold">Women</text>
<rect x="200.0" y="312.0" width="162.8" height="40.0" rx="0" stroke="#58d68d" fill="#58d68d" fill-opacity="0.28" stroke-width="1.5"/>
<rect x="362.8" y="312.0" width="77.5" height="40.0" rx="0" stroke="#f5b041" fill="#f5b041" fill-opacity="0.28" stroke-width="1.5"/>
<rect x="440.2" y="312.0" width="379.8" height="40.0" rx="0" stroke="#ff6b6b" fill="#ff6b6b" fill-opacity="0.28" stroke-width="1.5"/>
<text x="281.4" y="337.0" font-size="12.5" fill="#e8ecf1" text-anchor="middle" font-weight="normal">low</text>
<text x="281.4" y="368.0" font-size="12" fill="#58d68d" text-anchor="middle" font-weight="normal">≤0.80</text>
<text x="401.5" y="337.0" font-size="12.5" fill="#e8ecf1" text-anchor="middle" font-weight="normal">mod.</text>
<text x="401.5" y="368.0" font-size="12" fill="#f5b041" text-anchor="middle" font-weight="normal">0.81–0.85</text>
<text x="630.1" y="337.0" font-size="12.5" fill="#e8ecf1" text-anchor="middle" font-weight="normal">high</text>
<text x="630.1" y="368.0" font-size="12" fill="#ff6b6b" text-anchor="middle" font-weight="normal">&gt;0.85</text>
<text x="80.0" y="410.0" font-size="14" fill="#e8ecf1" text-anchor="start" font-weight="bold">Men</text>
<rect x="200.0" y="385.0" width="395.2" height="40.0" rx="0" stroke="#58d68d" fill="#58d68d" fill-opacity="0.28" stroke-width="1.5"/>
<rect x="595.2" y="385.0" width="77.5" height="40.0" rx="0" stroke="#f5b041" fill="#f5b041" fill-opacity="0.28" stroke-width="1.5"/>
<rect x="672.7" y="385.0" width="147.3" height="40.0" rx="0" stroke="#ff6b6b" fill="#ff6b6b" fill-opacity="0.28" stroke-width="1.5"/>
<text x="397.6" y="410.0" font-size="12.5" fill="#e8ecf1" text-anchor="middle" font-weight="normal">low</text>
<text x="397.6" y="441.0" font-size="12" fill="#58d68d" text-anchor="middle" font-weight="normal">≤0.95</text>
<text x="634.0" y="410.0" font-size="12.5" fill="#e8ecf1" text-anchor="middle" font-weight="normal">mod.</text>
<text x="634.0" y="441.0" font-size="12" fill="#f5b041" text-anchor="middle" font-weight="normal">0.96–1.00</text>
<text x="746.4" y="410.0" font-size="12.5" fill="#e8ecf1" text-anchor="middle" font-weight="normal">high</text>
<text x="746.4" y="441.0" font-size="12" fill="#ff6b6b" text-anchor="middle" font-weight="normal">&gt;1.0</text>
<text x="80.0" y="470.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">Apple shape (central, abdominal fat) carries more risk than pear shape (fat on hips and thighs).</text>
<text x="20.0" y="504.0" font-size="12.5" fill="#aab4c0" text-anchor="start" font-weight="normal">BMI categories as used by the US National Heart, Lung, and Blood Institute (NHLBI).</text>
</svg>
