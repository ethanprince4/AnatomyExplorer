<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' width='700' height='500' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Action potential of a contractile cardiac muscle cell</title>
<text x='350.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Contractile cardiac cell: the action potential</text>
<text x='350.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Ventricular muscle, not the pacemaker</text>
<line x1='84.0' y1='120.0' x2='640.0' y2='120.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.5' stroke-dasharray='4 6'/>
<text x='78.0' y='125.0' font-size='14' fill='#aab4c0' text-anchor='end' font-weight='normal'>+30</text>
<line x1='84.0' y1='183.0' x2='640.0' y2='183.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.5' stroke-dasharray='4 6'/>
<text x='78.0' y='188.0' font-size='14' fill='#aab4c0' text-anchor='end' font-weight='normal'>0</text>
<line x1='84.0' y1='372.0' x2='640.0' y2='372.0' stroke='#aab4c0' stroke-width='1' stroke-linecap='round' opacity='0.5' stroke-dasharray='4 6'/>
<text x='78.0' y='377.0' font-size='14' fill='#aab4c0' text-anchor='end' font-weight='normal'>-90</text>
<text x='30.0' y='246.0' font-size='14' fill='#aab4c0' text-anchor='start' font-weight='normal'>mV</text>
<path d='M90,372.0 L130,372.0 L142,120.0 L170,166.2 C230,174.6 350,178.8 390,204.0 C430,246.0 450,367.8 490,372.0 L620,372.0' stroke='#e8ecf1' fill='none' stroke-width='3.5' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<circle cx='136.0' cy='225.0' r='15.0' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.3'/>
<text x='136.0' y='231.0' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>1</text>
<circle cx='162.0' cy='106.4' r='15.0' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.3'/>
<text x='162.0' y='112.4' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>2</text>
<circle cx='280.0' cy='148.6' r='15.0' stroke='#f4d03f' fill='#f4d03f' stroke-width='2' fill-opacity='0.3'/>
<text x='280.0' y='154.6' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>3</text>
<circle cx='462.0' cy='288.0' r='15.0' stroke='#5dade2' fill='#5dade2' stroke-width='2' fill-opacity='0.3'/>
<text x='462.0' y='294.0' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>4</text>
<text x='395.0' y='130.0' font-size='14' fill='#e8ecf1' text-anchor='start' font-weight='normal'>1 Depolarization: fast Na⁺ in</text>
<text x='395.0' y='150.0' font-size='14' fill='#e8ecf1' text-anchor='start' font-weight='normal'>2 Early repolarization: Na⁺ shut, a little K⁺ out</text>
<text x='395.0' y='170.0' font-size='14' fill='#e8ecf1' text-anchor='start' font-weight='normal'>3 Plateau: slow Ca²⁺ in balances K⁺ out</text>
<text x='395.0' y='190.0' font-size='14' fill='#e8ecf1' text-anchor='start' font-weight='normal'>4 Final repolarization: K⁺ out, back to -90</text>
<rect x='130.0' y='385.0' width='300.0' height='26.0' rx='4' stroke='#ff6b6b' fill='#ff6b6b' stroke-width='2' fill-opacity='0.35'/>
<text x='280.0' y='403.0' font-size='14' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>absolute refractory: no new AP possible</text>
<rect x='430.0' y='385.0' width='70.0' height='26.0' rx='4' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.35'/>
<text x='465.0' y='430.0' font-size='14' fill='#f5b041' text-anchor='middle' font-weight='bold'>relative</text>
<text x='350.0' y='468.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>The refractory period lasts almost as long as the contraction,</text>
<text x='350.0' y='487.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>so cardiac muscle cannot be tetanized.</text>
</svg>
