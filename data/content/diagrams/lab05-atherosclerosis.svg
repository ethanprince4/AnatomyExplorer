<circle cx="200.0" cy="210.0" r="52.0" stroke="none" fill="#f1948a" fill-opacity="0.35" stroke-width="0" opacity="1.0"/>
<circle cx="200.0" cy="210.0" r="52.0" stroke="#f1948a" fill="#ff6b6b" fill-opacity="0.9" stroke-width="2" opacity="1.0"/>
<text x="200.0" y="360.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="middle" font-weight="normal" opacity="1.0">wide lumen, elastic wall</text>
<text x="200.0" y="60.0" font-size="16" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="bold" opacity="1.0">Healthy artery</text>
<circle cx="590.0" cy="210.0" r="130.0" stroke="none" fill="#c8c8c8" fill-opacity="0.22" stroke-width="0" opacity="1.0"/>
<circle cx="590.0" cy="210.0" r="98.0" stroke="none" fill="#ff6b6b" fill-opacity="0.45" stroke-width="0" opacity="1.0"/>
<circle cx="590.0" cy="210.0" r="52.0" stroke="none" fill="#f1948a" fill-opacity="0.35" stroke-width="0" opacity="1.0"/>
<path d="M540,192 Q560,155 610,160 Q645,180 640,220 Q600,205 580,220 Q550,228 540,192 Z" stroke="#f5b041" fill="#f5b041" fill-opacity="0.75" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<path d="M540,230 Q585,270 638,228 Q595,232 540,230 Z" stroke="#ff6b6b" fill="#ff5050" fill-opacity="0.9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
<text x="730.0" y="150.0" font-size="13" stroke="none" fill="#f5b041" text-anchor="start" font-weight="normal" opacity="1.0">cholesterol plaque</text><text x="730.0" y="165.9" font-size="13" stroke="none" fill="#f5b041" text-anchor="start" font-weight="normal" opacity="1.0">deep to the endothelium,</text><text x="730.0" y="181.7" font-size="13" stroke="none" fill="#f5b041" text-anchor="start" font-weight="normal" opacity="1.0">in the intima</text>
<text x="730.0" y="250.0" font-size="13" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="normal" opacity="1.0">narrow lumen;</text><text x="730.0" y="265.9" font-size="13" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="normal" opacity="1.0">thrombus may form</text><text x="730.0" y="281.7" font-size="13" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="normal" opacity="1.0">on a ruptured plaque</text>
<text x="590.0" y="60.0" font-size="16" stroke="none" fill="#e8ecf1" text-anchor="middle" font-weight="bold" opacity="1.0">Artery with plaque</text>
<text x="20.0" y="30.0" font-size="18" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Arteriosclerosis ('hardening of the arteries')</text>
<text x="20.0" y="390.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">Loss of elasticity + narrowing = less flow; in the coronary arteries this is coronary artery disease.</text>
</svg>
