<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 520' width='720' height='520' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Fluid exchange across a capillary</title>
<text x='360.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Out at the arterial end, back in at the venous end</text>
<text x='360.0' y='60.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Lecture: 30 L/day out, 27 L back, 3 L becomes lymph · numbers below are the textbook's</text>
<rect x='60.0' y='155.0' width='600.0' height='60.0' rx='26' stroke='#aab4c0' fill='#bb8fce' stroke-width='2' fill-opacity='0.18'/>
<text x='90.0' y='191.0' font-size='16' fill='#ff6b6b' text-anchor='start' font-weight='bold'>arterial end</text>
<text x='630.0' y='191.0' font-size='16' fill='#5dade2' text-anchor='end' font-weight='bold'>venous end</text>
<line x1='130.0' y1='152.0' x2='130.0' y2='101.0' stroke='#f5b041' stroke-width='3' stroke-linecap='round' opacity='1.0'/>
<polygon points='130.0,92.0 135.5,101.5 124.5,101.5' fill='#f5b041' stroke='#f5b041' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='190.0' y1='152.0' x2='190.0' y2='101.0' stroke='#f5b041' stroke-width='3' stroke-linecap='round' opacity='1.0'/>
<polygon points='190.0,92.0 195.5,101.5 184.5,101.5' fill='#f5b041' stroke='#f5b041' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='250.0' y1='152.0' x2='250.0' y2='101.0' stroke='#f5b041' stroke-width='3' stroke-linecap='round' opacity='1.0'/>
<polygon points='250.0,92.0 255.5,101.5 244.5,101.5' fill='#f5b041' stroke='#f5b041' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='470.0' y1='92.0' x2='470.0' y2='143.0' stroke='#5dade2' stroke-width='3' stroke-linecap='round' opacity='1.0'/>
<polygon points='470.0,152.0 464.5,142.5 475.5,142.5' fill='#5dade2' stroke='#5dade2' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='530.0' y1='92.0' x2='530.0' y2='143.0' stroke='#5dade2' stroke-width='3' stroke-linecap='round' opacity='1.0'/>
<polygon points='530.0,152.0 524.5,142.5 535.5,142.5' fill='#5dade2' stroke='#5dade2' stroke-width='1.5' fill-opacity='1.0'/>
<line x1='590.0' y1='92.0' x2='590.0' y2='143.0' stroke='#5dade2' stroke-width='3' stroke-linecap='round' opacity='1.0'/>
<polygon points='590.0,152.0 584.5,142.5 595.5,142.5' fill='#5dade2' stroke='#5dade2' stroke-width='1.5' fill-opacity='1.0'/>
<text x='190.0' y='86.0' font-size='15' fill='#f5b041' text-anchor='middle' font-weight='bold'>fluid OUT</text>
<text x='530.0' y='86.0' font-size='15' fill='#5dade2' text-anchor='middle' font-weight='bold'>fluid back IN</text>
<text x='70.0' y='245.0' font-size='14' fill='#f5b041' text-anchor='start' font-weight='normal'>blood pressure 30 − tissue (−3) = 33 out</text>
<text x='70.0' y='264.0' font-size='14' fill='#f5b041' text-anchor='start' font-weight='normal'>osmotic pull 28 − 8 = 20 in</text>
<text x='70.0' y='283.0' font-size='14' fill='#f5b041' text-anchor='start' font-weight='normal'>net 13 mm Hg OUT</text>
<text x='440.0' y='245.0' font-size='14' fill='#5dade2' text-anchor='start' font-weight='normal'>blood pressure 10 − tissue (−3) = 13 out</text>
<text x='440.0' y='264.0' font-size='14' fill='#5dade2' text-anchor='start' font-weight='normal'>osmotic pull 28 − 8 = 20 in</text>
<text x='440.0' y='283.0' font-size='14' fill='#5dade2' text-anchor='start' font-weight='normal'>net 7 mm Hg IN</text>
<line x1='360.0' y1='218.0' x2='360.0' y2='291.0' stroke='#58d68d' stroke-width='3' stroke-linecap='round' opacity='1.0'/>
<polygon points='360.0,300.0 354.5,290.5 365.5,290.5' fill='#58d68d' stroke='#58d68d' stroke-width='1.5' fill-opacity='1.0'/>
<text x='360.0' y='322.0' font-size='14' fill='#58d68d' text-anchor='middle' font-weight='bold'>~10% stays in tissue → lymphatic capillaries</text>
<text x='60.0' y='380.0' font-size='14' fill='#aab4c0' text-anchor='start' font-weight='normal'>Blood pressure pushes fluid OUT; plasma proteins (albumin) pull water IN by osmosis.</text>
<text x='60.0' y='401.0' font-size='14' fill='#aab4c0' text-anchor='start' font-weight='normal'>Blood pressure falls along the capillary (30 → 10 mm Hg); the osmotic pull stays ≈ 20.</text>
<text x='60.0' y='422.0' font-size='14' fill='#aab4c0' text-anchor='start' font-weight='normal'>Lipid-soluble (O₂, CO₂, steroids, fatty acids) diffuse through membranes;</text>
<text x='60.0' y='443.0' font-size='14' fill='#aab4c0' text-anchor='start' font-weight='normal'>water-soluble (glucose, amino acids) go between cells or through fenestrae.</text>
</svg>
