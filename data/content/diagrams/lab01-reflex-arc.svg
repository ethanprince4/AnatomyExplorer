<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430">
  <title>The five parts of a reflex arc</title>
  <ellipse cx="500.0" cy="210.0" rx="105.0" ry="78.0" stroke="#9aa4b1" stroke-width="2" fill="#8a96a3" fill-opacity="0.18"/>
  <path d="M 490.0 202.0 L 458.0 144.0 L 468.0 140.0 L 482.0 176.0 L 472.0 200.0 L 438.0 232.0 L 436.0 260.0 L 466.0 266.0 L 482.0 240.0 L 490.0 222.0 L 510.0 222.0 L 518.0 240.0 L 534.0 266.0 L 564.0 260.0 L 562.0 232.0 L 528.0 200.0 L 518.0 176.0 L 532.0 140.0 L 542.0 144.0 L 510.0 202.0 Z" stroke="#9aa4b1" stroke-width="1.5" fill="#b0a0c0" fill-opacity="0.35" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="500.0" y="122.0" fill="#9aa4b1" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">posterior (dorsal)</text>
  <text x="500.0" y="306.0" fill="#9aa4b1" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">anterior (ventral)</text>
  <text x="620.0" y="150.0" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Spinal cord</text>
  <text x="620.0" y="166.9" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">grey matter (H) inside,</text>
  <text x="620.0" y="183.8" fill="#e6e9ee" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">white matter outside</text>
  <ellipse cx="330.0" cy="130.0" rx="24.0" ry="15.0" stroke="#5ab4f0" stroke-width="2" fill="#5ab4f0" fill-opacity="0.3"/>
  <text x="330.0" y="106.0" fill="#5ab4f0" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Dorsal root ganglion</text>
  <text x="330.0" y="162.0" fill="#9aa4b1" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">(sensory cell bodies)</text>
  <circle cx="70.0" cy="120.0" r="12.0" stroke="#5ab4f0" stroke-width="2" fill="#5ab4f0" fill-opacity="0.4"/>
  <text x="70.0" y="98.0" fill="#5ab4f0" font-size="14" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">1 Receptor</text>
  <path d="M 82 120 Q 200 110 306 130" stroke="#5ab4f0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 354 130 Q 410 125 462 160" stroke="#5ab4f0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 462.0 160.0 L 453.4 157.4 L 457.9 152.0 Z" stroke="#5ab4f0" stroke-width="1" fill="#5ab4f0" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="150.0" y="148.0" fill="#5ab4f0" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">2 Sensory (afferent) neuron</text>
  <text x="150.0" y="164.9" fill="#5ab4f0" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">enters by the dorsal root</text>
  <path d="M 464 164 Q 490 205 462 238" stroke="#b98ae0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="464.0" cy="164.0" r="5.0" stroke="#b98ae0" stroke-width="2" fill="#b98ae0" fill-opacity="1"/>
  <text x="620.0" y="220.0" fill="#b98ae0" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">3 Integration centre</text>
  <text x="620.0" y="236.9" fill="#b98ae0" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">synapse(s) in the grey matter;</text>
  <text x="620.0" y="253.8" fill="#b98ae0" font-size="13" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">an interneuron if polysynaptic</text>
  <line x1="615.0" y1="215.0" x2="482.0" y2="210.0" stroke="#b98ae0" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
  <circle cx="458.0" cy="246.0" r="9.0" stroke="#ef7a7a" stroke-width="2" fill="#ef7a7a" fill-opacity="0.5"/>
  <path d="M 452 254 Q 390 320 320 310 Q 250 305 135 340" stroke="#ef7a7a" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 135.0 340.0 L 142.1 334.5 L 143.9 341.2 Z" stroke="#ef7a7a" stroke-width="1" fill="#ef7a7a" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="250.0" y="345.0" fill="#ef7a7a" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">4 Motor (efferent) neuron</text>
  <text x="250.0" y="361.9" fill="#ef7a7a" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">leaves by the ventral root</text>
  <ellipse cx="80.0" cy="350.0" rx="50.0" ry="22.0" stroke="#7ccf86" stroke-width="2" fill="#7ccf86" fill-opacity="0.3"/>
  <text x="80.0" y="395.0" fill="#7ccf86" font-size="14" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">5 Effector</text>
  <text x="80.0" y="412.0" fill="#9aa4b1" font-size="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">muscle or gland</text>
  <text x="410.0" y="24.0" fill="#9aa4b1" font-size="13" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Both roots join to form the spinal nerve, which carries sensory and motor fibres</text>
  <line x1="440.0" y1="150.0" x2="410.0" y2="60.0" stroke="#f2b24c" stroke-width="2" stroke-linecap="round"/>
  <path d="M 410.0 60.0 L 415.9 66.8 L 409.3 69.0 Z" stroke="#f2b24c" stroke-width="1" fill="#f2b24c" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="416.0" y="60.0" fill="#f2b24c" font-size="12" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">copy to the brain (ascending tracts)</text>
</svg>
