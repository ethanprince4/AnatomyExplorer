<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 470' width='640' height='470' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The structure of an antibody</title>
<text x='320.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>An antibody (immunoglobulin): a Y of four chains</text>
<path d='M306,420 L306,250 L200,130' stroke='#5dade2' fill='none' stroke-width='18' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<path d='M334,420 L334,250 L440,130' stroke='#5dade2' fill='none' stroke-width='18' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<path d='M276,250 L170,128' stroke='#58d68d' fill='none' stroke-width='14' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<path d='M364,250 L470,128' stroke='#58d68d' fill='none' stroke-width='14' stroke-linejoin='round' stroke-linecap='round' fill-opacity='1.0'/>
<circle cx='170.0' cy='108.0' r='26.0' stroke='#f5b041' fill='#f5b041' stroke-width='3' fill-opacity='0.35'/>
<circle cx='470.0' cy='108.0' r='26.0' stroke='#f5b041' fill='#f5b041' stroke-width='3' fill-opacity='0.35'/>
<text x='320.0' y='82.0' font-size='16' fill='#f5b041' text-anchor='middle' font-weight='bold'>antigen-binding sites (variable region)</text>
<text x='495.0' y='250.0' font-size='16' fill='#58d68d' text-anchor='start' font-weight='bold'>light chain</text>
<text x='372.0' y='380.0' font-size='16' fill='#5dade2' text-anchor='start' font-weight='bold'>heavy chain</text>
<rect x='280.0' y='300.0' width='80.0' height='125.0' rx='6' stroke='#bb8fce' fill='none' stroke-width='2.5' fill-opacity='1.0' stroke-dasharray='6 5'/>
<text x='270.0' y='345.0' font-size='15' fill='#bb8fce' text-anchor='end' font-weight='bold'>constant</text>
<text x='270.0' y='363.8' font-size='15' fill='#bb8fce' text-anchor='end' font-weight='bold'>region</text>
<text x='20.0' y='445.0' font-size='13' fill='#aab4c0' text-anchor='start' font-weight='normal'>2 identical heavy + 2 identical light chains · constant region activates complement or binds white cells</text>
</svg>
