<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 400' width='700' height='400' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Preload, Frank-Starling and afterload</title>
<text x='350.0' y='34.0' font-size='21' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>Intrinsic regulation: stretch in, force out</text>
<rect x='30.0' y='90.0' width='300.0' height='110.0' rx='8' stroke='#58d68d' fill='#58d68d' stroke-width='2' fill-opacity='0.14'/>
<text x='180.0' y='121.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>PRELOAD</text>
<text x='180.0' y='140.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>how much the ventricle is stretched</text>
<text x='180.0' y='160.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>by the blood in it (EDV)</text>
<text x='180.0' y='179.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>more stretch → more force</text>
<rect x='370.0' y='90.0' width='300.0' height='110.0' rx='8' stroke='#f4d03f' fill='#f4d03f' stroke-width='2' fill-opacity='0.14'/>
<text x='520.0' y='121.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>FRANK-STARLING</text>
<text x='520.0' y='140.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>greater stretch = greater force</text>
<text x='520.0' y='160.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>of contraction</text>
<text x='520.0' y='179.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>the heart pumps what it is given</text>
<line x1='330.0' y1='145.0' x2='361.0' y2='145.0' stroke='#aab4c0' stroke-width='2.5' stroke-linecap='round' opacity='1.0'/>
<polygon points='370.0,145.0 360.5,150.5 360.5,139.5' fill='#aab4c0' stroke='#aab4c0' stroke-width='1.5' fill-opacity='1.0'/>
<rect x='200.0' y='250.0' width='300.0' height='110.0' rx='8' stroke='#f5b041' fill='#f5b041' stroke-width='2' fill-opacity='0.14'/>
<text x='350.0' y='281.3' font-size='16' fill='#e8ecf1' text-anchor='middle' font-weight='bold'>AFTERLOAD</text>
<text x='350.0' y='300.8' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>pressure the ventricle must beat</text>
<text x='350.0' y='320.4' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>to open the aortic valve</text>
<text x='350.0' y='339.9' font-size='16' fill='#aab4c0' text-anchor='middle' font-weight='normal'>heart is less sensitive to this than to preload</text>
<text x='350.0' y='385.0' font-size='15' fill='#aab4c0' text-anchor='middle' font-weight='normal'>Exercise raises venous return → preload ↑ → SV ↑, with no nerves required.</text>
</svg>
