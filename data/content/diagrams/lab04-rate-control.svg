<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>What speeds or slows the heart</title><defs><marker id="ah-58d68d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58d68d"/></marker><marker id="ah-5dade2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5dade2"/></marker><marker id="ah-aab4c0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab4c0"/></marker><marker id="ah-bb8fce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bb8fce"/></marker><marker id="ah-c9d1dc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1dc"/></marker><marker id="ah-e8ecf1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8ecf1"/></marker><marker id="ah-f1948a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f1948a"/></marker><marker id="ah-f4d03f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4d03f"/></marker><marker id="ah-f5b041" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5b041"/></marker><marker id="ah-ff6b6b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker></defs>
<text x="20.0" y="70.0" font-size="14" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="bold" opacity="1.0">Agent</text>
<text x="290.0" y="70.0" font-size="14" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="bold" opacity="1.0">Acts on</text>
<text x="560.0" y="70.0" font-size="14" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="bold" opacity="1.0">Chronotropic (rate)</text>
<text x="760.0" y="70.0" font-size="14" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="bold" opacity="1.0">Inotropic (force)</text>
<line x1="20.0" y1="80.0" x2="880.0" y2="80.0" stroke="#aab4c0" fill="none" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="20.0" y="110.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Acetylcholine (vagus)</text>
<text x="290.0" y="110.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">muscarinic (M2)</text>
<text x="560.0" y="110.0" font-size="14" stroke="none" fill="#5dade2" text-anchor="start" font-weight="bold" opacity="1.0">↓↓ rate</text>
<text x="760.0" y="110.0" font-size="14" stroke="none" fill="#5dade2" text-anchor="start" font-weight="bold" opacity="1.0">–</text>
<line x1="20.0" y1="124.0" x2="880.0" y2="124.0" stroke="#aab4c0" fill="none" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
<text x="20.0" y="152.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Pilocarpine</text>
<text x="290.0" y="152.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">muscarinic agonist</text>
<text x="560.0" y="152.0" font-size="14" stroke="none" fill="#5dade2" text-anchor="start" font-weight="bold" opacity="1.0">↓ rate</text>
<text x="760.0" y="152.0" font-size="14" stroke="none" fill="#5dade2" text-anchor="start" font-weight="bold" opacity="1.0">–</text>
<line x1="20.0" y1="166.0" x2="880.0" y2="166.0" stroke="#aab4c0" fill="none" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
<text x="20.0" y="194.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Atropine</text>
<text x="290.0" y="194.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">muscarinic antagonist</text>
<text x="560.0" y="194.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">↑ rate (blocks vagal tone)</text>
<text x="760.0" y="194.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">–</text>
<line x1="20.0" y1="208.0" x2="880.0" y2="208.0" stroke="#aab4c0" fill="none" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
<text x="20.0" y="236.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Epinephrine / norepinephrine</text>
<text x="290.0" y="236.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">β1 adrenergic</text>
<text x="560.0" y="236.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">↑ rate</text>
<text x="760.0" y="236.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">↑ force</text>
<line x1="20.0" y1="250.0" x2="880.0" y2="250.0" stroke="#aab4c0" fill="none" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
<text x="20.0" y="278.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Caffeine</text>
<text x="290.0" y="278.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">phosphodiesterase inhibitor (↑cAMP)</text>
<text x="560.0" y="278.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">↑ rate</text>
<text x="760.0" y="278.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">↑ force</text>
<line x1="20.0" y1="292.0" x2="880.0" y2="292.0" stroke="#aab4c0" fill="none" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
<text x="20.0" y="320.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Extra Ca²⁺ (CaCl₂)</text>
<text x="290.0" y="320.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">more Ca²⁺ entry</text>
<text x="560.0" y="320.0" font-size="14" stroke="none" fill="#f5b041" text-anchor="start" font-weight="bold" opacity="1.0">(arrhythmia if excess)</text>
<text x="760.0" y="320.0" font-size="14" stroke="none" fill="#f5b041" text-anchor="start" font-weight="bold" opacity="1.0">↑ force</text>
<line x1="20.0" y1="334.0" x2="880.0" y2="334.0" stroke="#aab4c0" fill="none" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
<text x="20.0" y="362.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Cold</text>
<text x="290.0" y="362.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">slower ion channels &amp; enzymes</text>
<text x="560.0" y="362.0" font-size="14" stroke="none" fill="#5dade2" text-anchor="start" font-weight="bold" opacity="1.0">↓ rate</text>
<text x="760.0" y="362.0" font-size="14" stroke="none" fill="#5dade2" text-anchor="start" font-weight="bold" opacity="1.0"></text>
<line x1="20.0" y1="376.0" x2="880.0" y2="376.0" stroke="#aab4c0" fill="none" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
<text x="20.0" y="404.0" font-size="14" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Warmth (to 37 °C)</text>
<text x="290.0" y="404.0" font-size="13" stroke="none" fill="#aab4c0" text-anchor="start" font-weight="normal" opacity="1.0">faster kinetics (Q10 ≈ 2)</text>
<text x="560.0" y="404.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0">↑ rate</text>
<text x="760.0" y="404.0" font-size="14" stroke="none" fill="#ff6b6b" text-anchor="start" font-weight="bold" opacity="1.0"></text>
<line x1="20.0" y1="418.0" x2="880.0" y2="418.0" stroke="#aab4c0" fill="none" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
<text x="20.0" y="30.0" font-size="16" stroke="none" fill="#e8ecf1" text-anchor="start" font-weight="bold" opacity="1.0">Chronotropic = rate, inotropic = force.  Cardiac output = heart rate × stroke volume</text>
</svg>
