<text x="25" y="433" font-size="20">Compression spreads overlapping tissue and reduces motion and thickness.</text>
<text x="25" y="472" font-size="19" fill="#b7c9d5">Look for the source-marked opacity or calcifications on the actual mammogram.</text>
<text x="25" y="507" font-size="18" fill="#b7c9d5">An atlas breast surface locates anatomy; it does not simulate mammographic density.</text>
<text x="25" y="544" font-size="16" fill="#9fb7c7">Teaching source: ACR/RSNA RadiologyInfo, Mammography. Diagram geometry is illustrative.</text>
