name: Publish completed release builds
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed release workflow run containing both successful build artifacts
        required: true
      tag:
        description: Existing release tag
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    # macOS because prepare_release_assets.py builds the Mac installer app with osacompile, codesign and ditto.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Prepare storage for both completed platform artifacts
        run: python packaging/prepare_release_runner.py
      - uses: actions/download-artifact@v8
        with:
          name: LayeredHuman-Setup-Windows.exe
          path: assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: LayeredHuman-macOS-AppleSilicon.dmg
          path: assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare installer downloads within GitHub size limit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python packaging/prepare_release_assets.py assets "$RELEASE_TAG"
      - name: Join the platforms' install notes (builds from a release run prepared their own installers)
        run: python packaging/prepare_release_assets.py --combine-notes assets
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: Layered Human ${{ inputs.tag }}
          draft: true
          files: assets/*
          fail_on_unmatched_files: true
          body: >-
            Refreshed UI and post-refined model library. Existing users can use the in-app updater normally.
            New installations: installers exceed GitHub's file limit. Windows: download
            Install-Layered-Human-Windows.exe and double-click it. Mac: download Install-Layered-Human-Mac.dmg, open it and double-click
            Install Layered Human. See INSTALL-DOWNLOADS.md.
      - name: Publish completed uploads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
