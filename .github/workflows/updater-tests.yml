name: Updater safety tests
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: updater-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  updater:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaged TLS roots
        run: python -m pip install certifi==2026.7.22
      - name: Test update failures and recovery
        run: |
          python -m unittest discover -s tests -p 'test_updater.py' -v
          python -m unittest discover -s tests -p 'test_updater_channels.py' -v
          python -m unittest discover -s tests -p 'test_update_packaging.py' -v
          python -m unittest discover -s tests -p 'test_fixture_paths.py' -v
          python -m unittest discover -s tests -p 'test_updater_tls.py' -v
  picking:
    name: App regressions (${{ matrix.os }})
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: List LFS objects
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - name: Restore atlas fixture cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          enableCrossOsArchive: true
      - name: Fetch regression atlas fixtures
        shell: bash
        run: |
          git lfs pull
          if git lfs ls-files | grep -q ' - '; then echo "some LFS files were not fetched"; exit 1; fi
          rm .lfs-assets-id
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test picking, study recovery and general bug fixes
        run: python -m unittest discover -s tests -v
      - name: Require actual Mac production ID readback controls
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: python -m app.picking_diagnostics --gpu-controls-only --report mac-release-gpu-controls.json
      - name: Preserve Mac production ID readback evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mac-release-gpu-controls
          path: mac-release-gpu-controls.json
          if-no-files-found: warn
