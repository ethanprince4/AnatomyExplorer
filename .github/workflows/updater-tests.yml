name: Updater safety tests
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: updater-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  updater:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test update failures and recovery
        run: python -m unittest discover -s tests -p 'test_updater.py' -v
  picking:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test Retina mapping and failed picking readbacks
        run: python -m unittest discover -s tests -p 'test_atlas_picking.py' -v
