# Builds the Windows installer and the macOS (Apple silicon) disk image and attaches them to a GitHub Release
# under fixed names, so the README's download links (releases/latest/download/<name>) always get the newest one.
#
#   Push a tag:      git tag v1.0.0 && git push origin v1.0.0      -> builds and publishes release v1.0.0
#   Run by hand:     Actions > Release > Run workflow               -> builds; publishes only if a tag is given
name: Release

on:
  pull_request:
    paths: ['app/**', 'packaging/**', 'tests/**', 'requirements.txt', '.github/workflows/**']
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v1.0.1). Leave empty to only build (downloads under the run's Artifacts)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  safety:
    name: Release safety gate
    uses: ./.github/workflows/updater-tests.yml
  diagnostics:
    name: Mac diagnostic gate
    uses: ./.github/workflows/mac-diagnostics.yml
    with:
      # An explicit temporary PR label requests one bounded plugin experiment.
      # It never waives the original runtime tree gate or allocates an installer.
      ownership_candidate: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'qt-ownership-candidate') }}
  build:
    name: Build (${{ matrix.name }})
    # A failed source check prevents allocation of either expensive build runner.
    needs: [safety, diagnostics]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            asset: AnatomyExplorer-Setup-Windows.exe
            jobs: 4
          - name: macOS Apple silicon
            os: macos-14
            asset: AnatomyExplorer-macOS-AppleSilicon.dmg
            jobs: 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '3.1.2' }}
      APP_NAME: ${{ contains(github.event.inputs.tag || github.ref_name, '-preview.') && 'Anatomy Explorer Experimental' || 'Anatomy Explorer' }}
    steps:
      # identical line endings on every runner, so the micro-model source digest matches what the cache was built with
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      # LFS files are fetched through a cache: each download of the two ~150 MB atlas buffers, the kidney model and
      # the large Sketchfab models counts against the repository's LFS bandwidth allowance
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          enableCrossOsArchive: true

      - name: Fetch LFS files
        run: |
          git lfs pull
          if git lfs ls-files | grep -q ' - '; then echo "some LFS files were not fetched"; exit 1; fi
          rm .lfs-assets-id

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # built meshes are reused as long as app/micro is unchanged (prebuild.py rebuilds any stale model anyway)
      - name: Restore micro-model cache
        uses: actions/cache@v4
        with:
          path: data/micro_cache
          key: micro-${{ runner.os }}-${{ hashFiles('app/micro/**/*.py') }}
          restore-keys: micro-${{ runner.os }}-

      - name: Install Inno Setup if the image lacks it
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && ! command -v iscc; then
            choco install innosetup -y --no-progress
          fi

      - name: Build
        run: python packaging/build.py --version "$VERSION" --jobs ${{ matrix.jobs }}

      - name: Verify installer in disposable temporary installation
        if: runner.os == 'Windows'
        run: python packaging/check_install.py packaging/dist/release/AnatomyExplorer-Setup-Windows.exe

      - name: Check frozen Windows runtime and Qt plugin
        if: runner.os == 'Windows'
        run: python packaging/check_runtime.py packaging/dist/AnatomyExplorer/AnatomyExplorer.exe

      - name: Check frozen macOS runtime and Qt plugin
        if: runner.os == 'macOS'
        run: python packaging/check_runtime.py "packaging/dist/$APP_NAME.app/Contents/MacOS/AnatomyExplorer"

      - name: Check real frozen Windows HTTPS with packaged roots
        if: runner.os == 'Windows'
        run: python packaging/check_https.py packaging/dist/AnatomyExplorer/AnatomyExplorer.exe

      - name: Check real frozen macOS HTTPS with packaged roots
        if: runner.os == 'macOS'
        run: python packaging/check_https.py "packaging/dist/$APP_NAME.app/Contents/MacOS/AnatomyExplorer"

      - name: Verify real signed macOS incremental update and rollback
        if: runner.os == 'macOS'
        run: python packaging/check_mac_update.py "packaging/dist/$APP_NAME.app" packaging/dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: packaging/dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release
    needs: [build, safety, diagnostics]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - run: ls -la assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Anatomy Explorer ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-preview.') }}
          make_latest: ${{ contains(github.event.inputs.tag || github.ref_name, '-preview.') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            assets/*
          body: >-
            ${{ contains(github.event.inputs.tag || github.ref_name, '-preview.') && 'EXPERIMENTAL PREVIEW. Opt in through Updates > Enable experimental stuff in the stable app. These draft models may have bugs and are excluded from default stable updates. Turn the setting off to return to stable on the next launch. Separate preview installers use a separate application name and preserve the original stable installation. Notes, study progress and settings are preserved. Apple-silicon Mac DMG and Windows installer are attached. Existing signing limitations described in the README still apply.' || 'Stable update: Adds Updates > Enable experimental stuff, unchecked by default. Existing v3.1.1 installs with working HTTPS receive this feature through their incremental updater. Affected Mac v3.1.1 clients reporting certificate verification failure may need this fixed installer once; certificate verification remains enabled. Explicit opt-in downloads separately published experimental drafts; disable it to return to stable on the next launch. Your current study session is never restarted, and notes, progress, settings and the original install are preserved. Unfinished model drafts remain excluded from this stable release. Apple-silicon Mac DMG and Windows installer are attached. Existing signing limitations described in the README still apply.' }}
