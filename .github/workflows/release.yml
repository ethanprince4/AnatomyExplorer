# Builds the Windows installer and the macOS (Apple silicon) disk image and attaches them to a GitHub Release
# under fixed names, so the README's download links (releases/latest/download/<name>) always get the newest one.
#
#   Run by hand:     Actions > Release > Run workflow -> builds; publishes only if a tag is given.
# App/model snapshot tags are published separately and do not rebuild full installers.
name: Release

# Pull requests run no checks: the only checks kept are the ones that caught real bugs (a file missing from the
# installers, wrong picking on Mac), and they run here, before a release is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v1.0.1). Leave empty to only build (downloads under the run's Artifacts)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  picking:
    # Clicking a structure on a Mac reads its id back from the GPU; this once returned wrong ids on Mac only.
    name: Mac picking check
    runs-on: macos-14
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: cocoa
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install PySide6==6.11.2 moderngl==5.12.0 numpy==2.4.6
      - name: Install the shipped Cocoa plugin
        run: python packaging/install_cocoa.py
      - name: Check production ID readback on the Mac GPU
        run: python -m app.picking_diagnostics --gpu-controls-only --report mac-gpu-controls.json
  build:
    name: Build (${{ matrix.name }})
    # A failed picking check stops the release before either build runner starts.
    needs: [picking]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            asset: LayeredHuman-Setup-Windows.exe
            jobs: 4
          - name: macOS Apple silicon
            os: macos-14
            asset: LayeredHuman-macOS-AppleSilicon.dmg
            jobs: 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v3.90.1-preview.1' }}
      APP_NAME: ${{ contains(github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v3.90.1-preview.1', '-preview.') && 'Layered Human Experimental' || 'Layered Human' }}
      AE_RELEASE_HARDLINKS: '1'
    steps:
      # identical line endings on every runner, so the micro-model source digest matches what the cache was built with
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      # Cache only selected large models and atlas buffers; unselected
      # historical model versions are excluded.
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Use runner temporary storage
        run: |
          for name in TMPDIR TEMP TMP; do
            printf '%s=%s\n' "$name" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          done

      - name: Prepare bounded release storage and selected LFS cache key
        run: python packaging/prepare_release_runner.py

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          enableCrossOsArchive: true

      - name: Fetch LFS files
        run: |
          python packaging/prepare_release_runner.py --fetch-lfs
          rm .lfs-assets-id

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # The selected post-only library replaces procedural baseline caches.
      - name: Restore micro-model cache for legacy source builds only
        if: hashFiles('data/local_model_library/library.json') == ''
        uses: actions/cache@v6
        with:
          path: data/micro_cache
          key: micro-${{ runner.os }}-${{ hashFiles('app/micro/**/*.py') }}
          restore-keys: micro-${{ runner.os }}-

      - name: Install Inno Setup if the image lacks it
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && ! command -v iscc; then
            choco install innosetup -y --no-progress
          fi

      - name: Build
        run: python packaging/build.py --version "$VERSION" --jobs ${{ matrix.jobs }}

      - name: Verify installer in disposable temporary installation
        if: runner.os == 'Windows'
        run: python packaging/check_install.py packaging/dist/release/LayeredHuman-Setup-Windows.exe packaging/dist/LayeredHuman

      - name: Check frozen Windows runtime and Qt plugin
        if: runner.os == 'Windows'
        run: python packaging/check_runtime.py packaging/dist/LayeredHuman/LayeredHuman.exe

      - name: Check frozen macOS runtime and Qt plugin
        if: runner.os == 'macOS'
        run: python packaging/check_runtime.py "packaging/dist/$APP_NAME.app/Contents/MacOS/LayeredHuman"

      - name: Require final signed frozen Cocoa identity and selected-tree semantics
        if: runner.os == 'macOS'
        run: python packaging/check_cocoa.py "packaging/dist/$APP_NAME.app/Contents/MacOS/LayeredHuman"

      - name: Preserve final frozen Cocoa evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: frozen-mac-cocoa-controls
          path: packaging/build/frozen-cocoa/
          if-no-files-found: warn

      - name: Check real frozen Windows HTTPS with packaged roots
        if: runner.os == 'Windows'
        env:
          AE_HTTPS_CHECK_TOKEN: ${{ github.token }}
        run: python packaging/check_https.py packaging/dist/LayeredHuman/LayeredHuman.exe

      - name: Check real frozen macOS HTTPS with packaged roots
        if: runner.os == 'macOS'
        env:
          AE_HTTPS_CHECK_TOKEN: ${{ github.token }}
        run: python packaging/check_https.py "packaging/dist/$APP_NAME.app/Contents/MacOS/LayeredHuman"

      - name: Verify real signed macOS incremental update and rollback
        if: runner.os == 'macOS'
        run: python packaging/check_mac_update.py "packaging/dist/$APP_NAME.app" packaging/dist/release

      # Split here, where the installer already is: a separate job downloading both installers to split them and
      # uploading them again took over half an hour per release on a macOS runner (v4.0.3).
      - name: Prepare release downloads (split oversized installer, Mac installer app)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        run: python packaging/prepare_release_assets.py packaging/dist/release "$VERSION" --notes "INSTALL-DOWNLOADS-${{ runner.os }}.md"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: packaging/dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    # Ubuntu, not macOS: from macOS runners the large release assets stalled mid-upload (v4.0.2), while Ubuntu has
    # published every release in minutes.
    runs-on: ubuntu-latest
    # The upload action sets no timeout of its own, so a stalled connection to GitHub would otherwise hold the job for
    # six hours. Re-run the job when it times out.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Prepare storage for both completed platform artifacts
        run: python3 packaging/prepare_release_runner.py
      - uses: actions/download-artifact@v8
        with:
          name: LayeredHuman-Setup-Windows.exe
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: LayeredHuman-macOS-AppleSilicon.dmg
          path: assets
      - name: Join the platforms' install notes
        run: python3 packaging/prepare_release_assets.py --combine-notes assets

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Layered Human ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-preview.') }}
          make_latest: ${{ contains(github.event.inputs.tag || github.ref_name, '-preview.') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            assets/*
          body_path: docs/releases/${{ github.event.inputs.tag || github.ref_name }}.md
